lesson: py-08
title: "Text as pieces"
strand: py
stage: 1
thoughts:
  split: "`sentence.split()` cuts text at its spaces into a list of words."
  join-words: "`' '.join(words)` puts a list of words back into text, with the text before the dot put between them."
  tidy: "`.lower()` makes every letter small and `.strip()` takes spaces off the ends. Text is tidied before it is compared, because `'The'` and `'the'` are different things."
  positions: "`range(len(words))` gives the positions themselves, for when the loop has to know where it is."
  neighbours: "`words[i]` and `words[i + 1]` are an item and the one after it. The loop stops one short of the end, so that there is always a next one."
  pair-as-key: "A pair can be a name in a dict, because a pair cannot change under it."
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "table-is-list-of-rows", "cell", "sorted", "key-function", "lambda", "tie-rule", "for-each", "new-list-in-loop", "add-to-end"]
    text: "Write a function called `by_fee` that takes the rows of a table and hands back their order_ids, the biggest delivery fee first, and orders with the same fee in order of their id."
    check: |-
      print(by_fee([
          {'order_id': 104843, 'delivery_fee': 8.99},
          {'order_id': 102388, 'delivery_fee': 4.99},
          {'order_id': 101248, 'delivery_fee': 4.99},
          {'order_id': 103434, 'delivery_fee': 6.99},
      ]))
    model: |-
      def by_fee(rows):
          ranked = sorted(rows, key=lambda row: (-row['delivery_fee'], row['order_id']))
          ids = []
          for row in ranked:
              ids.append(row['order_id'])
          return ids
    output: "[104843, 103434, 101248, 102388]"
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from PY-7: a lambda on rows, a pair for a key with a minus, and a loop to pull a cell out. A combination not practised. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["split"]
    text: |-
      Today the things in the lists are words. A sentence is just text, and text can be cut at its spaces into a list of words. The way to ask is `.split()`, written after the text.

      ```python
      sentence = 'the order was late'
      words = sentence.split()
      print(words)
      print(len(words))
      ```

      Run it.
    shows:
      - |-
        sentence = 'the order was late'
        words = sentence.split()
        print(words)
        print(len(words))
    after_run: "A list of four words, and then 4. Split cut the text wherever there was a space. And a list is a list: everything you can do with a list, you can now do with a sentence. Count it, loop through it, sort it, cut it."
    note: "split. The after_run says plainly what it opens up, so that the next steps are recombinations of PY-1 to PY-7."

  # 3
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "split", "how-many", "sorted", "key-function", "lambda", "last"]
    text: "Write a function called `longest_word` that takes a sentence and hands back its longest word."
    check: "print(longest_word('the order was late'))"
    model: |-
      def longest_word(sentence):
          words = sentence.split()
          return sorted(words, key=lambda w: len(w))[-1]
    output: "order"
    narration:
      - "Order, with five letters. The sentence became a list of words, and then it was a sort by length, taking the last."
      - "Cut into words, sorted by how long each is, and the last one is the longest."
      - ""
    wrong:
      - code: |-
          def longest_word(sentence):
              words = sentence.split()
              return sorted(words)[-1]
        ask: "That is the last in alphabetical order. What should the words be sorted by?"
        why: "with no key, words are sorted by their letters. The key says to look at the length."
      - code: |-
          def longest_word(sentence):
              return sorted(sentence, key=lambda w: len(w))[-1]
        ask: "Python is sorting something that is not words. What has to be done to the sentence before it can be sorted as words?"
        why: "text sorts as single letters. split cuts it into a list of words first."
      - code: |-
          def longest_word(sentence):
              words = sentence.split()
              return sorted(words, key=lambda w: len(w))[0]
        ask: "That is the shortest. Which end of a sorted list has the longest?"
        why: "sorting goes upward, so the biggest is at the end."
    walk:
      - "Cut the sentence into words."
      - "Sort the words with a key that says how long each is."
      - "Hand back the one at the end."
    return:
      text: "Write `last_word`, which takes a sentence and hands back its last word."
      check: "print(last_word('the order was late'))"
      model: |-
        def last_word(sentence):
            words = sentence.split()
            return words[-1]
      output: "late"
      narration:
        - "Late. Cut into words, take the last. Nothing sorted."
        - "Split, and then the last item of the list."
      note: "Return for step 3."
    note: "split asked at once, with PY-7's key. The sentence 'the order was late' has one longest word, so there is no tie."

  # 4
  - kind: "give"
    lang: "python"
    new: ["join-words"]
    text: |-
      Going the other way is just as common: a list of words, put back together as text. The way to ask is `.join()`, and the odd thing is that the text that goes between the words comes first, before the dot.

      ```python
      words = ['the', 'order', 'was', 'late']
      print(' '.join(words))
      print('-'.join(words))
      ```

      Run it.
    shows:
      - |-
        words = ['the', 'order', 'was', 'late']
        print(' '.join(words))
        print('-'.join(words))
    after_run: "The words, glued with a space, and then glued with a dash. The text in front of the dot is what goes between the words. It reads backwards, and there is no reason for it. It just is, and it comes up in interviews a lot."
    note: "join. The order (glue first) is the one arbitrary part, and the text says so ('it just is'), which is rule B6 in practice."

  # 5
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "split", "join-words", "sorted"]
    text: "Write a function called `alphabetical` that takes a sentence and hands back the same words as one text, in alphabetical order, with a space between them."
    check: "print(alphabetical('the order was late'))"
    model: |-
      def alphabetical(sentence):
          words = sentence.split()
          return ' '.join(sorted(words))
    output: "late order the was"
    narration:
      - "Late order the was. Cut into a list, sorted, and glued back with a space. Text in, text out, and a list in the middle."
      - "The sentence went into pieces, was put in order, and came back as a sentence."
      - ""
    wrong:
      - code: |-
          def alphabetical(sentence):
              words = sentence.split()
              return sorted(words)
        ask: "That is a list. What was I asking to get back?"
        why: "the answer is text, so the list has to be glued back with join."
      - code: |-
          def alphabetical(sentence):
              words = sentence.split()
              return words.join(' ')
        ask: "Python says a list has no join. Which comes first before the dot: the list, or the text that goes between?"
        why: "the glue is the text before the dot, and the list goes inside the brackets."
      - code: |-
          def alphabetical(sentence):
              return ' '.join(sorted(sentence))
        ask: "Look at what came back: single letters. What has to happen to the sentence before it is sorted?"
        why: "sorting text sorts its letters. split cuts it into words first."
    walk:
      - "Cut the sentence into words."
      - "Sort them."
      - "Put them back together as text, with a space between."
    return:
      text: "Write `longest_first_text`, which takes a sentence and hands back its words as one text, longest first, with a space between them."
      check: "print(longest_first_text('a pizza was late'))"
      model: |-
        def longest_first_text(sentence):
            words = sentence.split()
            return ' '.join(sorted(words, key=lambda w: len(w), reverse=True))
      output: "pizza late was a"
      narration:
        - "Pizza late was a: the longest first. The same round trip, with a key and a turn-round in the middle."
        - "Text to list, sort by length, list to text."
      note: "Return for step 5. The sentence has four different lengths, so there is no tie."
    note: "split and join together, with PY-2's sorted. The learner builds the whole round trip: text, list, text."

  # 6
  - kind: "give"
    lang: "python"
    new: ["tidy"]
    text: |-
      Before you compare words, tidy them. To Python, `'The'` and `'the'` are different. A different capital, a different thing, as `'Delivered'` and `'delivered'` were different to SQL. Two small tools tidy text: `.lower()` makes every letter small, and `.strip()` takes spaces off both ends.

      ```python
      text = '  The Order Was LATE '
      print(text.strip())
      print(text.lower())
      print(text.strip().lower())
      ```

      Run it.
    shows:
      - |-
        text = '  The Order Was LATE '
        print(text.strip())
        print(text.lower())
        print(text.strip().lower())
    after_run: "Three versions of the same text: the spaces gone, the capitals gone, and both. You can put one after the other, left to right, and each works on what the one before it handed over. Tidy first, then compare."
    note: "tidy. Two small tools, named once. The reason for lower is real, and it is the same trap SQL had."

  # 7
  - kind: "classmate"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "split", "tidy", "for-each", "if-question", "equals-asks", "running-result"]
    text: "Davi wanted to know how many times the word the appears in a sentence. He wrote a loop through `sentence.split()`, asking whether each word was equal to 'the'. On 'The order was late and the courier was lost' it said 1. Davi, what is the first word, exactly? ... Capital T, which is not equal to a small t. Write `count_word`, which takes a sentence and a word, and hands back how many times that word appears, whatever the capitals."
    check: |-
      print(count_word('The order was late and the courier was lost', 'the'))
      print(count_word('The order was late and THE courier was lost', 'The'))
    model: |-
      def count_word(sentence, word):
          count = 0
          for w in sentence.lower().split():
              if w == word.lower():
                  count = count + 1
          return count
    output: |-
      2
      2
    narration:
      - "2 now: The and the were both counted. Both sides of the comparison were made small before they were asked."
      - "Tidy both, then compare. The sentence and the word each had their capitals taken off."
      - ""
    wrong:
      - code: |-
          def count_word(sentence, word):
              count = 0
              for w in sentence.split():
                  if w == word:
                      count = count + 1
              return count
        ask: "That is Davi's version, and it says 1. What does the first word start with, and what does word start with?"
        why: "a capital T is not a small t. Words have to be made small before they are compared."
      - code: |-
          def count_word(sentence, word):
              count = 0
              for w in sentence.lower().split():
                  if w == word:
                      count = count + 1
              return count
        ask: "Try it with the word The, with a capital. What is left to make small?"
        why: "both sides of a comparison have to be tidied, or the word you were given can still have a capital."
      - code: |-
          def count_word(sentence, word):
              count = 0
              for w in sentence.lower().split():
                  if w == word.lower():
                      count = count + 1
                  return count
        ask: "Check how many words got looked at. Where does the return belong?"
        why: "the return waits until the loop is finished."
    walk:
      - "Make the sentence small and cut it into words."
      - "Go through the words, and ask of each whether it is equal to the word you were given, also made small."
      - "Count the yeses, and hand the count back."
    return:
      text: "Write `count_long`, which takes a sentence and a number n, and hands back how many of its words have more than n letters."
      check: "print(count_long('The order was late and the courier was lost', 4))"
      model: |-
        def count_long(sentence, n):
            count = 0
            for w in sentence.split():
                if len(w) > n:
                    count = count + 1
            return count
      output: "2"
      narration:
        - "2: order and courier. Late and lost have four letters, which is not more than 4. The same loop and count, with a question about each word's length."
        - "A count of the words that pass a question about their size."
      note: "Return for step 7."
    note: "The classmate's slip is a wrong number, not an error, so Davi's own output is the reason. The learner repairs by writing the function. A first use of lower in anger, and a step that needs tidy on both sides. Sample: 'The order was late and the courier was lost' and 'the' counts twice."

  # 8
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "split", "join-words", "tidy"]
    text: "Write a function called `tidy_sentence` that takes a sentence with stray capitals and extra spaces, and hands it back as small letters, with exactly one space between the words and none at the ends."
    check: |-
      result = tidy_sentence('  The  Order was   LATE ')
      print(result)
      print(len(result))
    model: |-
      def tidy_sentence(text):
          return ' '.join(text.lower().split())
    output: |-
      the order was late
      18
    narration:
      - "The capitals gone and the spaces evened out: 18 characters, and no more. Split ignores any run of spaces, so cutting and gluing back leaves exactly one."
      - "Small letters, cut into words, glued with a single space."
      - ""
    wrong:
      - code: |-
          def tidy_sentence(text):
              return text.lower().strip()
        ask: "Look at the spaces between the words. Which tool takes spaces off the ends only?"
        why: "strip works on the two ends. The spaces between the words need the cut and the glue."
      - code: |-
          def tidy_sentence(text):
              return ' '.join(text.split())
        ask: "The capitals are still there. What was I asking about the letters?"
        why: "lower is a tidy step of its own."
      - code: |-
          def tidy_sentence(text):
              return text.lower().split()
        ask: "That is a list of words. What was I asking to get back?"
        why: "the answer is text, so it is glued back with join."
    walk:
      - "Make every letter small."
      - "Cut it into words. That throws the extra spaces away."
      - "Glue the words back with one space."
    return:
      text: "Write `sorted_tidy`, which takes a sentence and hands back its words as one text, in small letters, in alphabetical order, with one space between."
      check: "print(sorted_tidy('  The  Order was   LATE '))"
      model: |-
        def sorted_tidy(text):
            return ' '.join(sorted(text.lower().split()))
      output: "late order the was"
      narration:
        - "Late order the was: small letters, cut, sorted, glued. The step you just did, with a sort in the middle."
        - "Tidy, cut, sort, glue."
      note: "Return for step 8."
    note: "A recombination of split, join and tidy in the order lower, split, join. The model does not use strip because split already does its job, which the narration says."

  # 9
  - kind: "give"
    lang: "python"
    new: ["positions"]
    text: |-
      So far a loop has gone through the items, one at a time. Sometimes you need to know where you are in the list. That means going through the positions: `range(len(words))` gives 0, 1, 2 and so on, as far as the last position, and the loop name is a position, not a word.

      ```python
      words = ['the', 'order', 'was', 'late']
      for i in range(len(words)):
          print(i, words[i])
      ```

      Run it.
    shows:
      - |-
        words = ['the', 'order', 'was', 'late']
        for i in range(len(words)):
            print(i, words[i])
    after_run: "0 the, 1 order, 2 was, 3 late. The loop went through the numbers, and words[i] picked the word at each one. You do this when you need the position itself, or the item beside it, and that is the next step."
    note: "positions. Range only waits until here because this is its real reason: earlier loops never needed a position."

  # 10
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "pair", "positions", "how-many", "new-list-in-loop", "add-to-end", "for-each"]
    text: "Write a function called `with_lengths` that takes a list of words and hands back a list of pairs: each position, and the length of the word at that position."
    check: "print(with_lengths(['the', 'order', 'was']))"
    model: |-
      def with_lengths(words):
          result = []
          for i in range(len(words)):
              result.append((i, len(words[i])))
          return result
    output: "[(0, 3), (1, 5), (2, 3)]"
    narration:
      - "Position 0 has 3 letters, position 1 has 5. The loop went through the positions, and each turn built a pair of the position and something about the word at it."
      - "Positions, a pair for each, collected in a list."
      - ""
    wrong:
      - code: |-
          def with_lengths(words):
              result = []
              for i in range(len(words)):
                  result.append((i, len(words[i])))
        ask: "The check got nothing. What does the function have to do after the loop?"
        why: "it still has to hand the list back."
      - code: |-
          def with_lengths(words):
              result = []
              for i in range(words):
                  result.append((i, len(words[i])))
              return result
        ask: "Python says a list cannot be an integer here. What does range need to be given: the list, or how long it is?"
        why: "range takes a number, and len turns the list into the number."
      - code: |-
          def with_lengths(words):
              result = []
              for i in range(len(words)):
                  result.append((i, len(i)))
              return result
        ask: "i is a position, a number. What has the length: the position, or the word at the position?"
        why: "the word at position i is words[i], and that is what has a length."
    walk:
      - "Go through the positions of the list."
      - "For each, build a pair: the position, and the length of the word at that position."
      - "Add each pair to a list, and hand the list back."
    return:
      text: "Write `with_words`, which takes a list of words and hands back a list of pairs: each position, and the word at that position."
      check: "print(with_words(['the', 'order', 'was']))"
      model: |-
        def with_words(words):
            result = []
            for i in range(len(words)):
                result.append((i, words[i]))
            return result
      output: "[(0, 'the'), (1, 'order'), (2, 'was')]"
      narration:
        - "Position 0 with the, then 1 with order. Pairs of a position and the word itself."
        - "The same loop, with the word and not its length."
      note: "Return for step 10."
    note: "positions asked at once, with pair from PY-7 so that two earlier thoughts return. words[i] is the first use of a position inside a loop that names positions."

  # 11
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "split", "tidy", "positions", "if-question", "equals-asks", "new-list-in-loop", "add-to-end"]
    text: "Write a function called `where_is` that takes a sentence and a word, and hands back a list of the positions at which the word appears in the sentence, whatever the capitals. The first word is at position 0."
