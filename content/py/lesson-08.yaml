  # 12
  - kind: "classmate"
    lang: "python"
    new: ["neighbours"]
    text: |-
      Ana wants to look at each word and the one after it. She goes through the positions, and writes words[i + 1] for the next one:

      ```python
      words = ['the', 'order', 'was', 'late']
      for i in range(len(words)):
          print(words[i], words[i + 1])
      ```

      She got three lines, and then Python stopped with: IndexError: list index out of range. Ana, how many words are there, and which position does the last one have? ... Four words, and the last is at position 3. On that turn, i + 1 is 4, and there is no word at 4. The last word has nothing after it, so the loop must stop one short. That is why the range ends at len(words) minus one:

      ```python
      words = ['the', 'order', 'was', 'late']
      for i in range(len(words) - 1):
          print(words[i], words[i + 1])
      ```

      Run it.
    shows:
      - |-
        words = ['the', 'order', 'was', 'late']
        for i in range(len(words) - 1):
            print(words[i], words[i + 1])
    broken: |-
      words = ['the', 'order', 'was', 'late']
      for i in range(len(words)):
          print(words[i], words[i + 1])
    after_run: "The order, order was, was late: three pairs from four words. Always one fewer than the words. words[i] and words[i + 1] are a word and its neighbour, and the loop stops early so that there is always a neighbour."
    note: "neighbours, through the classmate's slip, with Python's real message as the reason (rule E6). The error comes after three lines have printed, which is also the sentence."

