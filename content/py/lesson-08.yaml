          result = []
          for i in range(len(words)):
              if words[i] == word.lower():
                  result.append(i)
          return result
    output: "[0, 5]"
    narration:
      - "Positions 0 and 5: the first word and the sixth. The loop went through the positions, and the position itself was what got collected when the word matched."
      - "Both sides tidied, then each position asked whether its word matches. The answer is the positions, not the words."
      - ""
    wrong:
      - code: |-
          def where_is(sentence, word):
              words = sentence.lower().split()
              result = []
              for w in words:
                  if w == word.lower():
                      result.append(w)
              return result
        ask: "That gives the word each time. What was I asking to collect?"
        why: "a loop over the words never knows where it is. The positions are what range(len(words)) gives."
      - code: |-
          def where_is(sentence, word):
              words = sentence.split()
              result = []
              for i in range(len(words)):
                  if words[i] == word:
                      result.append(i)
              return result
        ask: "Try it on a sentence that starts with The and ask for the. What does the first word look like to Python?"
        why: "a capital T is not a small t. Both sides have to be made small."
      - code: |-
          def where_is(sentence, word):
              words = sentence.lower().split()
              result = []
              for i in range(len(words)):
                  if i == word.lower():
                      result.append(i)
              return result
        ask: "You compared a position, which is a number, with a word. Which thing in the loop is the word?"
        why: "i is a position. The word at position i is words[i]."
    walk:
      - "Make the sentence small and cut it into words."
      - "Go through the positions, and ask of each whether the word at it is the word you were given, also made small."
      - "On a yes, add the position to a list, and hand the list back."
    return:
      text: "Write `long_at`, which takes a sentence and a number n, and hands back the positions of the words that have more than n letters."
      check: "print(long_at('The order was late and the courier was lost', 4))"
      model: |-
        def long_at(sentence, n):
