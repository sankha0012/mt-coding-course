lesson: py-09
title: "A loop that remembers"
strand: py
stage: 1
thoughts:
  remember-previous: "Keep the last item under a name, and give the name its new value at the end of each turn."
  compare-with-previous: "Each item is judged against the one before it. On the first turn there is nothing before it, so ask about `None` first: `and` never looks at its second half when the first says no."
  list-of-lists: "A result can be a list of groups, and each group is a list. Two pairs of brackets reach inside: the group first, then the item."
  start-new-group: "When the gap is too big, put the group you are building away in the list of groups, and start a fresh empty one."
  close-last-group: "The last group is still in your hands when the loop ends. Put it away too, if it holds anything."
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "split", "tidy", "positions", "neighbours", "if-question", "equals-asks", "new-list-in-loop", "add-to-end"]
    text: "Write a function called `follows` that takes a sentence and a word, and hands back a list of the words that come straight after that word in the sentence. Capitals do not matter."
    check: |-
      print(follows('The order was late and the order was cold', 'the'))
      print(follows('late', 'late'))
    model: |-
      def follows(sentence, word):
          words = sentence.lower().split()
          result = []
          for i in range(len(words) - 1):
              if words[i] == word.lower():
                  result.append(words[i + 1])
          return result
    output: |-
      ['order', 'order']
      []
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from PY-8: split, tidy, positions and neighbours, plus a list built in a loop. A combination not practised. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["remember-previous"]
    text: |-
      Last time you looked at a word and its neighbour by going through the positions. There is another way to do it, with no positions at all. Keep the last item you saw under a name, and at the end of each turn, give that name the item you are on.

      ```python
      times = [1, 5, 9, 50, 55]
      previous = None
      for t in times:
          print(previous, t)
          previous = t
      ```

      Run it.
    shows:
      - |-
        times = [1, 5, 9, 50, 55]
        previous = None
        for t in times:
            print(previous, t)
            previous = t
    after_run: "Each line shows the item before, and the item now. On the first turn there was nothing before, and previous was None, the empty cell. The very last line of the loop is what matters: previous takes the item you are on, ready for the next turn. A loop that remembers."
    note: "remember-previous. The same pairs as neighbours, reached another way. 'The empty cell' is PY-5's None. The line order inside the loop is the whole point, so the after_run says so."

  # 3
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "pair", "for-each", "new-list-in-loop", "add-to-end", "nothing", "remember-previous"]
    text: "Write a function called `with_previous` that takes a list and hands back a list of pairs: each item, and the item before it. The first item has None before it."
    check: "print(with_previous([1, 5, 9]))"
    model: |-
      def with_previous(times):
          result = []
          previous = None
          for t in times:
              result.append((previous, t))
              previous = t
          return result
    output: "[(None, 1), (1, 5), (5, 9)]"
    narration:
      - "The item before, and the item now, as a pair, and a None in front of the first. previous was used first, and given its new value last."
      - "Pairs of before and now. The name is given the new item at the very end of the turn."
      - ""
    wrong:
      - code: |-
          def with_previous(times):
              result = []
              previous = None
              for t in times:
                  previous = t
                  result.append((previous, t))
              return result
        ask: "Look at each pair. Is the first part the item before? What was previous given before it was used?"
        why: "previous has to keep the old item until the end of the turn. If it is given the new item first, it is the same as now."
      - code: |-
          def with_previous(times):
              result = []
              previous = None
              for t in times:
                  result.append((previous, t))
              return result
        ask: "Every pair starts with None. What gives previous a new value, and when?"
        why: "nothing gave it one. At the end of each turn it takes the item you are on."
      - code: |-
          def with_previous(times):
              result = []
              previous = None
              for t in times:
                  result.append((previous, t))
                  previous = t
                  return result
        ask: "How many pairs came back? Where does the return belong?"
        why: "a return inside the loop ends the function on the first turn."
    walk:
      - "Start a list for the result, and make previous None."
      - "On each turn, add a pair of previous and the item now."
      - "Then, still inside the loop, give previous the item you are on. Hand the list back after the loop."
    return:
      text: "Write `with_previous_lengths`, which takes a list of words and hands back a list of pairs: the length of the word before, and the length of the word now. The first has None before it."
      check: "print(with_previous_lengths(['the', 'order', 'was']))"
      model: |-
        def with_previous_lengths(words):
            result = []
            previous = None
            for word in words:
                result.append((previous, len(word)))
                previous = len(word)
            return result
      output: "[(None, 3), (3, 5), (5, 3)]"
      narration:
        - "None and 3, then 3 and 5, then 5 and 3. What previous remembers is not the word but its length, and it still takes its new value at the end of the turn."
        - "What is kept can be anything worked out from the item."
      note: "Return for step 3."
    note: "remember-previous, asked at once. The wrong answers are the real slips: updated too early, never updated, and a return in the loop."

  # 4
  - kind: "give"
    lang: "python"
    new: ["compare-with-previous"]
    text: |-
      Now something to do with it: judge each item against the one before. A new time is a big gap if it is more than 30 minutes after the one before. On the first turn there is nothing before it, so the question about None comes first, and the sum second.

      ```python
      times = [1, 5, 9, 50, 55, 120]
      previous = None
      for t in times:
          if previous is not None and t - previous > 30:
              print('a gap before', t)
          previous = t
      ```

      Run it.
    shows:
      - |-
        times = [1, 5, 9, 50, 55, 120]
        previous = None
        for t in times:
            if previous is not None and t - previous > 30:
                print('a gap before', t)
            previous = t
    after_run: "A gap before 50, and a gap before 120. The order inside the question matters. And looks at its first half, and if that says no, it never looks at the second. On the first turn previous is None, the first half says no, and the sum that would fail is never done."
    note: "compare-with-previous. The short-circuit is stated as the reason for the order inside the question, so that it is a reason and not a rule to remember. Ana's slip comes next."

  # 5
  - kind: "classmate"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "if-question", "and-or", "running-result", "remember-previous", "compare-with-previous", "nothing"]
    text: |-
      Ana wanted to count the big gaps in a list of times. She wrote the sum first, and the question about None second:

      ```python
      times = [1, 5, 9, 50, 55, 120]
      count = 0
      previous = None
      for t in times:
          if t - previous > 30 and previous is not None:
              count = count + 1
          previous = t
      print(count)
      ```

      Python stopped with: TypeError: unsupported operand type(s) for -: 'int' and 'NoneType'. Ana, what is previous on the first turn, and which half of the question is looked at first? ... None, and the sum. 1 minus nothing is not a sum. The question about None has to go first, so that the sum is skipped. Write `count_gaps`, which takes a list of times and a gap, and hands back how many times a time comes more than that gap after the one before it.
    check: |-
      print(count_gaps([1, 5, 9, 50, 55, 120], 30))
      print(count_gaps([7], 30))
      print(count_gaps([1, 6, 11], 5))
    model: |-
      def count_gaps(times, gap):
          count = 0
          previous = None
          for t in times:
              if previous is not None and t - previous > gap:
                  count = count + 1
              previous = t
          return count
    output: |-
      2
      0
      0
    narration:
      - "2 gaps: before 50 and before 120. Is-not-None first, the sum second, and previous given its new value at the end of every turn, however the question went."
      - "Count a time when it is more than the gap after the one before. A single time has no one before it, so it counts nothing."
      - ""
    wrong:
      - code: |-
          def count_gaps(times, gap):
              count = 0
              previous = None
              for t in times:
                  if t - previous > gap and previous is not None:
                      count = count + 1
                  previous = t
              return count
        ask: "Python stops with a TypeError. Which half of the question gets looked at first?"
        why: "and looks at its first half first, and the sum with None is in it. The question about None has to be the first half."
      - code: |-
          def count_gaps(times, gap):
              count = 0
              previous = None
              for t in times:
                  if previous is not None and t - previous > gap:
                      count = count + 1
                      previous = t
              return count
        ask: "Count what you get on the times 1, 5, 9, 50. When does previous ever get a value?"
        why: "it is only given one inside the question, and the question is never yes while previous is None. It belongs at the end of the turn, outside the question."
      - code: |-
          def count_gaps(times, gap):
              count = 0
              previous = None
              for t in times:
                  if previous is not None and t - previous >= gap:
                      count = count + 1
                  previous = t
              return count
        ask: "Try it with a gap of 5 on times that are exactly 5 apart. Is 5 more than 5?"
        why: "more than is a strict question. Equal is not more."
    walk:
      - "Start a count at zero, and previous at None."
      - "On each turn, ask: is previous not None, and is this time more than the gap after it? Count a yes."
      - "At the end of the turn, give previous the time you are on."
    return:
      text: "Write `count_drops`, which takes a list of numbers and hands back how many times a number is smaller than the one before it."
      check: "print(count_drops([5, 3, 8, 2]))"
      model: |-
        def count_drops(numbers):
            count = 0
            previous = None
            for n in numbers:
                if previous is not None and n < previous:
                    count = count + 1
                previous = n
            return count
      output: "2"
      narration:
        - "2 drops in 5, 3, 8, 2: 5 to 3, and 8 to 2. The same loop, with the comparison being just smaller than the one before."
        - "A count of the numbers that fall below the one before."
      note: "Return for step 5."
    note: "Classmate with a real Python message (rule E6), and the learner repairs by writing the function. The third wrong answer is >= for >, caught by the last line of the check: [1, 6, 11] with a gap of 5."

  # 6
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "if-question", "new-list-in-loop", "add-to-end", "sorted", "last", "how-many", "empty-case", "nothing", "remember-previous", "compare-with-previous"]
    text: "Write a function called `biggest_gap` that takes a list of times and hands back the biggest gap between a time and the one before it. If there is no gap at all, it hands back None."
    check: |-
      print(biggest_gap([1, 5, 9, 50, 55, 120]))
      print(biggest_gap([7]))
    model: |-
      def biggest_gap(times):
          gaps = []
          previous = None
          for t in times:
              if previous is not None:
                  gaps.append(t - previous)
              previous = t
          if len(gaps) == 0:
              return None
          return sorted(gaps)[-1]
    output: |-
      65
      None
    narration:
      - "65: from 55 to 120. The gaps were collected, one for each time that has one before it, and the biggest is last in the sorted list."
      - "A list of gaps, sorted, the last one. And with one time there are no gaps at all, so None, not an error."
      - ""
    wrong:
      - code: |-
          def biggest_gap(times):
              gaps = []
              previous = None
              for t in times:
                  if previous is not None:
                      gaps.append(t - previous)
                  previous = t
              return sorted(gaps)[-1]
        ask: "Try it with a single time. What is in the list of gaps, and what is its last item?"
        why: "with one time there is nothing to take the last of. The empty case is asked about first, as with the average of nothing."
      - code: |-
          def biggest_gap(times):
              gaps = []
              previous = None
              for t in times:
                  if previous is not None:
                      gaps.append(t - previous)
                  previous = t
              if len(gaps) == 0:
                  return None
              return sorted(gaps)[0]
        ask: "That is the smallest gap. Which end of a sorted list has the biggest?"
        why: "sorted goes upward, so the biggest is last."
      - code: |-
          def biggest_gap(times):
              gaps = []
              previous = None
              for t in times:
                  gaps.append(t - previous)
                  previous = t
              if len(gaps) == 0:
                  return None
              return sorted(gaps)[-1]
        ask: "Python stops on the first time. What does the first time have before it?"
        why: "nothing, and a sum with None fails. The question about None comes first."
    walk:
      - "Make a list for the gaps, and remember the previous time."
      - "On each turn, when there is a time before it, add the difference to the list. Then give previous the time you are on."
      - "If the list of gaps is empty, hand back None. Otherwise sort it and hand back the last."
    return:
      text: "Write `total_of_gaps`, which takes a list of times and hands back the total of the gaps between each time and the one before. With no gaps the total is 0."
      check: |-
        print(total_of_gaps([1, 5, 9, 50, 55, 120]))
        print(total_of_gaps([7]))
      model: |-
        def total_of_gaps(times):
            total = 0
            previous = None
            for t in times:
                if previous is not None:
                    total = total + (t - previous)
                previous = t
            return total
      output: |-
        119
        0
      narration:
        - "119: all the gaps added up. The same loop, with a running total in place of a list. A single time has no gaps and the total stays 0."
        - "A total, not a biggest."
      note: "Return for step 6."
    note: "remember-previous and the empty case (PY-5) with PY-2's sorted and last. The edge case is a list of one time, which a classmate would miss."

  # 7
  - kind: "give"
    lang: "python"
    new: ["list-of-lists"]
    text: |-
      Next, the groups. A result can be a list of groups, and each group is itself a list. So it is a list of lists. Two pairs of square brackets reach inside: the first picks the group, the second picks the item in it.

      ```python
      groups = [[1, 5, 9], [50, 55], [120]]
      print(len(groups))
      print(groups[1])
      print(groups[1][0])
      ```

      Run it.
    shows:
      - |-
        groups = [[1, 5, 9], [50, 55], [120]]
        print(len(groups))
        print(groups[1])
        print(groups[1][0])
    after_run: "3 groups, then the second group, then the first item of it. It is the same two pairs of brackets as a table: a table is a list of rows, and this is a list of groups. Each one is picked by position, and positions start at zero."
    note: "list-of-lists. Reuses table-is-list-of-rows from PY-6 (the same two brackets) and position from PY-2, which is why it needs only a give."

  # 8
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "list-of-lists", "pair", "for-each", "how-many", "total", "new-list-in-loop", "add-to-end"]
    text: "Write a function called `summary` that takes a list of groups of numbers, and hands back a list of pairs: for each group, how many numbers it has and their total."
    check: "print(summary([[1, 5, 9], [50, 55], [120]]))"
    model: |-
      def summary(groups):
          result = []
          for group in groups:
              result.append((len(group), sum(group)))
          return result
    output: "[(3, 15), (2, 105), (1, 120)]"
    narration:
      - "3 numbers adding to 15, 2 adding to 105, 1 making 120. Each turn of the loop had a whole group in hand, and len and sum worked on it."
      - "One pair for each group. A group is a list, so everything you know about lists works on it."
      - ""
    wrong:
      - code: |-
          def summary(groups):
              result = []
              for group in groups:
                  result.append((len(groups), sum(group)))
              return result
        ask: "Every pair starts with 3. Which is the group you have in hand: groups, or group?"
        why: "groups is all of them, and group is the one this turn is about."
      - code: |-
          def summary(groups):
              result = []
              for group in groups:
                  result.append((len(group), sum(groups)))
              return result
        ask: "Python says it cannot add lists. What does sum need to be given: the groups, or one group?"
        why: "sum adds up numbers, and a group is made of numbers. groups is made of lists."
      - code: |-
          def summary(groups):
              result = []
              for group in groups:
                  result = (len(group), sum(group))
              return result
        ask: "One pair came back. What happens to result on each turn?"
        why: "result is given a new value each turn instead of having a pair added to it."
    walk:
      - "Start an empty list, and go through the groups."
      - "For each group, make a pair: how many items it has, and their total."
      - "Add the pair to the list, and hand it back."
    return:
      text: "Write `averages`, which takes a list of groups of numbers and hands back a list with the average of each group."
      check: "print(averages([[1, 5, 9], [50, 55], [120]]))"
      model: |-
        def averages(groups):
            result = []
            for group in groups:
                result.append(sum(group) / len(group))
            return result
      output: "[5.0, 52.5, 120.0]"
      narration:
        - "5.0, 52.5 and 120.0. A total over a count, once for each group."
        - "An average per group: the average from PY-1, inside a loop over groups."
      note: "Return for step 8."
    note: "A group is a list, so len and sum from PY-1 work on it. The wrong answers are the groups/group mix-up in two places, and overwriting."

  # 9
  - kind: "give"
    lang: "python"
    new: ["start-new-group"]
    text: |-
      Now to make the groups. Keep the group you are building in a name, `current`, and the finished ones in `groups`. When a time is more than 30 after the one before, the group in hand is finished: put it away in `groups`, and start an empty one. Then the time goes into whichever group is current.

      ```python
      times = [1, 5, 9, 50, 55, 120]
      groups = []
      current = []
      previous = None
      for t in times:
          if previous is not None and t - previous > 30:
              groups.append(current)
              current = []
          current.append(t)
          previous = t
      print(groups)
      ```

      Run it.
    shows:
      - |-
        times = [1, 5, 9, 50, 55, 120]
        groups = []
        current = []
        previous = None
        for t in times:
            if previous is not None and t - previous > 30:
                groups.append(current)
                current = []
            current.append(t)
            previous = t
        print(groups)
    after_run: "Two groups are put away: 1, 5, 9 and 50, 55. Each time a gap showed up, the group in hand was put away and a fresh one begun. Now look at the times and look at the groups. Is every time somewhere? Keep that question for the next step."
    note: "start-new-group. The program is deliberately unfinished, and the learner is asked in the last two sentences to look. The next step is Davi seeing it."

  # 10
  - kind: "classmate"
    lang: "python"
    new: ["close-last-group"]
    text: |-
      Davi looked at that, and said it was done. Davi, which time is not in any group? ... 120. Where is it? Still in current, in your hand. A group is put away when the next gap shows up, and after the very last time there is no next gap. So when the loop is over, put current away too. But only if it holds something: if the list of times was empty, there is no group to put away.

      ```python
      times = [1, 5, 9, 50, 55, 120]
      groups = []
      current = []
      previous = None
      for t in times:
          if previous is not None and t - previous > 30:
              groups.append(current)
              current = []
          current.append(t)
          previous = t
      if len(current) > 0:
          groups.append(current)
      print(groups)
      ```

      Run it.
    shows:
      - |-
        times = [1, 5, 9, 50, 55, 120]
        groups = []
        current = []
        previous = None
        for t in times:
            if previous is not None and t - previous > 30:
                groups.append(current)
                current = []
            current.append(t)
            previous = t
        if len(current) > 0:
            groups.append(current)
        print(groups)
    after_run: "Three groups, and 120 is in the last one, alone. The loop ends with a group still in your hands, and it is yours to put away. This is the most common slip in this kind of question, and every programmer makes it once."
    note: "close-last-group, through Davi's slip (rule E6). It is a wrong result and not an error, so the reason is stated in words. The guard for an empty list is included from the start so that the learner meets one version, with its reason."

  # 11
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "list-of-lists", "if-question", "and-or", "new-list-in-loop", "add-to-end", "how-many", "nothing", "remember-previous", "compare-with-previous", "start-new-group", "close-last-group"]
    text: "Write a function called `rising_runs` that takes a list of numbers and cuts it into groups where each group keeps going up. A number that is not bigger than the one before it starts a new group."
    check: |-
      print(rising_runs([1, 3, 2, 5, 6, 4]))
      print(rising_runs([]))
    model: |-
      def rising_runs(numbers):
          groups = []
          current = []
          previous = None
          for n in numbers:
              if previous is not None and n <= previous:
                  groups.append(current)
                  current = []
              current.append(n)
              previous = n
          if len(current) > 0:
              groups.append(current)
          return groups
    output: |-
      [[1, 3], [2, 5, 6], [4]]
      []
    narration:
      - "1, 3 then 2, 5, 6 then 4. A group is put away when a number does not go up, and the last group is put away after the loop."
      - "The same shape as a session, with a different question about the one before it. And an empty list gives no groups at all."
      - ""
    wrong:
      - code: |-
          def rising_runs(numbers):
              groups = []
              current = []
              previous = None
              for n in numbers:
                  if previous is not None and n <= previous:
                      groups.append(current)
                      current = []
                  current.append(n)
                  previous = n
              return groups
        ask: "Look at the numbers and the groups together. Which number is not in any group?"
        why: "the last group is still in hand when the loop ends. It has to be put away after it."
      - code: |-
          def rising_runs(numbers):
              groups = []
              current = []
              previous = None
              for n in numbers:
                  if previous is not None and n <= previous:
                      groups.append(current)
                      current = []
                  current.append(n)
                  previous = n
              groups.append(current)
              return groups
        ask: "Now try the empty list. What is in the list that comes back?"
        why: "with no numbers, current is empty, and putting it away makes a group with nothing in it. It is put away only if it holds something."
      - code: |-
          def rising_runs(numbers):
              groups = []
              current = []
              previous = None
              for n in numbers:
                  if previous is not None and n <= previous:
                      groups.append(current)
                  current.append(n)
                  previous = n
              if len(current) > 0:
                  groups.append(current)
              return groups
        ask: "Look at the first group. What does it hold, and what happens to current after it is put away?"
        why: "putting a list away does not copy it. It is the same list, still being filled, unless a fresh empty one is started."
    walk:
      - "Make a list for the groups, a list for the group in hand, and previous."
      - "When there is a previous number, and this one is not bigger, put the group in hand away and start a fresh empty one. Then add the number and update previous."
      - "After the loop, put the last group away, if it holds anything."
    return:
      text: "Write `falling_runs`, which takes a list of numbers and cuts it into groups where each group keeps going down. A number that is not smaller than the one before it starts a new group."
      check: |-
        print(falling_runs([5, 3, 4, 1]))
        print(falling_runs([]))
      model: |-
        def falling_runs(numbers):
            groups = []
            current = []
            previous = None
            for n in numbers:
                if previous is not None and n >= previous:
                    groups.append(current)
                    current = []
                current.append(n)
                previous = n
            if len(current) > 0:
                groups.append(current)
            return groups
      output: |-
        [[5, 3], [4, 1]]
        []
