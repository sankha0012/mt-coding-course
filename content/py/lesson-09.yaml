    requires: ["def", "what-goes-in", "what-comes-out", "list-of-lists", "if-question", "and-or", "new-list-in-loop", "add-to-end", "nothing", "remember-previous", "compare-with-previous", "start-new-group", "close-last-group"]
    text: "Write a function called `same_status_runs` that takes a list of statuses and hands back how many runs of equal statuses it has, and how long the longest run is, as a pair. An empty list gives (0, 0)."
    check: |-
      print(same_status_runs(['delivered', 'delivered', 'cancelled', 'delivered', 'delivered', 'delivered']))
      print(same_status_runs([]))
    model: |-
      def same_status_runs(statuses):
          groups = []
          current = []
          previous = None
          for s in statuses:
              if previous is not None and s != previous:
                  groups.append(current)
                  current = []
              current.append(s)
              previous = s
          if len(current) > 0:
              groups.append(current)
          if len(groups) == 0:
              return (0, 0)
          longest = sorted(groups, key=lambda g: len(g))[-1]
          return (len(groups), len(longest))
    output: |-
      (3, 3)
      (0, 0)
    after_run: "That's the sitting. We pick up from here next time."
    note: "Closing cold check: the groups pattern with PY-7's lambda and a pair as the answer, on a combination not yet practised. Never scored."
