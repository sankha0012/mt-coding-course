lesson: py-05
title: "Wrap it as a function"
strand: py
stage: 1
thoughts:
  def: "`def average(values):` gives a name to some steps. Nothing runs until the name is used."
  what-goes-in: "The names in the brackets of the `def` line are what goes in."
  what-comes-out: "`return` hands the result back to the code that used the function."
  call-it: "`average(fees)` runs the function. A function is a query: something goes in, something comes out."
  show-or-return: "`print` shows a value to a person. `return` hands it to the code that asked."
  nothing: "`None` is Python's empty cell. The question is written `is None`, as SQL wrote `IS NULL`."
  empty-case: "Ask what happens when the list is empty, before someone else does."
  check-with-assert: "`assert average([2, 4]) == 3` is a check you write yourself. Silence means it held."
  comment: "A line that starts with `#` is a note for people, and Python skips it."
steps:
  # 1
  - kind: "ask"
    lang: "python"
    requires: ["list", "show", "for-each", "block", "if-question", "compare-signs", "text-in-list", "dict", "get-by-name", "set-by-name", "one-entry-per-pile", "update-the-pile", "get-with-default"]
    text: "Let's start with where we stopped. Five couriers ride bike, carro, bike, moto and bike. Count the couriers for each vehicle, the short way, and show the dict."
    start: "vehicles = ['bike', 'carro', 'bike', 'moto', 'bike']"
    model: |-
      vehicles = ['bike', 'carro', 'bike', 'moto', 'bike']
      counts = {}
      for vehicle in vehicles:
          counts[vehicle] = counts.get(vehicle, 0) + 1
      print(counts)
    output: "{'bike': 3, 'carro': 1, 'moto': 1}"
    narration:
      - "{'bike': 3, 'carro': 1, 'moto': 1}. Each vehicle found its pile, and get gave a missing pile a zero."
      - "GROUP BY with a COUNT, by hand, in one line inside the loop."
      - ""
    wrong:
      - code: |-
          vehicles = ['bike', 'carro', 'bike', 'moto', 'bike']
          counts = {}
          for vehicle in vehicles:
              counts[vehicle] = counts.get(vehicle) + 1
          print(counts)
        ask: "Python stopped. What does get hand back for a pile that is not there, when you give it nothing else?"
      - code: |-
          vehicles = ['bike', 'carro', 'bike', 'moto', 'bike']
          counts = {}
          for vehicle in vehicles:
              counts[vehicle] = counts.get(vehicle, 0) + 1
              print(counts)
        ask: "The dict is shown at every turn. When are the piles ready?"
    walk:
      - "Make an empty dict."
      - "For each vehicle, put under its name: what is there, or 0, and one more."
      - "Show the dict, after the loop."
    return:
      text: "Count the orders for each status, the short way: delivered, delivered and cancelled. Show the dict."
      start: "statuses = ['delivered', 'delivered', 'cancelled']"
      model: |-
        statuses = ['delivered', 'delivered', 'cancelled']
        counts = {}
        for status in statuses:
            counts[status] = counts.get(status, 0) + 1
        print(counts)
      output: "{'delivered': 2, 'cancelled': 1}"
      narration:
        - "{'delivered': 2, 'cancelled': 1}. Each status found its pile and raised it."
        - "What is there, or zero, plus one: for each item."
      note: "Return for step 1."
    note: "A warm start from PY-4: the piles by hand. In step 20 the learner will wrap exactly this loop in a function, so the loop is fresh in the hand when it is wanted."

  # 2
  - kind: "give"
    lang: "python"
    new: ["def"]
    text: |-
      You have written the same few lines more than once. A function gives a name to some steps, so that you can use the steps again by saying the name. The word is def, then the name, brackets, a colon, and the steps pushed in underneath, as with for and if. Defining it does not run it. The last line below uses the name, and that is what runs the steps:

      ```python
      def show_total():
          fees = [8.99, 6.99, 0]
          print(sum(fees))

      show_total()
      ```

      Run it.
    shows:
      - |-
        def show_total():
            fees = [8.99, 6.99, 0]
            print(sum(fees))

        show_total()
    after_run: "15.98. The def made a name for the two steps and did nothing else. It was the last line that ran them. Take that line away and nothing is shown, because the steps are waiting. You have used functions since the first lesson: len, sum and print are functions somebody else wrote. Now you can write your own."
    note: "The colon and the push are used a third time without being re-taught. The call at the bottom is used before it is named: its thought, call-it, is taken after return, where the idea that a function is a query can be said once the learner has seen something come out."

  # 3
  - kind: "ask"
    lang: "python"
    requires: ["name-a-value", "list", "show", "how-many", "total", "build-average", "block", "def"]
    text: "Write a function called show_average that shows the average of the delivery times 35.2, 24.8 and 31.7 minutes, and then use it."
    model: |-
      def show_average():
          minutes = [35.2, 24.8, 31.7]
          print(sum(minutes) / len(minutes))

      show_average()
    output: "30.566666666666666"
    narration:
      - "About 30.57. The steps were given a name, and the last line used the name to run them."
      - "Def, the name, brackets and a colon, then the steps pushed in. Then the name again, to run them."
      - ""
    wrong:
      - code: |-
          def show_average():
              minutes = [35.2, 24.8, 31.7]
              print(sum(minutes) / len(minutes))
        ask: "Nothing was shown. The steps have a name, but what makes them run?"
      - code: |-
          def show_average:
              minutes = [35.2, 24.8, 31.7]
              print(sum(minutes) / len(minutes))

          show_average()
        ask: "Python stopped at the first line. What follows the name in the def line, before the colon?"
      - code: |-
          def show_average():
          minutes = [35.2, 24.8, 31.7]
          print(sum(minutes) / len(minutes))

          show_average()
        ask: "Which lines are inside the function? What shows that?"
    walk:
      - "Write the def line: def, the name, empty brackets and a colon."
      - "Pushed in, make the list of times and show their average."
      - "Back at the left edge, use the function by its name, with brackets."
    return:
      text: "Write a function called show_count that shows how many statuses there are: delivered, cancelled, delivered and delivered. Then use it."
      model: |-
        def show_count():
            statuses = ['delivered', 'cancelled', 'delivered', 'delivered']
            print(len(statuses))

        show_count()
      output: "4"
      narration:
        - "4. The steps were given a name, and the name was used to run them."
        - "A def, with the steps pushed in, and a line at the left that runs it."
      note: "Return for step 3."
    note: "The first function the learner writes: no inputs, so the only new thing is the def and the call. Every line inside is from PY-1."

  # 4
  - kind: "give"
    lang: "python"
    new: ["what-goes-in"]
    text: |-
      A function that always works on the same list is not much use. What goes in can be a name in the brackets of the def line. When you use the function, whatever you put in its brackets takes that name for the moment, as the item of a loop does:

      ```python
      def show_average(values):
          print(sum(values) / len(values))

      show_average([2, 4])
      show_average([10, 20, 60])
      ```

      Run it.
    shows:
      - |-
        def show_average(values):
            print(sum(values) / len(values))

        show_average([2, 4])
        show_average([10, 20, 60])
    after_run: "3.0 and 30.0. One function, used twice, on two lists. The first time, values meant [2, 4]. The second time it meant [10, 20, 60]. The name in the brackets is yours to choose, and it only exists inside the function."
    note: "The loop's item is the model: a name that stands for whatever it is given at each turn. The name exists only inside the function is said and not tested, because a lucky guess could teach a false generalisation."

  # 5
  - kind: "ask"
    lang: "python"
    requires: ["name-a-value", "list", "show", "how-many", "total", "build-average", "block", "def", "what-goes-in"]
    text: "Write a function called show_total that takes values, and shows their total. Then use it on the delivery fees 8.99, 6.99, 0 and 4.99."
    model: |-
      def show_total(values):
          print(sum(values))

      show_total([8.99, 6.99, 0, 4.99])
    output: "20.97"
    narration:
      - "20.97. The list went in through the brackets and took the name values inside the function."
      - "Something in, and a total shown. One name in the def line, and the list itself in the brackets when it was used."
      - ""
    wrong:
      - code: |-
          def show_total():
              print(sum(values))

          show_total([8.99, 6.99, 0, 4.99])
        ask: "Python stopped: the function does not know what to do with a list. Which names are what goes in?"
      - code: |-
          def show_total(values):
              print(sum(values))

          show_total()
        ask: "The function waits for a list, and none arrived. What goes in the brackets when you use it?"
      - code: |-
          def show_total(values):
              print(sum(values))
        ask: "Nothing was shown. What makes the steps run?"
    walk:
      - "Write the def line, with a name for what goes in, inside its brackets."
      - "Pushed in, show the total of that name."
      - "Use the function, with the list of fees inside its brackets."
    return:
      text: "Write a function called show_count that takes statuses, and shows how many there are. Then use it on delivered and cancelled."
      model: |-
        def show_count(statuses):
            print(len(statuses))

        show_count(['delivered', 'cancelled'])
      output: "2"
      narration:
        - "2. The list went in through the brackets, and len counted it inside."
        - "A name for what goes in, and the list itself when it was used."
      note: "Return for step 5."
    note: "The learner now writes a function with a parameter, one step after seeing it. The wrong answers are the missing input, the missing argument and the missing call."

  # 6
  - kind: "give"
    lang: "python"
    new: ["what-comes-out"]
    text: |-
      A function that only shows is of no use to other code. What comes out can be handed back, with return. Here the function is used on the right of an equals sign, and what it hands back is given a name:

      ```python
      def average(values):
          return sum(values) / len(values)

      result = average([2, 4, 9])
      print(result)
      ```

      Run it.
    shows:
      - |-
        def average(values):
            return sum(values) / len(values)

        result = average([2, 4, 9])
        print(result)
    after_run: "5.0. The function showed nothing itself. It handed its answer back, and the answer was given the name result, and the last line showed it. A function that returns can be used anywhere a value can: after an equals sign, inside print, in a question."
    note: "Return before print inside a function is used for contrast, so the difference between showing and handing back is met in the classmate step, where it is the real reason."

  # 7
  - kind: "ask"
    lang: "python"
    requires: ["name-a-value", "list", "show", "how-many", "total", "build-average", "block", "def", "what-goes-in", "what-comes-out"]
    text: "Write a function called average that takes values, and hands back their average. Then show the average of the delivery fees 8.99, 6.99, 6.99 and 4.99."
    check: "print(average([2, 4, 9]) + 1)"
    model: |-
      def average(values):
          return sum(values) / len(values)

      print(average([8.99, 6.99, 6.99, 4.99]))
    output: |-
      6.99
      6.0
    narration:
      - "6.99. The function handed its answer back, and print showed it from outside."
      - "Something in, a number out. The average, built from sum and len, now has a name of its own."
      - "6.99. You did the average by hand in the first lesson. Now it is a function."
    wrong:
      - code: |-
          def average(values):
              print(sum(values) / len(values))

          average([8.99, 6.99, 6.99, 4.99])
        ask: "That shows the number from inside the function. It hands nothing back, so nothing outside can use it. Which word hands a result back?"
      - code: |-
          def average(values):
              return sum(values) / len(values)
        ask: "Nothing was shown for the four fees. What uses the function on them?"
      - code: |-
          def average(values):
              return sum(values)

          print(average([8.99, 6.99, 6.99, 4.99]))
        ask: "That hands back the total. What do you divide it by?"
    walk:
      - "Write the def line, with a name for the list that goes in."
      - "Pushed in, hand back the total divided by how many: return, then the sum over the len."
      - "Use the function on the four fees, inside print."
    return:
      text: "Write a function called total_of that takes values, and hands back their total. Then show the total of the delivery times 35.2, 24.8 and 31.7."
      check: "print(total_of([1, 2]) + 1)"
      model: |-
        def total_of(values):
            return sum(values)

        print(total_of([35.2, 24.8, 31.7]))
      output: |-
        91.7
        4
      narration:
        - "91.7. The function handed the total back, and print showed it."
        - "Something in, something out: the list in, the total out."
      note: "Return for step 7."
    note: "The hidden check adds one to what the function hands back. A function that only prints hands back nothing, and the check stops with an error. This is how a step can tell showing from handing back, which the checker could not see otherwise."

  # 8
  - kind: "give"
    lang: "python"
    new: ["call-it"]
    text: |-
      A call is replaced by its answer wherever it stands. So average(fees) can sit inside print, or inside a question, or after an equals sign:

      ```python
      def average(values):
          return sum(values) / len(values)

      fees = [8.99, 6.99, 0]
      subtotals = [81.1, 18.85, 84.23]
      print(average(fees))
      print(average(subtotals) > 50)
      ```

      Run it.
    shows:
      - |-
        def average(values):
            return sum(values) / len(values)

        fees = [8.99, 6.99, 0]
        subtotals = [81.1, 18.85, 84.23]
        print(average(fees))
        print(average(subtotals) > 50)
    after_run: "5.326666666666667 and True. The second line asked a question about the average, and the call was replaced by its answer, 61.39, before the sign was applied. A function is a query: something goes in, something comes out. You have used functions that way since len and sum. This one is yours."
    note: "The strand's idea made explicit: a function is a query, which is the SQL idea of a table going in and a table coming out, with a value in each place."

  # 9
  - kind: "ask"
    lang: "python"
    requires: ["list", "show", "for-each", "block", "if-question", "compare-signs", "name-a-value", "commas", "running-result", "def", "what-goes-in", "what-comes-out", "call-it"]
    text: "Write a function called count_above that takes values and a limit, with a comma between the two names, and hands back how many of the values are above the limit. Then show how many of the subtotals 81.1, 18.85, 84.23, 91.11 and 31.3 are above 50."
    check: "print(count_above([4, 9, 12, 20], 5) + 1)"
    model: |-
      def count_above(values, limit):
          count = 0
          for value in values:
              if value > limit:
                  count = count + 1
          return count

      print(count_above([81.1, 18.85, 84.23, 91.11, 31.3], 50))
    output: |-
      3
      4
    narration:
      - "3. The count started inside the function, ran through the values, and was handed back at the end."
      - "Two things went in, a list and a limit, and one number came out. The function is the loop from the first lesson, with a name."
      - "3. Something in, something out, and the loop is hidden inside it."
    wrong:
      - code: |-
          def count_above(values, limit):
              count = 0
              for value in values:
                  if value > limit:
                      count = count + 1
              print(count)

          count_above([81.1, 18.85, 84.23, 91.11, 31.3], 50)
        ask: "That shows the count from inside, and hands nothing back. Which word hands a result back?"
      - code: |-
          def count_above(values, limit):
              count = 0
              for value in values:
                  if value > limit:
                      count = count + 1
                  return count

          print(count_above([81.1, 18.85, 84.23, 91.11, 31.3], 50))
        ask: "The function handed back its answer after the very first value, and stopped. Where should the return sit, so that the loop finishes first?"
        why: "return ends the function on the spot. Out at the left of the loop, it runs once the loop is done."
      - code: |-
          def count_above(values, limit):
              count = 0
              for value in values:
                  if value > 50:
                      count = count + 1
              return count

          print(count_above([81.1, 18.85, 84.23, 91.11, 31.3], 50))
        ask: "That works for the subtotals and for 50, and for nothing else. What name holds the limit that went in?"
    walk:
      - "Write the def line, with two names after it, separated by a comma: the list and the limit."
      - "Inside, the running count from the first lesson: start at zero, go through the values, add one on each yes."
      - "Hand the count back after the loop, and use the function inside print."
    return:
      text: "Write a function called count_below that takes values and a limit, and hands back how many of the values are below the limit. Then show how many of the delivery times 35.2, 24.8, 31.7 and 28.2 are below 30."
      check: "print(count_below([4, 9, 12, 20], 10) + 1)"
      model: |-
        def count_below(values, limit):
            count = 0
            for value in values:
                if value < limit:
                    count = count + 1
            return count

        print(count_below([35.2, 24.8, 31.7, 28.2], 30))
      output: |-
        2
        3
      narration:
        - "2. Two things in, a list and a limit, and one number out."
        - "The loop and the running count from the first lesson, with a name and a return."
      note: "Return for step 9."
    note: "The first function with two inputs and a loop, and a climb: the loop of PY-1 wrapped. The second wrong answer is the classic one, the return pushed in too far, and the real reason for it is that return ends the function."

  # 10
  - kind: "classmate"
    lang: "python"
    new: ["show-or-return"]
    requires: ["name-a-value", "list", "show", "how-many", "total", "build-average", "block", "list", "def", "what-goes-in", "what-comes-out", "call-it", "show-or-return"]
    text: |-
      Ana wrote a function that was meant to hand back an average, and then added one to what it gave. She wrote:

      ```python
      def average(values):
          print(sum(values) / len(values))

      fees = [8.99, 6.99, 0]
      print(average(fees) + 1)
      ```

      It showed 5.326666666666667, and then Python stopped: TypeError: unsupported operand type(s) for +: 'NoneType' and 'int'. Ana, what did average hand back to the line that used it? ... Nothing. It showed the number on the screen, which is for a person, but it did not hand it back, which is for the code that asked. print shows. return hands back. Type the function as Ana should have written it, and then the line that adds one and shows it.
    model: |-
      def average(values):
          return sum(values) / len(values)

      fees = [8.99, 6.99, 0]
      print(average(fees) + 1)
    output: "6.326666666666667"
    broken: |-
      def average(values):
          print(sum(values) / len(values))

      fees = [8.99, 6.99, 0]
      print(average(fees) + 1)
    narration:
      - "6.326666666666667. The function handed the average back, and the line that used it could add one."
      - "Print puts a value in front of a person, once. Return gives it to the code that asked, which can do more with it."
      - "The average, handed back, and one added to it. That is what a function is for."
    wrong:
      - code: |-
          def average(values):
              print(sum(values) / len(values))

          fees = [8.99, 6.99, 0]
          print(average(fees) + 1)
        ask: "That is Ana's again. What is the line that uses average given back?"
      - code: |-
          def average(values):
              print(sum(values) / len(values))
              return sum(values) / len(values)

          fees = [8.99, 6.99, 0]
          print(average(fees) + 1)
        ask: "Two numbers came out. Which of those lines is for a person, and which is for the code that asked? Which one do we need?"
      - code: |-
          def average(values):
              return sum(values) / len(values)

          fees = [8.99, 6.99, 0]
          print(average(fees))
        ask: "That hands the average back and shows it, but the one has not been added. What did Ana's last line do with the answer?"
    walk:
      - "Ana's function is nearly right. Look at the line inside it."
      - "Replace the line that shows with the word that hands back."
      - "Then use the function on the fees: add one to the answer, and show it."
    return:
      text: "Write a function called total_of that takes values, and hands back their total. Then show the total of 8.99, 6.99 and 0, plus one."
      model: |-
        def total_of(values):
            return sum(values)

        print(total_of([8.99, 6.99, 0]) + 1)
      output: "16.98"
      narration:
        - "16.98. The function handed the total back, and the line that used it added one."
        - "Something in, something out, and the answer used by the code that asked."
      note: "Return for the Ana step."
    note: "Ana makes the classic slip before the learner can (rule E6), and Python's own message is the real reason. print and return are contrasted here, after the learner has seen both used on their own. The word NoneType in the message prepares the next thought, and the narration does not name it."

  # 11
  - kind: "aside"
    lang: "python"
    text: "Something that is only interesting, with nothing in it to keep. The word function comes from mathematics. In school you may have met f of x equals two x: put a number in, and a number comes out, always the same one for the same input. Mathematicians were saying it long before there were computers. Programmers borrowed the word, and the idea. That is why the picture of something going in and something coming out fits so well, in SQL, in a function, and in a great deal that comes after."
    note: "Relief after the climb of steps 9 and 10 (rule C8). A real origin of the word, and an import from mathematics (rule B7). It restates something in and something out, which is the strand's idea."

  # 12
  - kind: "give"
    lang: "python"
    new: ["nothing"]
    text: |-
      A moment ago Python said NoneType. None is its word for nothing: the empty cell. A name that is not in a dict gives None when you ask get without a second thing. And it is what a function hands back if you never say return. To ask whether a value is empty, the question is written is None, the way SQL wrote IS NULL:

      ```python
      prices = {'pizza': 40, 'sushi': 60}
      price = prices.get('acai')
      print(price)
      print(price is None)
      print(prices.get('pizza') is None)
      ```

      Run it.
    shows:
      - |-
        prices = {'pizza': 40, 'sushi': 60}
        price = prices.get('acai')
        print(price)
        print(price is None)
        print(prices.get('pizza') is None)
    after_run: "None, then True, then False. There is no acai in the dict, so get handed back nothing, and the question said yes. Pizza is there, so the question said no. Python has exactly one None, so the question is whether the value is that one, and the word for that is is. In SQL, nothing equals NULL, so IS NULL was a different word. Here it is the same idea."
    note: "Names the NULL of SQL-3 as the same idea in Python, which the learner owns. The reason for is is the true one: there is only one None. The grade is core: PY-6 and PY-9 need is None and is not None."

  # 13
  - kind: "ask"
    lang: "python"
    requires: ["name-a-value", "show", "text-quotes", "dict", "get-with-default", "nothing"]
    text: "The dict discounts holds BEMVINDO10 at 10 and PIZZA20 at 20. Show True or False: is there no discount for VOLTA15 in it?"
    start: "discounts = {'BEMVINDO10': 10, 'PIZZA20': 20}"
    model: |-
      discounts = {'BEMVINDO10': 10, 'PIZZA20': 20}
      print(discounts.get('VOLTA15') is None)
    output: "True"
    narration:
      - "True. VOLTA15 is not there, so get handed back nothing, and the question said yes."
      - "Get with no second thing, and is None: the empty cell, asked about."
      - ""
    wrong:
      - code: |-
          discounts = {'BEMVINDO10': 10, 'PIZZA20': 20}
          print(discounts['VOLTA15'] is None)
        ask: "Python stopped: it will not guess for a name that is not there. Which way of asking hands back nothing instead of stopping?"
      - code: |-
          discounts = {'BEMVINDO10': 10, 'PIZZA20': 20}
          print(discounts.get('VOLTA15', 0) is None)
        ask: "Get was given a 0 to hand back. Is a 0 the same as nothing?"
        why: "a 0 is a number, and nothing is nothing. Only a get with no second thing hands back None."
      - code: |-
          discounts = {'BEMVINDO10': 10, 'PIZZA20': 20}
          print(discounts.get('VOLTA15'))
