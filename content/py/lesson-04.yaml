lesson: py-04
title: "Piles by hand"
strand: py
stage: 1
thoughts:
  one-entry-per-pile: "A dict can hold the piles: one name per pile, holding that pile's running result."
  pile-starts-at-zero: "A pile that is not there yet has to be started at zero before it can grow."
  update-the-pile: "For each item, find its pile and update that pile. That is `GROUP BY`, by hand."
  get-with-default: "`counts.get(dish, 0)` is what is there, or zero if nothing is. It replaces the check."
  total-per-pile: "The same shape with a total where the count was."
  average-from-two-dicts: "A total per pile and a count per pile give an average per pile."
steps:
  # 1
  - kind: "cold-check"
    requires: ["from-table", "more-summaries", "summary-column", "piles", "one-row-per-pile", "pile-name", "commas", "sort", "sort-direction", "sort-by-summary"]
    ordered: true
    any_column_order: true
    text: "Show each promised_minutes value with the largest actual_minutes of its orders, the largest first."
    model: "SELECT promised_minutes, MAX(actual_minutes) FROM orders GROUP BY promised_minutes ORDER BY MAX(actual_minutes) DESC"
    rows: 3
    result: [[50, 109.9], [40, 95.5], [30, 63.9]]
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from SQL-2: MAX in place of a count, piles, and a sort by the summary. Never scored. A summary per pile with the pile's name beside it is what the dicts of PY-4 hold, so the SQL sentence is the one the lesson will echo."

  # 2
  - kind: "ask"
    lang: "python"
    requires: ["list", "show", "for-each", "block", "if-question", "compare-signs", "name-a-value", "text-quotes", "dict", "get-by-name", "set-by-name", "go-through-dict", "two-names"]
    text: "Let's start with where we stopped. The dict counts holds bike at 73, moto at 110 and carro at 17. Show each vehicle with its count, but only the ones that have more than 50."
    model: |-
      counts = {'bike': 73, 'moto': 110, 'carro': 17}
      for vehicle, n in counts.items():
          if n > 50:
              print(vehicle, n)
    output: |-
      bike 73
      moto 110
    narration:
      - "bike 73 and moto 110. The loop named both halves of each pair, and the question was about the count."
      - "A dict, gone through by pairs, with a question inside it."
      - ""
    wrong:
      - code: |-
          counts = {'bike': 73, 'moto': 110, 'carro': 17}
          for vehicle in counts:
              if vehicle > 50:
                  print(vehicle, counts[vehicle])
        ask: "Python stopped. Is it the name that is above 50, or the value that goes with it?"
      - code: |-
          counts = {'bike': 73, 'moto': 110, 'carro': 17}
          for vehicle, n in counts.items():
              print(vehicle, n)
        ask: "Carro is here, with only 17. Where is the question?"
    walk:
      - "Make the dict with its three vehicles."
      - "Go through its pairs: two names after for, and a dot and items after the dict."
      - "Ask the question about the count, and show the vehicle and the count."
    return:
      text: "The dict prices holds pizza at 40, sushi at 60 and acai at 25. Show each dish with its price, but only the dishes that cost less than 50."
      model: |-
        prices = {'pizza': 40, 'sushi': 60, 'acai': 25}
        for dish, price in prices.items():
            if price < 50:
                print(dish, price)
      output: |-
        pizza 40
        acai 25
      narration:
        - "pizza 40 and acai 25. The question was asked of each price."
        - "Both halves named, and a question about the value."
      note: "Return for step 2."
    note: "A warm start from PY-3: the pairs of a dict and a question about a value. The dict is the one the next step turns into piles, with real counts from the couriers table."

  # 3
  - kind: "give"
    lang: "python"
    new: ["one-entry-per-pile"]
    text: |-
      In SQL, GROUP BY sorted the rows into piles and one row came out for each pile. A dict can hold the piles by hand: one name for each pile, and under it that pile's running result. This dict holds a count for each vehicle. When a new bike courier joins, we raise the bike pile by one:

      ```python
      counts = {'bike': 73, 'moto': 110, 'carro': 17}
      counts['bike'] = counts['bike'] + 1
      print(counts)
      ```

      Run it.
    shows:
      - |-
        counts = {'bike': 73, 'moto': 110, 'carro': 17}
        counts['bike'] = counts['bike'] + 1
        print(counts)
    after_run: "{'bike': 74, 'moto': 110, 'carro': 17}. The bike pile went from 73 to 74. The pile's name is the name in the dict, and its running result is the value. To update a pile you read its value, change it, and put it back under the same name. That is count = count + 1, with the count kept under a name."
    note: "The thought, given on a dict of finished piles whose numbers are the real ones from SQL-1 (73, 110 and 17). The learner has already used both halves: reading by name and setting by name."

  # 4
  - kind: "ask"
    lang: "python"
    requires: ["name-a-value", "text-quotes", "dict", "get-by-name", "set-by-name", "show", "one-entry-per-pile"]
    text: "The dict counts holds bike at 73, moto at 110 and carro at 17. Two new carro couriers join. Raise the carro pile by 2, and show the dict."
    model: |-
      counts = {'bike': 73, 'moto': 110, 'carro': 17}
      counts['carro'] = counts['carro'] + 2
      print(counts)
    output: "{'bike': 73, 'moto': 110, 'carro': 19}"
    narration:
      - "{'bike': 73, 'moto': 110, 'carro': 19}. The carro pile was read, raised by 2, and put back under its own name."
      - "Read the pile, change it, put it back."
      - ""
    wrong:
      - code: |-
          counts = {'bike': 73, 'moto': 110, 'carro': 17}
          counts['carro'] + 2
          print(counts)
        ask: "The sum was worked out, but where did it go? What puts a value under a name?"
      - code: |-
          counts = {'bike': 73, 'moto': 110, 'carro': 17}
          counts['carro'] = 2
          print(counts)
        ask: "That put a 2 in place of the 17. What should the new value be made from?"
      - code: |-
          counts = {'bike': 73, 'moto': 110, 'carro': 17}
          counts[carro] = counts[carro] + 2
          print(counts)
        ask: "Is carro a name you made, or a word we are looking for?"
    walk:
      - "Make the dict."
      - "Read the carro pile: the dict's name, and carro in square brackets. Add 2."
      - "Put the result back under carro with an equals sign, then show the dict."
    return:
      text: "The dict counts holds bike at 73, moto at 110 and carro at 17. A new moto courier joins. Raise the moto pile by 1, and show the dict."
      model: |-
        counts = {'bike': 73, 'moto': 110, 'carro': 17}
        counts['moto'] = counts['moto'] + 1
        print(counts)
      output: "{'bike': 73, 'moto': 111, 'carro': 17}"
      narration:
        - "{'bike': 73, 'moto': 111, 'carro': 17}. The moto pile was read, raised and put back."
        - "A pile is a value under a name, and updating it is read, change and put back."
      note: "Return for step 4."
    note: "Updates a pile that exists. The next step is the pile that does not, which is the reason for the thought after it."

  # 5
  - kind: "give"
    lang: "python"
    new: ["pile-starts-at-zero"]
    text: |-
      But a pile that is not there yet cannot be raised: there is nothing under its name to read. First it has to be started, at zero. The question is whether the name is not in the dict, and not in is just in turned round, as in English:

      ```python
      counts = {}
      dish = 'pizza'
      if dish not in counts:
          counts[dish] = 0
      print(counts)
      ```

      Run it.
    shows:
      - |-
        counts = {}
        dish = 'pizza'
        if dish not in counts:
            counts[dish] = 0
        print(counts)
    after_run: "{'pizza': 0}. The dict started empty, so there was no pizza pile. The if saw that and started one at zero. Now the pile can be raised. An empty dict is two curly brackets with nothing in them, as an empty list was two square ones."
    note: "Taught first with an explicit check, so that .get arrives later as a shorter way to say something already understood and not as a rule (the map's note). not in is introduced as vocabulary in the same breath: the learner owns in from PY-3."

  # 6
  - kind: "ask"
    lang: "python"
    requires: ["name-a-value", "text-quotes", "dict", "get-by-name", "set-by-name", "show", "if-question", "block", "is-it-there", "pile-starts-at-zero"]
    text: "An empty dict called counts, and a courier who rides a bike. If bike has no pile in counts yet, start one at zero. Then show the dict."
    model: |-
      counts = {}
      vehicle = 'bike'
      if vehicle not in counts:
          counts[vehicle] = 0
      print(counts)
    output: "{'bike': 0}"
    narration:
      - "{'bike': 0}. The dict had no bike pile, so the if started one at zero."
      - "Not in asked the question, and the pile was started under the vehicle's name."
      - ""
    wrong:
      - code: |-
          counts = {}
          vehicle = 'bike'
          counts[vehicle] = counts[vehicle] + 1
          print(counts)
        ask: "Python stopped: there is nothing under bike to read yet. What has to happen to the pile first?"
      - code: |-
          counts = {}
          vehicle = 'bike'
          if vehicle in counts:
              counts[vehicle] = 0
          print(counts)
        ask: "Nothing was started. Does the question say yes when the dict is empty? What is the question we want?"
      - code: |-
          counts = {}
          vehicle = 'bike'
          if vehicle not in counts:
              counts[vehicle] = 1
          print(counts)
        ask: "A pile that has only just been started, before anything is counted: what is its value?"
    walk:
      - "Make an empty dict called counts, and name the vehicle."
      - "Ask whether the vehicle is not in counts."
      - "On a yes, put a zero under the vehicle's name. Then show the dict."
    return:
      text: "An empty dict called counts, and a courier who rides a moto. If moto has no pile yet, start one at zero. Then show the dict."
      model: |-
        counts = {}
        vehicle = 'moto'
        if vehicle not in counts:
            counts[vehicle] = 0
        print(counts)
      output: "{'moto': 0}"
      narration:
        - "{'moto': 0}. No moto pile existed, so one was started."
        - "A name that is not in the dict gets a pile at zero."
      note: "Return for step 6."
    note: "An easy step after the give. The wrong answers lead to the reason: a pile has to exist before it can be raised, and a new pile has counted nothing."

  # 7
  - kind: "give"
    lang: "python"
    new: ["update-the-pile"]
    text: |-
      Put the two together, inside a loop. For each item, find its pile, starting it at zero if it is not there, and raise that pile by one:

      ```python
      dishes = ['pizza', 'coca', 'pizza', 'sushi']
      counts = {}
      for dish in dishes:
          if dish not in counts:
              counts[dish] = 0
          counts[dish] = counts[dish] + 1
      print(counts)
      ```

      Run it.
    shows:
      - |-
        dishes = ['pizza', 'coca', 'pizza', 'sushi']
        counts = {}
        for dish in dishes:
            if dish not in counts:
                counts[dish] = 0
            counts[dish] = counts[dish] + 1
        print(counts)
    after_run: "{'pizza': 2, 'coca': 1, 'sushi': 1}. That is SELECT dish, COUNT(*) FROM dishes GROUP BY dish, by hand. The loop went through each row, and each row went to its pile and raised it. One name per pile, one count under it: one row per pile, in SQL's words."
    note: "Marked as essential. This is the commonest shape in plain-Python interview tasks, and the strand's version of the piles from SQL-1."

  # 8
  - kind: "classmate"
    lang: "python"
    requires: ["list", "show", "for-each", "block", "if-question", "compare-signs", "name-a-value", "text-quotes", "dict", "get-by-name", "set-by-name", "is-it-there", "one-entry-per-pile", "pile-starts-at-zero", "update-the-pile"]
    text: |-
      Ana was asked to count the statuses of three orders: delivered, cancelled and delivered. She wrote:

      ```python
      statuses = ['delivered', 'cancelled', 'delivered']
      counts = {}
      for status in statuses:
          counts[status] = counts[status] + 1
      print(counts)
      ```

      Python answered: KeyError: 'delivered'. Ana, was there a delivered pile the first time round? ... No. She raised a pile that did not exist. What does a pile need before it can grow? Type the whole program as she should have written it.
    model: |-
      statuses = ['delivered', 'cancelled', 'delivered']
      counts = {}
      for status in statuses:
          if status not in counts:
              counts[status] = 0
          counts[status] = counts[status] + 1
      print(counts)
    output: "{'delivered': 2, 'cancelled': 1}"
    broken: |-
      statuses = ['delivered', 'cancelled', 'delivered']
      counts = {}
      for status in statuses:
          counts[status] = counts[status] + 1
      print(counts)
    narration:
      - "{'delivered': 2, 'cancelled': 1}. Each status found its pile, started it at zero if it was new, and raised it."
      - "The if before the update is what Ana left out. Without it, the first status of each kind has nothing to read."
      - "Two delivered and one cancelled: GROUP BY status with a COUNT, by hand."
    wrong:
      - code: |-
          statuses = ['delivered', 'cancelled', 'delivered']
          counts = {}
          for status in statuses:
              counts[status] = counts[status] + 1
          print(counts)
        ask: "That is Ana's again. What has to exist before a pile can be raised?"
      - code: |-
          statuses = ['delivered', 'cancelled', 'delivered']
          counts = {}
          for status in statuses:
              if status not in counts:
                  counts[status] = 1
              counts[status] = counts[status] + 1
          print(counts)
        ask: "Delivered is counted as 3. What is a new pile worth before the first item is counted?"
      - code: |-
          statuses = ['delivered', 'cancelled', 'delivered']
          counts = {}
          for status in statuses:
              if status not in counts:
                  counts[status] = 0
          counts[status] = counts[status] + 1
          print(counts)
        ask: "The raise has been pushed out of the loop. Which lines belong inside it, for each status?"
    walk:
      - "Ana's loop is right except for one thing: the pile does not exist the first time."
      - "Before the raise, ask whether the status is not in counts yet, and if so start it at zero."
    return:
      text: "Count how many couriers ride each vehicle: bike, moto, bike, carro and bike. Show the dict."
      model: |-
        vehicles = ['bike', 'moto', 'bike', 'carro', 'bike']
        counts = {}
        for vehicle in vehicles:
            if vehicle not in counts:
                counts[vehicle] = 0
            counts[vehicle] = counts[vehicle] + 1
        print(counts)
      output: "{'bike': 3, 'moto': 1, 'carro': 1}"
      narration:
        - "{'bike': 3, 'moto': 1, 'carro': 1}. Each vehicle found its pile, started it if it was new, and raised it."
        - "Check, start at zero, raise: the three lines for every pile."
      note: "Return for the classmate step."
    note: "Ana makes the slip the learner is most likely to make, before the learner can (rule E6), and Python's KeyError is the real reason. The learner repairs it by typing the whole program, so the thought is exercised before the first free attempt."

  # 9
  - kind: "aside"
    lang: "python"
    text: "Something that is only interesting, with nothing in it to keep. People were making piles by hand long before computers. Counting votes, or counting sheep in a field, you make a mark for each one under its own heading and then read off the marks. The tally marks you may have seen, four strokes and a fifth across them, are the same idea: one pile for each kind of thing, and a count that goes up by one. What you just wrote is a tally, kept in a dict."
    note: "Relief after the climb of steps 7 and 8 (rule C8). A real thing, not a mnemonic. It makes the pile idea concrete and can be skipped without loss."

  # 10
  - kind: "ask"
    lang: "python"
    requires: ["list", "show", "for-each", "block", "if-question", "compare-signs", "name-a-value", "text-quotes", "dict", "get-by-name", "set-by-name", "text-in-list", "is-it-there", "go-through-dict", "one-entry-per-pile", "pile-starts-at-zero", "update-the-pile"]
    text: "Six restaurants serve these cuisines: pizza, japonesa, pizza, arabe, japonesa and pizza. Count the restaurants for each cuisine in a dict, and then show each cuisine with its count, one line each."
    thinking_order: "Make the list, and an empty dict. For each cuisine, start its pile if it is new, and raise it. Then go through the piles and show each with its count."
    model: |-
      cuisines = ['pizza', 'japonesa', 'pizza', 'arabe', 'japonesa', 'pizza']
      counts = {}
      for cuisine in cuisines:
          if cuisine not in counts:
              counts[cuisine] = 0
          counts[cuisine] = counts[cuisine] + 1
      for cuisine in counts:
          print(cuisine, counts[cuisine])
    output: |-
      pizza 3
      japonesa 2
      arabe 1
    narration:
      - "pizza 3, japonesa 2, arabe 1. One loop made the piles, and a second one read them out."
      - "Make the piles, then show them: two loops, one after the other."
      - "Three piles, one for each cuisine, each with its count."
    wrong:
      - code: |-
          cuisines = ['pizza', 'japonesa', 'pizza', 'arabe', 'japonesa', 'pizza']
          counts = {}
          for cuisine in cuisines:
              counts[cuisine] = counts[cuisine] + 1
          for cuisine in counts:
              print(cuisine, counts[cuisine])
        ask: "Python stopped on the first cuisine. What has to be true of a pile before it can be raised?"
      - code: |-
          cuisines = ['pizza', 'japonesa', 'pizza', 'arabe', 'japonesa', 'pizza']
          counts = {}
          for cuisine in cuisines:
              if cuisine not in counts:
                  counts[cuisine] = 1
              counts[cuisine] = counts[cuisine] + 1
          for cuisine in counts:
              print(cuisine, counts[cuisine])
        ask: "Every count is one too many. What does a pile hold before anything has been counted?"
      - code: |-
          cuisines = ['pizza', 'japonesa', 'pizza', 'arabe', 'japonesa', 'pizza']
          counts = {}
          for cuisine in cuisines:
              if cuisine not in counts:
                  counts[cuisine] = 0
              counts[cuisine] = counts[cuisine] + 1
          print(counts)
        ask: "The piles are made, but I asked for one line for each. What goes through them to show each?"
    walk:
      - "Make the list of cuisines and an empty dict called counts."
      - "For each cuisine: if it is not in counts, start it at zero. Then raise it by one."
      - "After that loop, go through counts, and show each cuisine with its count."
    return:
      text: "Seven couriers ride bike, moto, bike, carro, bike, moto and bike. Count the couriers for each vehicle in a dict, and show each vehicle with its count, one line each."
      model: |-
        vehicles = ['bike', 'moto', 'bike', 'carro', 'bike', 'moto', 'bike']
        counts = {}
        for vehicle in vehicles:
            if vehicle not in counts:
                counts[vehicle] = 0
            counts[vehicle] = counts[vehicle] + 1
        for vehicle in counts:
            print(vehicle, counts[vehicle])
      output: |-
        bike 4
        moto 2
        carro 1
      narration:
        - "bike 4, moto 2, carro 1. Piles made in one loop and read out in a second."
        - "The piles, then the showing: two loops, one after the other."
      note: "Return for step 10."
    note: "The first free attempt at the whole shape, after the classmate. Showing the piles with a second loop is the thing the closing sentence needs too. The cuisine names are real ones from restaurants.csv."

  # 11
  - kind: "give"
    lang: "python"
    new: ["get-with-default"]
    text: |-
      That check and that starting at zero are written so often that dicts have a shorter way to say them: get. counts.get(dish, 0) means: what is under dish in counts, or 0 if the name is not there. The three lines of the loop become one:

      ```python
      dishes = ['pizza', 'coca', 'pizza', 'sushi']
      counts = {}
      for dish in dishes:
          counts[dish] = counts.get(dish, 0) + 1
      print(counts)
      ```

      Run it.
    shows:
      - |-
        dishes = ['pizza', 'coca', 'pizza', 'sushi']
        counts = {}
        for dish in dishes:
            counts[dish] = counts.get(dish, 0) + 1
        print(counts)
    after_run: "{'pizza': 2, 'coca': 1, 'sushi': 1}, the same as before. The check and the starting at zero went inside the get: look for the pile, and if it is not there, use zero. Same idea, fewer words. The dot and the brackets are as with append: do this to that dict."
    note: "Arrives as a shorter way to say something already understood (the map's note), so it is a labour saved and not a rule to remember."

  # 12
  - kind: "classmate"
    lang: "python"
    requires: ["list", "show", "for-each", "block", "if-question", "compare-signs", "name-a-value", "text-quotes", "dict", "get-by-name", "set-by-name", "one-entry-per-pile", "pile-starts-at-zero", "update-the-pile", "get-with-default"]
    text: |-
      Davi counted the statuses of three orders the short way, and wrote:

      ```python
      statuses = ['delivered', 'cancelled', 'delivered']
      counts = {}
      for status in statuses:
          counts[status] = counts.get(status) + 1
      print(counts)
      ```

      Python answered: TypeError: unsupported operand type(s) for +: 'NoneType' and 'int'. Davi, what does get hand back when the name is not there, and you have given it nothing to hand back instead? ... Nothing at all, which Python calls None. And you cannot add one to nothing. The second thing in the brackets is what get hands back for a pile that is not there yet. Type the whole program as Davi should have written it.
    model: |-
      statuses = ['delivered', 'cancelled', 'delivered']
      counts = {}
      for status in statuses:
          counts[status] = counts.get(status, 0) + 1
      print(counts)
    output: "{'delivered': 2, 'cancelled': 1}"
    broken: |-
      statuses = ['delivered', 'cancelled', 'delivered']
      counts = {}
      for status in statuses:
          counts[status] = counts.get(status) + 1
      print(counts)
    narration:
      - "{'delivered': 2, 'cancelled': 1}. The 0 inside the get is what a missing pile counts as."
      - "Without the second thing in the brackets, get hands back nothing, and there is nothing to add to."
      - "The same piles as before, with one line doing the work of three."
    wrong:
      - code: |-
          statuses = ['delivered', 'cancelled', 'delivered']
          counts = {}
          for status in statuses:
              counts[status] = counts.get(status) + 1
          print(counts)
        ask: "That is Davi's again. What goes in the brackets after the name, to say what a missing pile counts as?"
      - code: |-
          statuses = ['delivered', 'cancelled', 'delivered']
          counts = {}
          for status in statuses:
              counts[status] = counts.get(status, 1) + 1
          print(counts)
        ask: "Delivered comes out as 3. What does a pile count as before anything is counted?"
      - code: |-
          statuses = ['delivered', 'cancelled', 'delivered']
          counts = {}
          for status in statuses:
              counts[status] = counts[status, 0] + 1
          print(counts)
        ask: "Python stopped. Which word means what is there, or this if nothing is?"
    walk:
      - "Davi's loop is right. Look at the get."
      - "Inside its brackets, after the name, put what a missing pile should count as."
    return:
      text: "Count how many couriers ride each vehicle the short way: bike, bike and moto. Show the dict."
      model: |-
        vehicles = ['bike', 'bike', 'moto']
        counts = {}
        for vehicle in vehicles:
            counts[vehicle] = counts.get(vehicle, 0) + 1
        print(counts)
      output: "{'bike': 2, 'moto': 1}"
      narration:
        - "{'bike': 2, 'moto': 1}. A missing pile counted as zero, and was raised."
        - "Get with a zero: what is there, or nothing counted yet."
      note: "Return for the Davi step."
    note: "Davi makes the slip before the learner can (rule E6). None appears here for the first time, as the real reason for the zero. PY-5 gives it a proper step as 'nothing' with the question is None. Nothing is asked about it yet, and the narration says only that it is nothing."

  # 13
  - kind: "ask"
