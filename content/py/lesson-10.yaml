  # 6
  - kind: "give"
    lang: "python"
    new: ["each-thing-once"]
    text: |-
      Another small tool: `set`. Give it a list and it keeps each thing once. It does not keep any order, so when the order matters, sort it.

      ```python
      items = ['pizza', 'coca', 'pizza', 'sushi', 'coca']
      print(len(set(items)))
      print(sorted(set(items)))
      ```

      Run it.
    shows:
      - |-
        items = ['pizza', 'coca', 'pizza', 'sushi', 'coca']
        print(len(set(items)))
        print(sorted(set(items)))
    after_run: "3 different things, and the three of them in alphabetical order. A set is for the question of what is there, and not in what order. It is the same idea as SELECT DISTINCT in SQL."
    note: "each-thing-once. Sorted is used so that the printed output is stable (a set has no order). The SQL import is DISTINCT, named in the after_run."

