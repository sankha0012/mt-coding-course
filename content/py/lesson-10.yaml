                    count = count + 1
                seen[item] = True
            return count
      output: "3"
      narration:
        - "3: pizza, coca and pizza again. One pass, with a count in place of a list."
        - "The same one pass, counting."
      note: "Return for step 10."
    note: "The one-pass version of an interview question that is also asked as a double loop. The dict lookup is the point (cost-in-words, second statement). The edge cases are the empty list and a list with no repeats, in the check on purpose."

  # 11
  - kind: "aside"
    text: "Only interesting. A dict finds a name without walking through the others. It turns the name into a number, which says where in memory to look, and goes straight there. The number is called a hash. That is the real reason a dict lookup costs the same however big the dict is, and it is all you need to know about it."

  # 12
  - kind: "give"
    lang: "python"
    new: ["three-checks"]
    text: |-
      A function is only finished when you have tried it. Try three things, always the same three: the ordinary case, the empty case, and the awkward case, where something ties or sits at an edge. Here they are for `top_k`, written as the checks you met earlier. If all of them hold, nothing prints but the last line.

      ```python
      def top_k(items, k):
          counts = {}
          for item in items:
              counts[item] = counts.get(item, 0) + 1
          ranked = sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))
          return ranked[:k]

      assert top_k(['a', 'b', 'a'], 1) == [('a', 2)]
      assert top_k([], 3) == []
      assert top_k(['b', 'a'], 2) == [('a', 1), ('b', 1)]
      print('held')
      ```

      Run it.
    shows:
      - |-
        def top_k(items, k):
            counts = {}
            for item in items:
                counts[item] = counts.get(item, 0) + 1
            ranked = sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))
            return ranked[:k]

        assert top_k(['a', 'b', 'a'], 1) == [('a', 2)]
        assert top_k([], 3) == []
        assert top_k(['b', 'a'], 2) == [('a', 1), ('b', 1)]
        print('held')
    after_run: "Held. The ordinary case: a repeats and wins. The empty case: nothing in, nothing out. The awkward case: a tie, which has to come out in alphabetical order. Those are the three you reach for first, on any function, and an interviewer is usually waiting to see whether you do."
    note: "three-checks. Uses check-with-assert from PY-5 (silence means it held). The awkward case is a tie, the one the learner met in PY-7."

  # 13
