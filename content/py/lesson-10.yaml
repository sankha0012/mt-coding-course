                  result.append(item)
              seen[item] = True
          return result
    output: |-
      ['pizza', 'coca', 'pizza']
      []
      []
    narration:
      - "Pizza, coca, pizza: each one the moment it came round again. One pass, and each look into seen was a dict lookup, which costs the same however long the list is. So this is linear."
      - "Asking a dict whether a name is there does not walk through the names. That is why one pass with a dict beats a loop inside a loop."
      - ""
    wrong:
