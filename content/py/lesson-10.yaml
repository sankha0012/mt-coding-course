      - code: |-
          def repeated(items):
              seen = {}
              result = []
              for item in items:
                  seen[item] = True
                  if item in seen:
                      result.append(item)
              return result
        ask: "Every item comes back. Is the item in seen before you ask?"
        why: "it was written in before the question, so it is always there. The question comes first, then the writing."
      - code: |-
          def repeated(items):
              result = []
              for item in items:
                  if items.count(item) > 1:
                      result.append(item)
              return result
        ask: "That is a different thing: it gives every copy of a repeated thing, the first as well. Which ones was I asking for?"
        why: "the first appearance is not a repeat. Only the later ones are."
    walk:
      - "Start an empty dict for what you have seen, and an empty list for the answer."
      - "For each item: if it is already in the dict, add it to the answer."
      - "Whatever happened, write the item into the dict. Hand the answer back."
    return:
      text: "Write `count_repeats`, which takes a list of items and hands back how many times an item had already appeared earlier in the list. Go through the list once, and keep what you have seen in a dict."
      check: "print(count_repeats(['pizza', 'coca', 'pizza', 'sushi', 'coca', 'pizza']))"
      model: |-
        def count_repeats(items):
            seen = {}
            count = 0
            for item in items:
