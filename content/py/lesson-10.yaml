  # 9
  - kind: "give"
    lang: "python"
    new: ["cost-in-words"]
    text: |-
      Now a different kind of question: how much work does a program do as its input grows? Not seconds, which depend on the machine, but steps, which do not. Here are two programs that only count their own steps. One goes through n things once. The other goes through all pairs of n things, a loop inside a loop.

      ```python
      def one_pass(n):
          count = 0
          for i in range(n):
              count = count + 1
          return count

      def pair_by_pair(n):
          count = 0
          for i in range(n):
              for j in range(n):
                  count = count + 1
          return count

      print(one_pass(10), one_pass(100), one_pass(1000))
      print(pair_by_pair(10), pair_by_pair(100), pair_by_pair(1000))
      ```

      Run it.
    shows:
      - |-
        def one_pass(n):
            count = 0
            for i in range(n):
                count = count + 1
            return count

        def pair_by_pair(n):
            count = 0
            for i in range(n):
                for j in range(n):
                    count = count + 1
            return count

        print(one_pass(10), one_pass(100), one_pass(1000))
        print(pair_by_pair(10), pair_by_pair(100), pair_by_pair(1000))
    after_run: "Ten times as many things: one pass does ten times the work, and the pairs do a hundred times the work. A thousand things and the pairs are at a million. That is what people mean by linear and quadratic: work that grows in step with the input, and work that grows with its square. Say it in words and you pass the question: one pass is linear, a loop inside a loop is quadratic."
    note: "cost-in-words. It counts steps and not seconds, because nothing in this course is timed. Only the first two statements of the thought are shown here. The other two come in the next steps: a dict lookup and a sort."

