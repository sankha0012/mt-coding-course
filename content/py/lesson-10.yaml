lesson: py-10
title: "Say it shorter, say its cost"
strand: py
stage: 2
thoughts:
  one-line-list: "`[s for s in subtotals if s > 50]` is the loop, the question and the adding, in one line. What to collect comes first."
  each-thing-once: "`set(items)` keeps each thing once, in no particular order."
  cost-in-words: "One pass is linear. A loop inside a loop is quadratic. Looking a name up in a dict costs the same however big it is. Sorting costs a little more than one pass."
  three-checks: "Three checks for any function: the ordinary case, the empty case, and the awkward case."
  while-loop: {text: "`while` repeats for as long as its question says yes.", grade: shape}
  two-positions: {text: "Two positions move through two sorted lists, and the smaller item is taken each time.", grade: shape}
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "new-list-in-loop", "add-to-end", "if-question", "and-or", "nothing", "remember-previous", "compare-with-previous", "start-new-group"]
    text: "Write a function called `session_starts` that takes a list of times and a gap, and hands back the first time of each session: a time starts one if it is the very first, or more than the gap after the one before."
    check: |-
      print(session_starts([1, 5, 9, 50, 55, 120], 30))
      print(session_starts([], 30))
    model: |-
      def session_starts(times, gap):
          starts = []
          previous = None
          for t in times:
              if previous is None or t - previous > gap:
                  starts.append(t)
              previous = t
          return starts
    output: |-
      [1, 50, 120]
      []
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from PY-9: the loop that remembers, with the start of a group as the question. A combination not practised. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["one-line-list"]
    text: |-
      You have written this loop many times: start an empty list, go through something, ask a question, add on a yes. Python has a way to say all of that in one line. Here is the loop, and under it the one line that does the same.

      ```python
      subtotals = [81.1, 18.85, 84.23, 91.11, 31.3]

      kept = []
      for s in subtotals:
          if s > 50:
              kept.append(s)
      print(kept)

      print([s for s in subtotals if s > 50])
      ```

      Run it.
    shows:
      - |-
        subtotals = [81.1, 18.85, 84.23, 91.11, 31.3]

        kept = []
        for s in subtotals:
            if s > 50:
                kept.append(s)
        print(kept)

        print([s for s in subtotals if s > 50])
    after_run: "The same list twice. Read the one line from the middle out: for each s in subtotals, if s is above 50, and in front goes what to collect, here just s. The brackets make it a list. What to collect, the loop, the question. It is the loop and nothing else, so keep the loop in your head and the line follows."
    note: "one-line-list. The learner has just written the loop many times, so the line is the same thing said shorter. SELECT s FROM subtotals WHERE s > 50 is the SQL echo, and it is in the after_run only as the reading order."

  # 3
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "one-line-list", "if-question"]
    text: "Write a function called `above` that takes a list of values and a limit, and hands back the values that are above the limit, in one line."
    check: "print(above([81.1, 18.85, 84.23, 91.11, 31.3], 50))"
    model: |-
      def above(values, limit):
          return [v for v in values if v > limit]
    output: "[81.1, 84.23, 91.11]"
    narration:
      - "Three values come back: the ones that passed. What to collect, the loop, the question, all in one pair of brackets."
      - "That is the loop from before, folded into a line."
      - ""
    wrong:
      - code: |-
          def above(values, limit):
              return [v > limit for v in values]
        ask: "That is a list of True and False, one for each value. What goes in front: the question, or what you want to collect?"
        why: "the front is what to collect. The question goes at the end, where it keeps or drops."
      - code: |-
          def above(values, limit):
              return [v if v > limit for v in values]
        ask: "Python calls that a syntax error. Where does the question go in the one-line version?"
        why: "at the end, after the loop part. The loop part comes first, then the question."
      - code: |-
          def above(values, limit):
              return [v for v in values] if v > limit
        ask: "Python says v is not defined. Where does v exist?"
        why: "v is only a name inside the brackets. The question has to be inside them too."
    walk:
      - "Say it as a loop first: for each v in values, if v is above the limit, collect v."
      - "Put the thing to collect at the front."
      - "Then the loop part, then the question, all inside square brackets."
    return:
      text: "Write `below`, which takes a list of values and a limit, and hands back the values that are below the limit, in one line."
      check: "print(below([81.1, 18.85, 84.23, 91.11, 31.3], 50))"
      model: |-
        def below(values, limit):
            return [v for v in values if v < limit]
      output: "[18.85, 31.3]"
      narration:
        - "18.85 and 31.3 are the two below 50. The same line with the question turned round."
        - "A smaller-than question in the same one line."
      note: "Return for step 3."
    note: "one-line-list asked at once, straight after the give. The three wrong answers are the real slips in order of how common they are."

