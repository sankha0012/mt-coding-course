        for fee in fees:
            if fee > 5:
                print(fee)
    after_run: "8.99 and 6.99. The zero answered no, so the print did not run for it. Each fee was asked the question, and only the yes ones ran the line pushed in under it. That was WHERE, by hand. The signs are the ones from maths, as they were in SQL."
