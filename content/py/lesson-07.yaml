  # 9
  - kind: "give"
    lang: "python"
    new: ["lambda"]
    text: |-
      That small function is only ever used once, and it takes three lines. Python lets you write a function right where you use it, with no name and no def. It is written `lambda`, then what comes in, a colon, and what comes out.

      ```python
      counts = {'pizza': 3, 'coca': 2, 'sushi': 1}
      print(sorted(counts.items(), key=lambda pair: pair[1]))
      ```

      Run it.
    shows:
