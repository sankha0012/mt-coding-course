      Python stopped with: TypeError: second() missing 1 required positional argument: 'pair'. Ana, with brackets, is second being handed over, or run right now? ... Run right now, with nothing to look at. Without brackets it is handed over, and sorted runs it on each pair when it needs to. Take the brackets off:

      ```python
      def second(pair):
          return pair[1]

      counts = {'pizza': 3, 'coca': 2, 'sushi': 1}
      print(sorted(counts.items(), key=second))
      ```

      Run it.
