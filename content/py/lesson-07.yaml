  # 6
  - kind: "give"
    lang: "python"
    new: ["key-function"]
    text: |-
      Now to sort pairs. Plain sorted puts pairs in order of their first part, the name. To sort by the count instead, you hand sorted a small function that says what to look at, and it is called on each pair. The function goes in as `key=`, and it is written with no brackets after it.

      ```python
      def second(pair):
          return pair[1]

      counts = {'pizza': 3, 'coca': 2, 'sushi': 1}
      print(sorted(counts.items()))
      print(sorted(counts.items(), key=second))
      ```

      Run it.
    shows:
      - |-
        def second(pair):
            return pair[1]

        counts = {'pizza': 3, 'coca': 2, 'sushi': 1}
        print(sorted(counts.items()))
        print(sorted(counts.items(), key=second))
    after_run: "The first line is by name: coca, pizza, sushi. The second is by count: sushi has 1, coca 2, pizza 3. Sorted called second on each pair, and sorted by what came back. That is ORDER BY in SQL: the thing after the words is now a function, because Python has no other way to say what to look at."
    note: "key-function. The SQL import is named out loud. The give shows both sorts in one run, so that the difference is visible."

  # 7
