lesson: py-07
title: "Sort by a rule"
strand: py
stage: 1
thoughts:
  pair: "`('pizza', 3)` is a pair: two values that travel together, in round brackets, reached by position like a list."
  dict-as-pairs: "`counts.items()` hands a dict over as pairs, a name and its value together."
  key-function: "`sorted(pairs, key=f)`: the function `f` is handed each item and says what to sort by. It is written without brackets after it."
  lambda: "`lambda pair: pair[1]` is a small function written where it is used: what comes in, a colon, what comes out."
  tie-rule: "A key that returns a pair sorts by the first part, then by the second when the first parts tie. A minus sign turns a number's order round without turning the rest."
steps:
  # 1
  - kind: "cold-check"
    requires: ["conditional-count", "buckets", "piles", "one-row-per-pile", "pile-name", "commas"]
