    text: "Write a function called `swap` that takes a pair and hands back a new pair with the two parts the other way round."
    check: "print(swap(('pizza', 3)))"
    model: |-
      def swap(pair):
          return (pair[1], pair[0])
    output: "(3, 'pizza')"
    narration:
      - "The count first and the dish second. You took each part by its position and built a new pair, with a comma between and round brackets round both."
      - "Second part, first part, in round brackets. A new pair, handed back."
      - ""
    wrong:
      - code: |-
          def swap(pair):
              return [pair[1], pair[0]]
        ask: "Look at the brackets around what came back. What is a pair written with?"
        why: "square brackets build a list. A pair wears round ones."
      - code: |-
          def swap(pair):
              return (pair[1])
        ask: "How many things came back? What is between the two parts that makes it a pair?"
        why: "round brackets around one thing are only brackets. A pair needs a comma between its parts."
      - code: |-
          def swap(pair):
              return (pair[0], pair[1])
        ask: "Check the order of the two parts in what came back. Which one should be first?"
        why: "the new pair starts with the second part of the old one."
    walk:
      - "Take the second part of the pair, by its position."
      - "Take the first part."
      - "Put both in round brackets with a comma between them, the second part first, and hand that back."
    return:
      text: "Write `bump`, which takes a pair of a name and a count, and hands back a pair with the same name and the count one higher."
      check: "print(bump(('pizza', 3)))"
      model: |-
        def bump(pair):
            return (pair[0], pair[1] + 1)
      output: "('pizza', 4)"
      narration:
        - "('pizza', 4): the name stayed in front, and the count had one added."
        - "A new pair, built from the old one's parts."
      note: "Return for step 3."
    note: "pair, asked straight after it was given. The three wrong answers are the real slips: a list, one thing in brackets, and the original order."

  # 4
  - kind: "give"
    lang: "python"
    new: ["dict-as-pairs"]
    text: |-
      Here is where pairs turn up on their own. When you go through a dict with a loop, each turn can hand you the name and its value together, as a pair. The way to ask is `.items()`.

      ```python
      counts = {'pizza': 3, 'coca': 2, 'sushi': 1}
      for pair in counts.items():
          print(pair)
      ```

      Run it.
    shows:
      - |-
        counts = {'pizza': 3, 'coca': 2, 'sushi': 1}
        for pair in counts.items():
            print(pair)
    after_run: "Three pairs, a name and its count in each. Before, you gave each half its own name at once. Here you kept the pair whole, and pair[0] and pair[1] reach its parts. The dict was handed over as pairs, which is all .items() ever did."
    note: "dict-as-pairs. The same loop as two-names in PY-3, with one name for the whole pair. It is what makes pairs matter: they are how a dict is sorted."

