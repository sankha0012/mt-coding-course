    after_run: "The same result as with second. The lambda is the whole of def second(pair): return pair[1], squeezed into one small piece. Pair is what comes in, and pair[1] is what comes out, with no return word. The word lambda comes from mathematics, and that is the whole story. It just is."
    note: "lambda: core, typed from memory later (owner's decision of 24 Nov 2026). Its origin is real (Church), and the step says 'it just is' for the word, with no invented hook."

