  # 12
  - kind: "give"
    lang: "python"
    new: ["tie-rule"]
    text: |-
      What if two things tie? Put them in a dict of counts where pizza and coca each appear twice. The key does not have to be one number. It can be a pair, and Python compares two pairs by their first part, and by the second only when the first parts are equal.

      ```python
      counts = {'pizza': 2, 'coca': 2, 'sushi': 1, 'acai': 1}
      print(sorted(counts.items(), key=lambda pair: (pair[1], pair[0])))
      ```

      Run it.
    shows:
      - |-
        counts = {'pizza': 2, 'coca': 2, 'sushi': 1, 'acai': 1}
        print(sorted(counts.items(), key=lambda pair: (pair[1], pair[0])))
    after_run: "Smallest count first, and where two counts are the same, by name: acai before sushi, coca before pizza. The key was a pair: count, then name. In SQL that is ORDER BY count, name."
    note: "tie-rule, first half: a key can be a pair. The second half, the minus sign, comes with the classmate."

  # 13
  - kind: "classmate"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "pair", "position", "dict-as-pairs", "sorted", "key-function", "lambda", "tie-rule"]
    text: |-
      Davi wants the most common first, and where two are equally common, alphabetical. He tried this:

      ```python
      sorted(counts.items(), key=lambda pair: (pair[1], pair[0]), reverse=True)
      ```

      and got pizza before coca, because reverse turned the names round as well as the counts. A minus sign in front of a number turns only that number's order round: the biggest count becomes the smallest key. Write `ranked`, which takes a dict of counts and hands back its pairs, the most common first and ties in alphabetical order.
    check: "print(ranked({'pizza': 2, 'coca': 2, 'sushi': 1, 'acai': 1}))"
    model: |-
      def ranked(counts):
          return sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))
    output: "[('coca', 2), ('pizza', 2), ('acai', 1), ('sushi', 1)]"
    narration:
      - "Biggest counts first, and coca before pizza where they tied. The minus turned the counts round and left the names alone."
      - "The key is a pair: minus the count, then the name. Smaller keys come first, so a big count, made negative, comes first."
      - ""
    wrong:
      - code: |-
          def ranked(counts):
              return sorted(counts.items(), key=lambda pair: (pair[1], pair[0]), reverse=True)
        ask: "Look at the two that tie. Which comes first, and which should?"
        why: "reverse turns the whole order round, names included."
      - code: |-
          def ranked(counts):
              return sorted(counts.items(), key=lambda pair: (pair[0], -pair[1]))
        ask: "Which part of the key is looked at first? What are the pairs sorted by, mostly?"
        why: "the first part of the key decides, and the second only breaks ties. The count has to come first."
      - code: |-
          def ranked(counts):
              return sorted(counts.items(), key=lambda pair: -pair[1])
        ask: "Coca and pizza are equal there, so who decides which of them comes first?"
        why: "with no second part to the key, equal items stay in the order they came in. The question asked for alphabetical."
    walk:
      - "Sort the pairs, with a lambda as the key."
      - "The key is a pair of two things. The first is the count, turned round with a minus."
      - "The second is the name, which only matters when the counts tie."
    return:
      text: "Write `rarest`, which takes a dict of counts and hands back its pairs, the least common first and ties in alphabetical order."
      check: "print(rarest({'pizza': 2, 'coca': 2, 'sushi': 1, 'acai': 1}))"
      model: |-
        def rarest(counts):
            return sorted(counts.items(), key=lambda pair: (pair[1], pair[0]))
      output: "[('acai', 1), ('sushi', 1), ('coca', 2), ('pizza', 2)]"
      narration:
        - "Acai and sushi, with 1 each and in alphabetical order, then coca and pizza. A pair for a key, and no minus needed."
        - "Smallest count first, ties by name: the plain pair, as it was first shown."
      note: "Return for step 13."
    note: "Classmate with the learner repairing: the Davi story is in the text. Python raises no message here, so the real reason is the wrong tie order, which is stated. Both halves of tie-rule are now in use. 'Smaller keys first' is the real reason for the minus."

