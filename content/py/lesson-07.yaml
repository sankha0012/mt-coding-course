    model: "SELECT promised_minutes, SUM(CASE WHEN status = 'cancelled' THEN 1 ELSE 0 END) FROM orders GROUP BY promised_minutes"
    rows: 3
    result: [[30, 117], [40, 140], [50, 142]]
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from SQL-9: a count of only some of the rows in each pile, on a combination not practised. Never scored. SQL, so no lang."

  # 2
  - kind: "give"
    lang: "python"
    new: ["pair"]
    text: |-
      Back to Python. Your dicts hold things under names. Sometimes two values simply belong together, and have no name between them: a dish and how many times it was ordered. Python calls two values that travel together a pair, and writes it in round brackets.

      ```python
      pair = ('pizza', 3)
      print(pair[0])
      print(pair[1])
      ```

      Run it.
    shows:
      - |-
        pair = ('pizza', 3)
        print(pair[0])
        print(pair[1])
    after_run: "pizza, then 3. A pair is reached the way a list is: by position, from zero. The one difference is the brackets. Round for a pair, square for a list. Nobody chose it for a reason you could use. It just is."
    note: "pair. Reuses position from PY-2. The 'it just is' is for the round brackets: no invented hook."

