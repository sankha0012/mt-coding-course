lesson: py-06
title: "A table by hand"
strand: py
stage: 1
thoughts:
  row-is-dict: "A row is a dict: the column names are the names, and this row's cells are the values."
  table-is-list-of-rows: "A table is a list of rows. Two pairs of square brackets pick a cell: the row first, then the column's name."
  cell: "`row['status']` is one cell: the row is asked for the column's name, as a dict is asked for anything."
  missing-is-none: "An empty cell in a row is `None`, the same `None` that stands for nothing. A file hands it over as empty text, and we turn it into `None` ourselves."
  skip-the-missing: "`if row['subtotal'] is not None:` leaves the empty cells out, which is what `AVG` and `SUM` did for you."
  read-a-file: {text: "`csv.DictReader` turns a file into rows like these. Every cell arrives as text.", grade: shape}
  text-to-number: "A cell from a file is text, even when it looks like a number. `float('81.1')` turns it into a number."
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "for-each", "if-question", "running-result", "how-many", "empty-case", "nothing"]
    text: "Write a function called `share_over` that takes a list of values and a limit, and hands back what fraction of the values are above the limit. If the list is empty it hands back None."
    check: |-
      print(share_over([30, 45, 50, 20], 40))
      print(share_over([], 40))
    model: |-
      def share_over(values, limit):
          if len(values) == 0:
              return None
          count = 0
          for v in values:
              if v > limit:
                  count = count + 1
          return count / len(values)
    output: |-
      0.5
      None
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from PY-5: a function, a loop with a running result, the empty case. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["row-is-dict"]
    text: |-
      Today the lists get rows in them. You know what a row is: one line of the orders table, with a value under each column's name. Python already has something that holds values under names, and you have used it. A dict. So a row is a dict: the column names are the names, and this row's cells are the values.

      ```python
      row = {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1}
      print(row)
      ```

      Run it.
    shows:
      - |-
        row = {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1}
        print(row)
    after_run: "One row of orders, cut down to three columns. Nothing was built here that you did not have. It is a dict, and it is looked at the way a dict is looked at: by name. SQL had the columns, and here they are the names."
    note: "The first thought of the doorway to pandas: a row is a dict. It is an import from SQL (a row) and from PY-3 (a dict) at once, so it is given and not asked."

  # 3
  - kind: "ask"
    lang: "python"
    new: ["cell"]
    requires: ["def", "what-goes-in", "what-comes-out", "row-is-dict", "cell", "get-by-name"]
    text: "Here is the first thing anyone does with a row: look at one cell. Write a function called `status_of` that takes a row and hands back its status."
    check: "print(status_of({'order_id': 7, 'status': 'cancelled', 'subtotal': 12.5}))"
    model: |-
      def status_of(row):
          return row['status']
    output: "cancelled"
    narration:
      - "The status, handed back. That is a cell: one value from one row, asked for by the column's name, in square brackets with the name in quotes."
      - "A row is a dict, so you asked it by name. The cell comes out and goes back to whoever called."
      - ""
    wrong:
      - code: |-
          def status_of(row):
              return row.status
        ask: "That is how some languages ask for a part of something. Python's own message is that a dict has no attribute called status. How did we ask a dict for what is under a name?"
        why: "a row is a dict, and a dict is asked with square brackets and the name in quotes."
      - code: |-
          def status_of(row):
              return row[status]
        ask: "Python says name 'status' is not defined. Is status a name you gave a value to, or a word you are looking for?"
        why: "a word we are looking for wears quotes. A bare word is a name Python goes looking for."
      - code: |-
          def status_of(row):
              print(row['status'])
        ask: "That showed the status to us, but the function gave nothing back to whoever asked. Which word hands a value back?"
        why: "print shows to a person, return hands to the code that called. The check is code."
    walk:
      - "Here is a row: `row = {'status': 'cancelled'}`. Type the line that shows its status."
      - "Now make it a function that takes the row as what goes in."
      - "Instead of showing the status, hand it back."
    return:
      text: "Now write `to_pay`, which takes a row and hands back the subtotal and the delivery fee added together."
      check: "print(to_pay({'order_id': 7, 'subtotal': 12.5, 'delivery_fee': 4.99}))"
      model: |-
        def to_pay(row):
            return row['subtotal'] + row['delivery_fee']
      output: "17.490000000000002"
      narration:
        - "12.5 and 4.99 added: 17.49. Two cells of the same row, each asked by its name."
        - "Two cells, one sum, handed back."
      note: "Return for step 3. Two cells instead of one, and an addition."
    note: "The first cell. It needs only get-by-name, so it is asked and not given. A function is used so that the learner does not have to type a row each time. The three wrong answers are the three real ways to miss it."

  # 4
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "row-is-dict", "cell"]
    text: "A delivery has a promised time and an actual time, which sit in its row as promised_minutes and actual_minutes. Write a function called `minutes_late` that takes a row and hands back how many minutes it took beyond the promise: the actual minutes less the promised minutes."
    check: "print(round(minutes_late({'promised_minutes': 30, 'actual_minutes': 35.2}), 1))"
    model: |-
      def minutes_late(row):
          return row['actual_minutes'] - row['promised_minutes']
    output: "5.2"
    narration:
      - "Two cells from the same row, taken away from each other. 5.2 minutes over, in the sample."
      - "Ask the row for each cell by its name, and do the sum on what comes out."
      - ""
    wrong:
      - code: |-
          def minutes_late(row):
              return row['promised_minutes'] - row['actual_minutes']
        ask: "Try a delivery that took longer than promised. Is the answer positive or negative? Which one did we say to take away from which?"
        why: "actual less promised is positive when the delivery was late, and the order of a subtraction matters."
      - code: |-
          def minutes_late(row):
              return row[actual_minutes] - row[promised_minutes]
        ask: "Python says name 'actual_minutes' is not defined. Are those names you gave a value to, or the names of columns, which are words?"
        why: "a column's name is a word, and a word we are looking for wears quotes."
    walk:
      - "Ask the row for its actual minutes."
      - "Ask it for its promised minutes."
      - "Take one away from the other, and hand that back."
    return:
      text: "Write `speed_of`, which takes a row and hands back the subtotal divided by the actual minutes."
      check: "print(round(speed_of({'subtotal': 81.1, 'actual_minutes': 35.2}), 2))"
      model: |-
        def speed_of(row):
            return row['subtotal'] / row['actual_minutes']
      output: "2.3"
      narration:
        - "About 2.3 for the sample: two cells, divided. The row is asked twice, once for each."
        - "Two cells and a division this time."
      note: "Return for the minutes_late step."
    note: "A second cell step, so that the learner uses cell twice before the table arrives, and so that the new thoughts do not come three steps in a row. The order of the subtraction is the one thing that can go wrong."

  # 5
  - kind: "give"
    lang: "python"
    new: ["table-is-list-of-rows"]
    text: |-
      A table is a lot of rows, and Python already has something that holds a lot of things in order. A list. So a table is a list of rows. Here are three rows from the orders table.

      ```python
      rows = [
          {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1},
          {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3},
          {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72},
      ]
      print(len(rows))
      print(rows[1]['subtotal'])
      ```

      Run it.
    shows:
      - |-
        rows = [
            {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1},
            {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3},
            {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72},
        ]
        print(len(rows))
        print(rows[1]['subtotal'])
    after_run: "3 rows, and then 31.3. The first pair of brackets picked the row, the second the cell. Square brackets always mean: get from inside. Read it from left to right. rows[1] is the second row, because positions start at zero, and then ['subtotal'] is a cell of that row."
    note: "Table is list of rows. Reuses position from PY-2 and get-by-name from PY-3. The 'positions start at zero' reminder is the one place the second pair of brackets could confuse."

  # 6
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "table-is-list-of-rows", "cell", "for-each", "new-list-in-loop", "add-to-end"]
    text: "Now a whole table at once. Write a function called `subtotals` that takes the rows and hands back a list of their subtotals, one for each row, in order."
    check: |-
      print(subtotals([
          {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1, 'delivery_fee': 8.99},
          {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3, 'delivery_fee': 4.99},
          {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72, 'delivery_fee': 4.99},
          {'order_id': 103434, 'status': 'delivered', 'subtotal': 84.23, 'delivery_fee': 6.99},
      ]))
    model: |-
      def subtotals(rows):
          result = []
          for row in rows:
              result.append(row['subtotal'])
          return result
    output: "[81.1, 31.3, 57.72, 84.23]"
    narration:
      - "A list of the subtotals, in the order of the rows. One new list, filled inside the loop with one cell from each row."
      - "Go through the rows, take the subtotal from each, add it to the list, hand the list back. That is a column, pulled out of a table."
      - ""
    wrong:
      - code: |-
          def subtotals(rows):
              return rows['subtotal']
        ask: "Python says list indices must be integers or slices. Which thing has the column names: the whole table, or each row in it?"
        why: "the column names belong to each row. So you go through the rows and ask each one."
      - code: |-
          def subtotals(rows):
              for row in rows:
                  result = []
                  result.append(row['subtotal'])
              return result
        ask: "Where does the empty list begin: before the loop, or on every turn of it?"
        why: "a list started inside the loop is thrown away and started again each time round."
      - code: |-
          def subtotals(rows):
              result = []
              for row in rows:
                  result.append(row['subtotal'])
                  return result
        ask: "Run it on three rows and count how many subtotals come back. When does the loop get to hand the list back?"
        why: "a return ends the function at once. It belongs after the loop, outside it."
    walk:
      - "A table is a list of rows. Write the loop that goes through them, one row at a time."
      - "Start an empty list before the loop, and inside it add the row's subtotal."
      - "When the loop is done, hand the list back."
    return:
      text: "Write `with_fees`, which takes the rows and hands back a list holding each row's subtotal and delivery fee added together."
      check: |-
        print([round(x, 2) for x in with_fees([
            {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1, 'delivery_fee': 8.99},
            {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3, 'delivery_fee': 4.99},
            {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72, 'delivery_fee': 4.99},
            {'order_id': 103434, 'status': 'delivered', 'subtotal': 84.23, 'delivery_fee': 6.99},
        ])])
      model: |-
        def with_fees(rows):
            result = []
            for row in rows:
                result.append(row['subtotal'] + row['delivery_fee'])
            return result
      output: "[90.09, 36.29, 62.71, 91.22]"
      narration:
        - "One new number for each row, in the order of the table: 90.09 for the first."
        - "Rows in, a list of sums out. The loop is the same, with two cells in it."
      note: "Return for step 5. Two cells added in the loop."
    note: "Keep-rows by hand with a new list (PY-2) and a cell (step 3). It pulls a column out of a table, which is SELECT subtotal. Three wrong answers: the table asked for a column, a list restarted on every turn, and a return inside the loop."

  # 7
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "table-is-list-of-rows", "cell", "for-each", "if-question", "equals-asks", "running-result"]
    text: "How many of the rows have a given status? Write a function called `count_status` that takes the rows and a status, and hands back how many of the rows have that status."
    check: |-
      print(count_status([
          {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1, 'delivery_fee': 8.99},
          {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3, 'delivery_fee': 4.99},
          {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72, 'delivery_fee': 4.99},
          {'order_id': 103434, 'status': 'delivered', 'subtotal': 84.23, 'delivery_fee': 6.99},
      ], 'delivered'))
      print(count_status([
          {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1, 'delivery_fee': 8.99},
          {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3, 'delivery_fee': 4.99},
          {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72, 'delivery_fee': 4.99},
          {'order_id': 103434, 'status': 'delivered', 'subtotal': 84.23, 'delivery_fee': 6.99},
      ], 'cancelled'))
    model: |-
      def count_status(rows, status):
          count = 0
          for row in rows:
              if row['status'] == status:
                  count = count + 1
          return count
    output: |-
      3
      1
    narration:
      - "A question asked of each row, and a count that grows on every yes. That is COUNT with a WHERE, written out by hand."
      - "Three delivered, one cancelled. The row's status was asked against the status you were given."
      - ""
    wrong:
      - code: |-
          def count_status(rows, status):
              count = 0
              for row in rows:
                  if row['status'] = status:
                      count = count + 1
              return count
        ask: "Python calls that a syntax error. One equals sign does what, and what does a question use?"
        why: "one equals sign gives a name. Two ask."
      - code: |-
          def count_status(rows, status):
              count = 0
              for row in rows:
                  if status == 'delivered':
                      count = count + 1
              return count
        ask: "Ask it for cancelled and see what comes back. Which part of the question changes from row to row?"
        why: "the question has to be about the row in your hands. The status you were given stays the same all through the loop."
      - code: |-
          def count_status(rows, status):
              count = 0
              for row in rows:
                  if row['status'] == status:
                      count = count + 1
                  return count
        ask: "That sends the count back after the first row. Where does the return belong?"
        why: "the return belongs after the loop, outside it, so that every row is counted first."
    walk:
      - "Start a count at zero, and go through the rows."
      - "For each row ask: is its status the one we were given? On a yes, add one."
      - "After the loop, hand the count back."
    return:
      text: "Write `count_over`, which takes the rows and a limit, and hands back how many rows have a subtotal above the limit."
      check: |-
        print(count_over([
            {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1, 'delivery_fee': 8.99},
            {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3, 'delivery_fee': 4.99},
            {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72, 'delivery_fee': 4.99},
            {'order_id': 103434, 'status': 'delivered', 'subtotal': 84.23, 'delivery_fee': 6.99},
        ], 50))
      model: |-
        def count_over(rows, limit):
            count = 0
            for row in rows:
                if row['subtotal'] > limit:
                    count = count + 1
            return count
      output: "3"
      narration:
        - "Three rows have a subtotal above 50. The question was a comparison this time, still asked of each row."
        - "A number question on a cell, and the same count."
      note: "Return for step 6. A comparison on a cell instead of an equality on text."
    note: "Counting with a question: if-question, equals-asks and running-result from PY-1, now over rows. The second wrong answer compares the wrong thing, which is the real slip here."

  # 8
  - kind: "give"
    lang: "python"
    new: ["missing-is-none"]
    text: |-
      Now a row with something missing. In the real table, 25 orders have an empty subtotal: nobody wrote the number down. In a row, an empty cell is None. It is the same None you met when a list had nothing in it: nothing, written down as a value.

      ```python
      row = {'order_id': 103877, 'status': 'delivered', 'subtotal': None}
      print(row['subtotal'])
      print(row['subtotal'] is None)
      ```

      Run it.
    shows:
      - |-
        row = {'order_id': 103877, 'status': 'delivered', 'subtotal': None}
        print(row['subtotal'])
        print(row['subtotal'] is None)
    after_run: "None, and then True. The cell is there, and it holds nothing. The question is the one you already know: is None, which is what SQL wrote as IS NULL. Careful, though. Nothing here will leave the empty cell out for you."
    note: "missing-is-none. The 25 is true of the data (23 delivered, 2 cancelled). The last two sentences set up the classmate, who is about to find out."

  # 9
  - kind: "classmate"
    lang: "python"
    new: ["skip-the-missing"]
    text: |-
      Ana wanted the total of some subtotals, and the last row had an empty one. She wrote:

      ```python
      rows = [
          {'subtotal': 81.1},
          {'subtotal': 57.72},
          {'subtotal': None},
      ]
      total = 0
      for row in rows:
          total = total + row['subtotal']
      print(total)
      ```

      Python stopped with: TypeError: unsupported operand type(s) for +: 'float' and 'NoneType'. Ana, what is in the third subtotal? ... Nothing. You cannot add nothing to a number. In SQL, SUM and AVG left the empty cells out without telling you. Here you say it yourself: ask of each row whether its subtotal is not None, and add only on a yes.

      ```python
      rows = [
          {'subtotal': 81.1},
          {'subtotal': 57.72},
          {'subtotal': None},
      ]
      total = 0
      for row in rows:
          if row['subtotal'] is not None:
              total = total + row['subtotal']
      print(total)
      ```

      Run it.
    shows:
      - |-
        rows = [
            {'subtotal': 81.1},
            {'subtotal': 57.72},
            {'subtotal': None},
        ]
        total = 0
        for row in rows:
            if row['subtotal'] is not None:
                total = total + row['subtotal']
        print(total)
    broken: |-
      rows = [
          {'subtotal': 81.1},
          {'subtotal': 57.72},
          {'subtotal': None},
      ]
      total = 0
      for row in rows:
          total = total + row['subtotal']
      print(total)
    after_run: "138.82. The row with nothing in it was asked, answered no, and stayed out. That is what AVG did for you in SQL, and now you can see how it did it: a question, asked of each row, before anything is added. Is not None is the question you had, turned round."
    note: "The classmate gets the real Python message first (rule E6). The thought is the question 'is not None' as the way to leave the empty cells out. The step is given and not typed, so that the next step is the first time the learner writes it."

  # 10
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "table-is-list-of-rows", "cell", "for-each", "if-question", "running-result", "missing-is-none", "skip-the-missing"]
    text: "Write a function called `total_of` that takes the rows and hands back the total of their subtotals. Some subtotals are empty."
    check: |-
      print(total_of([
          {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1},
          {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3},
          {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72},
          {'order_id': 103877, 'status': 'delivered', 'subtotal': None},
      ]))
    model: |-
      def total_of(rows):
          total = 0
          for row in rows:
              if row['subtotal'] is not None:
                  total = total + row['subtotal']
          return total
    output: "170.12"
    narration:
      - "The total of the subtotals that are there. The empty one was asked about and left out, as SUM would have done."
      - "Ask before you add: is there something in the cell? Then add. 170.12 in all."
      - ""
    wrong:
      - code: |-
          def total_of(rows):
              total = 0
              for row in rows:
                  total = total + row['subtotal']
              return total
        ask: "Python stops with a TypeError on the empty one. What did Ana's fix ask of each row before adding?"
        why: "addition has no answer for nothing. The question comes first."
      - code: |-
          def total_of(rows):
              total = 0
              for row in rows:
                  if row['subtotal'] is None:
                      total = total + row['subtotal']
              return total
        ask: "Read your question aloud: add only when the subtotal is... what? Which rows do you want to add?"
        why: "the question has to keep the rows with something in them. Is None keeps exactly the rows we want to leave out."
      - code: |-
          def total_of(rows):
              total = 0
              for row in rows:
                  if row['subtotal'] is not None:
                      total = total + row['subtotal']
                  return total
        ask: "Check it on four rows. How many get looked at before the function ends?"
        why: "return ends the function. After the loop, not inside it."
    walk:
      - "Start a total at zero and go through the rows."
      - "Ask of each row: is its subtotal not None? Add on a yes only."
      - "After the loop, hand the total back."
    return:
      text: "Write `count_filled`, which takes the rows and hands back how many of them have a subtotal."
      check: |-
        print(count_filled([
            {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1},
            {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3},
            {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72},
            {'order_id': 103877, 'status': 'delivered', 'subtotal': None},
        ]))
      model: |-
        def count_filled(rows):
            count = 0
            for row in rows:
                if row['subtotal'] is not None:
                    count = count + 1
            return count
      output: "3"
      narration:
        - "3 of the 4 rows have a subtotal. The same question, and a count in place of a total."
        - "How many are filled in: ask each row, count the yeses."
      note: "Return for step 9. A count in place of a total."
    note: "First time the learner writes is not None with nothing in front of them but the classmate step. The wrong answers are the TypeError, the question turned the wrong way, and the return inside the loop. Sum 81.1 + 31.3 + 57.72 = 170.12."

  # 11
  - kind: "aside"
    text: "Something that is only interesting. In pandas, which comes later, the same empty cell is written NaN, and pandas leaves it out of an average for you, as SQL did. Same idea, third spelling. When we get there it will be a thing you recognise, and not a new one."

  # 12
  - kind: "ask"
    lang: "python"
    requires: ["def", "what-goes-in", "what-comes-out", "table-is-list-of-rows", "cell", "for-each", "if-question", "new-list-in-loop", "add-to-end", "skip-the-missing", "sorted", "last"]
    text: "Write a function called `biggest_subtotal` that takes the rows and hands back the largest subtotal. Some are empty, and an empty one is not the largest."
    check: |-
      print(biggest_subtotal([
          {'order_id': 104843, 'status': 'delivered', 'subtotal': 81.1},
          {'order_id': 102388, 'status': 'cancelled', 'subtotal': 31.3},
          {'order_id': 101248, 'status': 'delivered', 'subtotal': 57.72},
          {'order_id': 103877, 'status': 'delivered', 'subtotal': None},
      ]))
    model: |-
      def biggest_subtotal(rows):
          values = []
          for row in rows:
              if row['subtotal'] is not None:
                  values.append(row['subtotal'])
          return sorted(values)[-1]
