lesson: ml-02
title: "The same shape, any model"
strand: ml
stage: 2
thoughts:
  engineer-then-fit: "A better column beats a better model. Add the promised time and the score moves."
  swap-the-model: "Change the first line and nothing else. Every model has the same three verbs."
  fit-on-train-only: "Anything learned from the data, even a median to fill with, is learned from the training rows only."
  pick-the-metric: "When one answer is rare, accuracy flatters. Say which metric you chose and why."
  read-and-criticise: "Reading someone else's pandas and finding what leaks."
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "merge", "fill-or-drop", "column", "list-of-columns", "show", "features-and-target", "hold-rows-back", "make-fit-predict", "score", "probabilities", "ml-imports"]
    supplies: ["from sklearn.model_selection import train_test_split", "from sklearn.linear_model import LogisticRegression", "from sklearn.metrics import roc_auc_score"]
    text: "Predict whether a delivery took more than 35 minutes. X holds the rain and the bag size, the rows with no distance are dropped, and 30 percent of the rows are held back. Fit a logistic regression and print its AUC on the held-back rows, rounded to three places. The lines you may look up are `from sklearn.model_selection import train_test_split`, `from sklearn.linear_model import LogisticRegression` and `from sklearn.metrics import roc_auc_score`. Use `random_state=0` for the split."
    model: |
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['rain', 'bag_size']]
      y = data['actual_minutes'] > 35
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=0)
      model = LogisticRegression()
      model.fit(X_train, y_train)
      print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
    output: "0.599"
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from ML-1: the whole pipeline, on a combination never practised (other target, other columns, other share). Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["engineer-then-fit"]
    text: |
      Last time the model scored 0.697, and I said it was not yet good. The easy thing to do now is to reach for a fancier model. The better thing is to look at the data and ask what the model cannot know. Think about a delivery 6 kilometres away. If the restaurant promised 50 minutes, that is fine. If it promised 30, it is going to be late. The model has the distance, but it does not have the promise. So give it the promise: add the promised time as a fourth column and change nothing else.

      ```python
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
      y = data['actual_minutes'] > data['promised_minutes']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)
      model = LogisticRegression()
      model.fit(X_train, y_train)
      print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
      ```

      Run it.
    shows:
      - |
        from sklearn.model_selection import train_test_split
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import roc_auc_score
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        deliveries = pd.read_csv('deliveries.csv')
        data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
        X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
        y = data['actual_minutes'] > data['promised_minutes']
        X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)
        model = LogisticRegression()
        model.fit(X_train, y_train)
        print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
    after_run: |
      0.792, up from 0.697, with the same model and the same rows. Only one column was added. A better column beats a better model, and the way to find the column is to ask what the model cannot know, and to look at the data for it. Nobody reached for anything fancy.
    note: "Engineer-then-fit. The learner knows the same line from last time, so only the new column changes, and the reason to add it is a real reason from the data (README: distance depends on the promise). The numbers are for the rows with a distance, as in ML-1: 0.697 becomes 0.792. The map quotes 0.805, which is the same model on all 5,601 rows with the missing distances filled from the training rows (it appears later in this lesson)."

