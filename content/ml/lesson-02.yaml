    note: "swap-the-model. Everything after the model line is word for word the previous step. GradientBoostingClassifier is the owner's choice (decision of 24 Nov). The surprise is that it scores below the plain model. 'Builds many small trees' is the one-line description, and the learner is not asked for more."

