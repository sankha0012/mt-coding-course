  # 5
  - kind: "give"
    lang: "python"
    new: ["swap-the-model"]
    text: |
      Now the fancier model, since you asked for it. Remember make, fit, predict? Every model in scikit-learn answers to the same three verbs. So to swap one model for another, you change the line that makes the model, and nothing else. This one is gradient boosting, a model that builds many small decision trees, each correcting the one before. Its line to bring it in is another one to look up: `from sklearn.ensemble import GradientBoostingClassifier`. `random_state=0` fixes the model's own shuffling, as it fixed the split's.

      ```python
      from sklearn.model_selection import train_test_split
      from sklearn.ensemble import GradientBoostingClassifier
      from sklearn.metrics import roc_auc_score
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
      y = data['actual_minutes'] > data['promised_minutes']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)
      model = GradientBoostingClassifier(random_state=0)
      model.fit(X_train, y_train)
      print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
      ```

      Run it.
