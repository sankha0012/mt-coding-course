  # 7
  - kind: "give"
    lang: "python"
    new: ["row-by-row-not"]
    text: |
      Next, the rows to train on: every row that is not in the fold we hold back. The question `fold == 0` has an answer for each row, a column of yes and no. To turn it round, so that yes becomes no and no becomes yes, you put a `~` in front of it. It belongs with the two signs you met in the pandas lessons: `&` for and, `|` for or, and `~` for not. All three work on every row, and Python's own words `and`, `or` and `not` would ask once, about the whole column, which is why pandas does not use them.

      ```python
      import numpy as np
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
      y = data['actual_minutes'] > data['promised_minutes']
      fold = np.arange(len(X)) % 5
      test = fold == 0
      print(len(X[test]))
      print(len(X[~test]))
      ```

      Run it.
    shows:
      - |
        import numpy as np
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        deliveries = pd.read_csv('deliveries.csv')
        data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
        X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
        y = data['actual_minutes'] > data['promised_minutes']
        fold = np.arange(len(X)) % 5
        test = fold == 0
        print(len(X[test]))
        print(len(X[~test]))
    after_run: |
      1,098 rows in the fold, and 4,391 rows outside it. Added up, they are the whole table. Notice that 4,391 is the number of training rows you got from `train_test_split` with a fifth held back: it is the same split, made by hand. The `~` is the third sign of the three, and it has the same reason as the other two.
    note: "row-by-row-not. It belongs with `&` and `|` (PD-2 `row-by-row-and`), so the learner owns the reason: Python's own words ask once. No new rule, just the third sign. The 4,391 echo links the fold to the split of ML-1."

