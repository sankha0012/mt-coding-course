    supplies: ["import numpy as np", "from sklearn.linear_model import LogisticRegression", "from sklearn.metrics import roc_auc_score"]
    text: "Wrap the loop in a function. `fold_scores` takes a model, the table X, the answers y and the number of folds k, and hands back the list of the k scores, one for each fold. Then, with `import numpy as np`, `from sklearn.linear_model import LogisticRegression` and `from sklearn.metrics import roc_auc_score`: drop the rows with no distance, put all four columns in X, let y be whether a delivery was late, call `fold_scores` with a logistic regression and five folds, and print the lowest score and then the highest, rounded to three places."
    model: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
      y = data['actual_minutes'] > data['promised_minutes']
      def fold_scores(model, X, y, k):
          fold = np.arange(len(X)) % k
          scores = []
          for i in range(k):
              test = fold == i
              model.fit(X[~test], y[~test])
              scores.append(roc_auc_score(y[test], model.predict_proba(X[test])[:, 1]))
          return scores
      scores = fold_scores(LogisticRegression(), X, y, 5)
      print(round(sorted(scores)[0], 3))
      print(round(sorted(scores)[-1], 3))
