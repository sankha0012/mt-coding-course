    text: |
      First, each row needs a number. Not its label: a plain count, one for each row, from 0. A row of numbers like that is numpy's job. The line that brings numpy in is another one that everybody looks up, and it always reads `import numpy as np`. Then `np.arange(len(X))` is a row of numbers from 0 up to one less than the number of rows in X:

      ```python
      import numpy as np
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
      rows = np.arange(len(X))
      print(rows[:5])
      print(rows[-1])
      ```

      Run it.
