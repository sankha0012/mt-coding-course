    text: "\nSomething that is only interesting, with nothing in it to keep. `roc_auc_score` is a word from the library, but AUC is only a count, and you could write it yourself. Take every pair made of one late delivery and one on-time delivery, and ask in what share of the pairs the late one was given the higher chance. That share is the AUC. Another metric you will hear of, KS, is the biggest gap between two running totals: the share of late deliveries and the share of on-time ones that sit below each cut-off on the chance. Both can be written in a few lines, and you already know what they are, which is the hard part. In some interviews you are asked to write one. Not today.\n"
    note: "metric-by-hand, name only (pass-bar task 17): it appears in one aside and in no prompt and no `requires`. Both descriptions are the textbook ones: AUC as the share of (late, on-time) pairs ranked the right way, KS as the largest gap between the two cumulative distributions."

