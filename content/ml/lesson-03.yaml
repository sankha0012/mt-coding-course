  fold-number-per-row: "`np.arange(len(X)) % k` gives every row a fold number from 0 to k minus 1."
  row-by-row-not: "`~` turns a yes-or-no column round. It belongs with `&` and `|`."
  this-fold-and-the-rest: "The test rows are this fold. The training rows are all the others."
  average-the-scores: "One score per fold, kept in a list, averaged at the end. A running result."
  metric-by-hand: {text: "AUC and KS can be written by hand. You know what they are.", grade: name-only}
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "merge", "fill-or-drop", "column", "list-of-columns", "yes-no-column", "brackets-keep-yes", "summary-follows", "features-and-target", "hold-rows-back", "make-fit-predict", "score", "probabilities", "ml-imports", "engineer-then-fit", "swap-the-model", "fit-on-train-only", "pick-the-metric", "read-and-criticise"]
    supplies: ["from sklearn.model_selection import train_test_split", "from sklearn.ensemble import GradientBoostingClassifier", "from sklearn.metrics import roc_auc_score"]
    text: "Keep every delivery. Guess whether a delivery was more than 12 minutes late. X holds the distance, the bag size and the promised minutes, and a quarter of the rows are held back. Fill the empty distances with the median of the training rows only, fit gradient boosting, and print its AUC on the held-back rows, rounded to three places. The lines you may look up are `from sklearn.model_selection import train_test_split`, `from sklearn.ensemble import GradientBoostingClassifier` and `from sklearn.metrics import roc_auc_score`."
    model: |
      from sklearn.model_selection import train_test_split
      from sklearn.ensemble import GradientBoostingClassifier
      from sklearn.metrics import roc_auc_score
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id')
      X = data[['distance_km', 'bag_size', 'promised_minutes']]
      y = data['actual_minutes'] - data['promised_minutes'] > 12
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0)
      fill = X_train['distance_km'].median()
      X_train['distance_km'] = X_train['distance_km'].fillna(fill)
      X_test['distance_km'] = X_test['distance_km'].fillna(fill)
      model = GradientBoostingClassifier(random_state=0)
      model.fit(X_train, y_train)
      print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
    output: "0.849"
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from ML-2: the honest fill, the swapped model and the metric, on a combination never practised. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    text: |
      You have a score. Now a question about the score. Run the same model on the same rows five times, and change nothing but which rows are held back. The seed is the number after `random_state`, and a loop can change it:

      ```python
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
      y = data['actual_minutes'] > data['promised_minutes']
      for seed in range(5):
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=seed)
          model = LogisticRegression()
          model.fit(X_train, y_train)
          print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
      ```

      Run it.
    shows:
      - |
        from sklearn.model_selection import train_test_split
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import roc_auc_score
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        deliveries = pd.read_csv('deliveries.csv')
        data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
        X = data[['distance_km', 'rain', 'bag_size', 'promised_minutes']]
        y = data['actual_minutes'] > data['promised_minutes']
        for seed in range(5):
            X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=seed)
            model = LogisticRegression()
            model.fit(X_train, y_train)
            print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
    after_run: |
      0.792, 0.790, 0.793, 0.814 and 0.802: one model, one table, and a spread of more than 0.02, only because a different fifth was held back. Which of them is the model's score? None of them. Each is one opinion. A better question to ask is: if every row had its turn at being held back, what would the scores say together? Cut the rows into equal groups, called folds. Hold one fold back, train on the rest, score it. Then the next fold, and the next. The mean is the score, and the spread tells you how far to trust it. People call this cross-validation. The library has a word for it, and today you will write it yourself, because writing it is how you know what it does, and because it is asked in interviews.
    note: "The motive first (rule B3 and C10 together): one split is one opinion, shown with the learner's own pipeline and the loop and range they know. There is no new thought here. Seeds 0 to 4 give 0.792, 0.790, 0.793, 0.814 and 0.802."

