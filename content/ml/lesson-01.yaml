  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "merge", "new-column", "yes-no-as-column", "groupby", "pick-then-summarise", "mean-of-yes-no", "show"]
    text: "Join the orders to their deliveries and call a delivery late when its actual minutes are more than its promised minutes. For each bag size, print the share of late deliveries."
    model: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      joined = orders.merge(deliveries, on='order_id')
      joined['late'] = joined['actual_minutes'] > joined['promised_minutes']
      print(joined.groupby('bag_size')['late'].mean())
    output: |-
      bag_size
      1    0.352276
      2    0.519123
      3    0.758741
      Name: late, dtype: float64
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from PD-4: merge, a yes-or-no column, piles by a column of the second table, and the mean of the yes-or-no column. PD-4 practised rain, so bag size is a combination never practised. It also puts lateness and its three suspects in front of the learner before the lesson uses them. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["features-and-target"]
    text: |
      Today a machine learns from your table. It is not magic. It is shown rows where the answer is known, it finds what tends to go with what, and then it guesses for rows it has never seen. To set that up you split the table in two. `X` is the table of columns the machine learns from. `y` is the single column it has to guess. Everybody writes a capital X and a small y, as in school maths, and that just is.

      Here is the question: was a delivery late? And three columns that might explain it:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size']]
      y = data['actual_minutes'] > data['promised_minutes']
      print(X.head(3))
      print(round(y.mean(), 3))
      ```

      Run it.
    shows:
      - |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        deliveries = pd.read_csv('deliveries.csv')
        data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
        X = data[['distance_km', 'rain', 'bag_size']]
        y = data['actual_minutes'] > data['promised_minutes']
        print(X.head(3))
        print(round(y.mean(), 3))
    after_run: |
      Three columns to learn from, and one yes-or-no column to guess. 5,489 deliveries are left, because 112 had no distance and, for now, we drop them, as you did in the cleaning lesson. And 42.6 percent of the deliveries were late: the mean of a yes-or-no column is the share of yes. Everything today starts from these two names.
    note: "The learner owns every line except the two names. The merge and the drop come from PD-4 and PD-3, and the yes-or-no column from PD-3. Capital X and small y are given as a convention (a real one, from matrices and vectors), with 'that just is'. The 112 missing distances are dropped, as ML-2 will later revisit."

