  # 8
  - kind: "give"
    lang: "python"
    new: ["make-fit-predict"]
    text: |
      Now the machine itself. In scikit-learn every model is used in the same three lines, and you already know the habit behind them: give a thing a name, then do something with it. First make the model and name it. Then fit it, which means: show it the training rows, the columns to learn from first and the answers second. Then predict: hand it the columns of the rows it has never seen, and it guesses their answers. This model is called logistic regression, and its line to bring it in is another one you would look up: `from sklearn.linear_model import LogisticRegression`.

      ```python
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
