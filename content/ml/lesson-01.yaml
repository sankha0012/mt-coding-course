lesson: ml-01
title: "Fit, predict, evaluate"
strand: ml
stage: 2
thoughts:
  features-and-target: "`X` is a table of the columns to learn from. `y` is the one column to predict."
  hold-rows-back: "`train_test_split` holds some rows back, so the score is honest."
  make-fit-predict: "Make a model, fit it on the training rows, predict the held-back rows. Three lines, always the same."
  score: "A metric compares the predictions with the truth."
  probabilities: "`predict_proba(...)[:, 1]` gives a probability for each row, which is what AUC needs."
  ml-imports: {text: "The import lines. Everyone looks these up.", grade: shape}
