    supplies: ["from sklearn.metrics import roc_auc_score"]
    text: "\nDavi wanted a better metric than accuracy. He had heard of AUC, which asks how well a model puts the late deliveries above the on-time ones. He fitted his model as you did, and wrote:\n\n```python\npredictions = model.predict(X_test)\nprint(round(roc_auc_score(y_test, predictions), 3))\n```\n\nIt ran, and it printed 0.636. Davi, what do the predictions look like? ... Only False and True, nothing in between. To put rows in order from the least to the most likely late, the model has to say how likely, not only yes or no. That is a probability, and `predict_proba` gives one. It hands back a table with a column for each answer, and we take the column for late, which is the second, number 1 when you count from 0. The colon on its own means every row. The metric's line, to look up, is `from sklearn.metrics import roc_auc_score`:\n\n```python\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import roc_auc_score\nimport pandas as pd\norders = pd.read_csv('orders.csv')\ndeliveries = pd.read_csv('deliveries.csv')\ndata = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])\nX = data[['distance_km', 'rain', 'bag_size']]\ny = data['actual_minutes'] > data['promised_minutes']\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)\nmodel = LogisticRegression()\nmodel.fit(X_train, y_train)\nprobabilities = model.predict_proba(X_test)\nprint(probabilities[:3])\nlate_chance = probabilities[:, 1]\nprint(round(roc_auc_score(y_test, late_chance), 3))\n```\n\nRun it.\n"
    shows:
      - |
        from sklearn.model_selection import train_test_split
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import roc_auc_score
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        deliveries = pd.read_csv('deliveries.csv')
        data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
        X = data[['distance_km', 'rain', 'bag_size']]
        y = data['actual_minutes'] > data['promised_minutes']
        X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)
        model = LogisticRegression()
        model.fit(X_train, y_train)
        probabilities = model.predict_proba(X_test)
        print(probabilities[:3])
