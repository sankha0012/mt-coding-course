    new: ["hold-rows-back"]
    imports: ["ml-imports"]
    text: |
      Now the honest part. If you grade a student on the questions they practised, the grade tells you nothing. A model is the same. So before it learns anything, we hold some rows back, and keep them hidden until the end. One function does it. Bringing it into the script takes a line that everyone looks up, so I will give it to you whole every time you need it: `from sklearn.model_selection import train_test_split`. It goes at the top, above the pandas line.

      ```python
      from sklearn.model_selection import train_test_split
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      data = orders.merge(deliveries, on='order_id').dropna(subset=['distance_km'])
      X = data[['distance_km', 'rain', 'bag_size']]
      y = data['actual_minutes'] > data['promised_minutes']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)
      print(len(X_train), len(X_test))
      ```

      Run it.
