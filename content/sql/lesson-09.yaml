  # 18
  - kind: "give"
    new: ["running-total"]
    text: |-
      One more, and again one you would look up: adding up as you go, so that each row shows the total so far. The thought is: a running total. Here it is spelled `SUM(total) OVER (ORDER BY month)`. It is SUM with the OVER you know, and the order inside it says what comes before what.

      ```sql
      WITH monthly AS (SELECT strftime('%Y-%m', created_at) AS month, SUM(subtotal) AS total FROM orders GROUP BY month)
      SELECT month, total, SUM(total) OVER (ORDER BY month) FROM monthly
      ```

      Run it.
    shows:
      - "WITH monthly AS (SELECT strftime('%Y-%m', created_at) AS month, SUM(subtotal) AS total FROM orders GROUP BY month) SELECT month, total, SUM(total) OVER (ORDER BY month) FROM monthly"
    after_run: "August's running total is its own 124,179.67. September's is August's plus its own, 241,609.34. October's is 360,885.35, which is the total of all the subtotals from lesson 2. Each row adds up the rows before it and itself, and the order inside the brackets says what before means."
    note: "Running total, a shape thought (decision C10): the teacher supplies the spelling and says plainly that it is a lookup. The learner already owns every part: SUM, OVER and ORDER BY inside it. The last row equals the total of lesson 2 step 6, which is a small check that it is right."

