  # 21
  - kind: "ask"
    requires: ["date-to-month", "pile-by-computed", "previous-row", "column-arithmetic", "more-summaries", "summary-column", "name-a-table", "name-a-result", "piles", "one-row-per-pile", "pile-name", "from-table", "choose-columns", "commas"]
    supplies: ["strftime('%Y-%m', created_at)"]
    friction: true
    text: "The last one, and I won't break it down. For each month, show the month and the total of its subtotals, with the change from the month before. The month is `strftime('%Y-%m', created_at)`."
    model: "WITH monthly AS (SELECT strftime('%Y-%m', created_at) AS month, SUM(subtotal) AS total FROM orders GROUP BY month) SELECT month, total, total - LAG(total) OVER (ORDER BY month) AS change FROM monthly"
    rows: 3
    result: [["2026-08", 124179.67, null], ["2026-09", 117429.67, -6750.0], ["2026-10", 119276.01, 1846.34]]
    narration:
      - "August has nothing to compare with, so its change is empty. September fell by 6,750.00 and October rose by 1,846.34. That is a real interview question, and you built it from the parts."
      - "Pile by month, add up each pile, write the previous month's total beside each, and take one from the other. You put it together without a walk."
      - "Three months, with the change from the month before."
    wrong:
      - sql: "WITH monthly AS (SELECT strftime('%Y-%m', created_at) AS month, SUM(subtotal) AS total FROM orders GROUP BY month) SELECT month, total, LAG(total) OVER (ORDER BY month) FROM monthly"
        ask: "That has the previous month's total beside each, but not the change. What do you do with the two numbers?"
      - sql: "WITH monthly AS (SELECT strftime('%Y-%m', created_at) AS month, SUM(subtotal) AS total FROM orders GROUP BY month) SELECT month, total, LAG(total) OVER (ORDER BY month) - total AS change FROM monthly"
        ask: "September shows 6,750 where it fell. Which number should be taken away from which?"
      - sql: "WITH monthly AS (SELECT strftime('%Y-%m', created_at) AS month, SUM(subtotal) AS total FROM orders GROUP BY month) SELECT month, total, total - LEAD(total) OVER (ORDER BY month) AS change FROM monthly"
        ask: "That compares each month with the month after. Which row should it be compared with?"
      - sql: "SELECT strftime('%Y-%m', created_at) AS month, SUM(subtotal) AS total FROM orders GROUP BY month"
        ask: "That is the totals alone. How do you compare a row with the one before it?"
    walk:
      - "Write the table of months with the total of the subtotals in each, and name it."
      - "From it, show the month and the total, and beside them the previous month's total."
      - "Now, in place of that, the total minus the previous month's total."
    return:
      text: "For each month, show the month and the number of orders, with the change from the month before. The month is `strftime('%Y-%m', created_at)`."
      model: "WITH monthly AS (SELECT strftime('%Y-%m', created_at) AS month, COUNT(*) AS n FROM orders GROUP BY month) SELECT month, n, n - LAG(n) OVER (ORDER BY month) AS change FROM monthly"
      rows: 3
      result: [["2026-08", 2068, null], ["2026-09", 1946, -122], ["2026-10", 1986, 40]]
      narration:
        - "August's change is empty. September had 122 fewer orders than August, and October had 40 more than September."
        - "Pile by month, count each pile, write the previous month's count beside it, take one from the other."
      note: "Return for step 21. A count in place of a total, and the same previous-row and subtraction."
    note: "The closing sentence of the map and pass-bar task 6: three months, with an empty change for August, minus 6,750.00 for September and plus 1,846.34 for October (checked). Friction: the learner puts together the month, the pile, the name, LAG and the subtraction with no walk in the text. The results compare to two places."

