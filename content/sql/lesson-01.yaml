    note: "Every thought of the lesson that an answer can show, on a combination of table, question and pile that was never practised. It is never scored (rule F1). What a miss tells the script: which of keeping, quotes, piles, the pile's name, or the order of keeping and piling was absent. Lesson 2 opens by rebuilding from that point."
