    text: "Only interesting, and you will not be asked it. Every sentence so far counted by something that never ties inside a pile: an id, or the time of one customer's orders. If two rows did tie, ROW_NUMBER would still give them different numbers, and which one gets the lower one is up to the database. There is a second function, RANK, that gives tied rows the same number. People ask about the difference in interviews, so now you have heard the name."
