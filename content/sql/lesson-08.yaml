  # 21
  - kind: "recap"
    text: |-
      Stop there. Today you learned to keep the rows that have no partner. LEFT JOIN keeps every row of the first table. Where a row found no match, the other side is left empty. You ask for the empties with IS NULL, and so you find what has no match. And you count real matches by counting a column from the other side, since the kept row with no partner would otherwise count as one.

      You are still not fast, and you are not meant to be. For now the aim is the same: think a sentence out.

      Don't go over any of this before next time. One more question, cold, and then we stop.
    note: "States the limit again (rule F2) and tells the learner not to revise (rule A3)."

