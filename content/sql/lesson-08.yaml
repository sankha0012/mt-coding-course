    text: "Only interesting, and nothing to keep. What you have been doing has a name: an anti-join, the rows of one table that have no partner in another. Besides LEFT JOIN with IS NULL, people write it with NOT EXISTS or with NOT IN. All of them give the same rows. The one you have is the one that reads like what you did: keep every row, and then keep the ones with nothing on the other side."
    note: "Real name for the closing thought, flagged as an aside (rule D4). It prepares the learner for the other spellings in an interview. Not a thought id, never asked. Relief after the longest typed sentence of the lesson."

