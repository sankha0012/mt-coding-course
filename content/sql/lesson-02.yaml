      - sql: "SELECT restaurant_id, COUNT(*) FROM orders WHERE status = 'delivered' GROUP BY restaurant_id ORDER BY COUNT(*) LIMIT 5"
        ask: "Those are the five with the fewest. Which end do we want?"
      - sql: "SELECT restaurant_id, COUNT(*) FROM orders GROUP BY restaurant_id ORDER BY COUNT(*) DESC LIMIT 5"
        ask: "Those counts include the cancelled orders. Where do we drop them?"
