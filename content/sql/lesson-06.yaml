  # 18
  - kind: "aside"
    text: "Only interesting, and nothing to keep. Having to name a table first, just to keep by a window number, annoys people so much that a few databases added a word for it. In Snowflake, BigQuery and DuckDB you can write QUALIFY, and it keeps by a window number directly, as WHERE keeps by a column. Most other databases do not have it. So the way you have just learned, name the table and ask it again, is the one that works everywhere."
    note: "Real, and a fair warning about what the learner might see elsewhere. Name only in the sense of grade: it is not in the thought list, it is never asked, and no step requires it. It is honest about the cost of beside-comes-late. Relief after four typed steps."

