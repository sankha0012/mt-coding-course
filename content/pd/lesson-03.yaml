  # 11
  - kind: "give"
    lang: "python"
    new: ["yes-no-as-column"]
    text: |-
      A question can be kept, too. You have only ever asked one to hand to the brackets, but a column of yes and no is a column like any other, so it can be given a name and added to the table. Here the question compares two columns row by row: was the real time longer than the promised time?

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      orders['late'] = orders['actual_minutes'] > orders['promised_minutes']
      print(orders[['order_id', 'late']].head())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
