  # 17
  - kind: "aside"
    lang: "python"
    text: "Something that is only interesting, with nothing in it to keep. The empty cell is shown as NaN, which stands for not a number. It comes from the standard that nearly every computer's arithmetic has followed since the 1980s, and it has one famous property: NaN is not equal to anything, not even to itself. That is why you cannot find it by asking whether a cell equals NaN, and why there is a separate question, isna. It is the same idea as IS NULL in SQL, where nothing equals an empty cell either."
    note: "Relief, and a real reason for isna. It restates SQL-3's empty-cells thought from the other side, and answers 'why not ==' before the learner asks."

