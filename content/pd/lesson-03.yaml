  # 13
  - kind: "give"
    lang: "python"
    new: ["mean-of-yes-no"]
    text: |-
      A column of True and False can be averaged. True counts as 1 and False as 0, and the average of a column of ones and zeros is the share of ones. So here is the share of the delivered orders that were late:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      orders['late'] = orders['actual_minutes'] > orders['promised_minutes']
      delivered = orders[orders['status'] == 'delivered']
      print(delivered['late'].mean())
      ```

