        print(orders[['order_id', 'late']].head())
    after_run: "True on the fifth order, False on the first four: only that one took longer than promised. The question that fed the brackets before is now a column of its own, and a column can be kept, shown, counted or averaged."
    note: "The question and the new column meet. Both are owned, and this step only joins them. The column late is the one PD-4's closing sentence builds on, and the one the closing sentence of this lesson adds."

