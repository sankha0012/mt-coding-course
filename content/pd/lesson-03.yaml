  # 9
  - kind: "give"
    lang: "python"
    new: ["column-sums"]
    text: |-
      A new column can be worked out from the columns you already have. Put the sum on the right of the equals sign. Columns add and subtract row by row: the first row's subtotal plus the first row's fee, then the second row's own pair, and so on down:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      orders['total'] = orders['subtotal'] + orders['delivery_fee']
      print(orders[['subtotal', 'delivery_fee', 'total']].head(3))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        orders['total'] = orders['subtotal'] + orders['delivery_fee']
        print(orders[['subtotal', 'delivery_fee', 'total']].head(3))
    after_run: "81.10 and 8.99 make 90.09, and the next row's own two numbers make 25.84. Each row added by itself, and no loop was written: it is the loop from the start of the course, done for you, one row at a time. A row with an empty subtotal gets an empty total, because nothing is known to add."
    note: "Arithmetic between columns is a separate thought from the new column, and arrives one step after it so that new-column was only the equals sign. The empty-total remark plants find-missing for step 15."

