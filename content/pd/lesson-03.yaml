  # 7
  - kind: "give"
    lang: "python"
    new: ["new-column"]
    text: |-
      Now the other direction: giving a table a new column. Write the new column's name in the brackets, as if you were asking for it, put it to the left of an equals sign, and put the value to the right. You did this with a dict, when prices['acai'] = 25 added a name that was not there:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      orders['country'] = 'Brazil'
      print(orders[['order_id', 'country']].head(3))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        orders['country'] = 'Brazil'
        print(orders[['order_id', 'country']].head(3))
    after_run: "A new column, with the same word on every row. The name went in the brackets, the value after the equals sign, as it did for the dict. The table in your program now has twelve columns. The file on your computer has not changed and cannot: the program works on its own copy, which goes when the script ends."
    note: "Imports set-by-name from PY-3 and name-a-value, said aloud. The constant is the simplest possible value, so that the next step can add arithmetic as its own thought. The point that the file is untouched is real and answers a worry the learner may have."

