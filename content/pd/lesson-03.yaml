lesson: pd-03
title: "Clean and add columns"
strand: pd
stage: 1
thoughts:
  first-look: "`orders.info()` lists the columns, their kinds, and how many cells of each are filled."
  list-of-columns: "A list of names gets several columns. One name gives a column, a list of names gives a table, which is where the two pairs of brackets come from."
  new-column: "`orders['total'] = ...` adds a column, the way a dict takes a new name."
  column-sums: "Columns add and subtract, row by row."
  yes-no-as-column: "A question can be kept as a column of its own."
  mean-of-yes-no: "The mean of a yes-or-no column is the share of yes."
  find-missing: "`.isna().sum()` counts the empty cells of a column."
  fill-or-drop: "`.fillna(value)` fills them, `.dropna(subset=[...])` drops their rows. Say which you chose and why."
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "column", "summary-follows", "yes-no-column", "brackets-keep-yes", "text-quotes", "groupby", "size", "sort-values", "pile-names-on-left", "keep-before-piles"]
    text: "Counting only the cancelled orders, show each promised_minutes value with how many orders have it, the biggest count first. Start from nothing."
    model: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders[orders['status'] == 'cancelled'].groupby('promised_minutes').size().sort_values(ascending=False))
    output: |-
      promised_minutes
      50    142
      40    140
      30    117
      dtype: int64
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from PD-2: keep, piles, a count, a sort, on a combination never practised (PD-2 step 8 kept the cancelled orders and piled them, without the sort). Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["first-look"]
    text: |-
      A table you have never seen is a stranger, and the first thing to do with a stranger is ask who it is: which columns it has, what kind of values they hold, and how many of each are filled in. One action asks all three. It prints its own report and gives nothing back, so there is nothing to put print around:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      orders.info()
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        orders.info()
    after_run: "Eleven columns. Beside each is the kind of value it holds, int64 and float64 for numbers and str for text, and how many cells are filled. Read down the Non-Null column. Most say 6,000. Subtotal says 5,975, so 25 are empty. Actual_minutes and courier_id say 5,601, because cancelled orders have neither, and coupon_code says 1,884, because most orders used no coupon. Together with value_counts, this is what people do first with a table they have never seen. We come back to the empty cells soon."
    note: "Opens on the strange table (the cold sittings use tables the learner has never seen: the map's note on first-look). info is the one place where nothing is wrapped in print, and the reason is given plainly: it prints, and gives nothing back. The empty cells are only noticed here. Find-missing and fill-or-drop arrive in steps 15 to 20."

  # 3
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "first-look", "text-quotes"]
    text: "The restaurants file is another table. Show its summary, the way `orders.info()` did for orders: its columns, their kinds, and how many cells are filled."
    model: |
      import pandas as pd
      restaurants = pd.read_csv('restaurants.csv')
      restaurants.info()
    output: "<class 'pandas.DataFrame'>\nRangeIndex: 60 entries, 0 to 59\nData columns (total 5 columns):\n #   Column         Non-Null Count  Dtype\n---  ------         --------------  -----\n 0   restaurant_id  60 non-null     int64\n 1   name           60 non-null     str  \n 2   city           60 non-null     str  \n 3   cuisine        60 non-null     str  \n 4   signup_date    60 non-null     str  \ndtypes: int64(1), str(4)\nmemory usage: 2.5 KB"
    narration:
      - "Five columns, 60 rows, and every column filled in: sixty non-null all the way down. Nothing is missing here."
      - "A report on the table, written by the table itself. No print was needed, because info prints."
      - ""
    wrong:
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants.info())
        ask: "The report ends with a word that is not part of it. What did info give back for print to show?"
        why: "info prints its report and gives nothing back, and print of nothing shows the word None."
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants.head())
        ask: "Those are the first rows. Which action says who the table is, column by column, and how full it is?"
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          restaurants.head()
        ask: "Nothing came out at all. Head gives a table back, and nothing shows it. And is that what I asked for?"
    walk:
      - "Bring pandas in and read restaurants.csv."
      - "Ask the table who it is: the action that reports its columns, their kinds and how full each is."
    return:
      text: "Now the couriers file. Show its summary in the same way."
      model: |
        import pandas as pd
        couriers = pd.read_csv('couriers.csv')
        couriers.info()
      output: "<class 'pandas.DataFrame'>\nRangeIndex: 200 entries, 0 to 199\nData columns (total 3 columns):\n #   Column      Non-Null Count  Dtype\n---  ------      --------------  -----\n 0   courier_id  200 non-null    int64\n 1   vehicle     200 non-null    str  \n 2   city        200 non-null    str  \ndtypes: int64(1), str(2)\nmemory usage: 4.8 KB"
      narration:
        - "Three columns and 200 rows, all of them filled in. The same one action, on another table."
        - "A report written by the table itself. Nothing was empty."
      note: "Return for step 3."
    note: "Only the table changes from step 2, on purpose, as in the first typed step of a new action (rule: early steps may change one slot). The restaurants table has no empty cells. That is said, so the learner knows a full table looks like this."

  # 4
  - kind: "give"
    lang: "python"
    new: ["list-of-columns"]
    text: |-
      So far one name in the brackets gave one column. Put a list of names there, and you get several columns at once. You made lists in the first lesson of Python: square brackets and commas. So the table's brackets hold a list, and the list has brackets of its own:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders[['order_id', 'subtotal']].head())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders[['order_id', 'subtotal']].head())
    after_run: "Two columns, with the first rows of each. One name gave a column. A list of names gives a table. That is where the two pairs of brackets come from: the outer pair is the table's, which gets something from inside, and the inner pair belongs to the list. In SQL this was two names after SELECT, with a comma between."
    note: "Held back until step 4, so that PD-1 to PD-3 step 3 have one column at a time (the map's plan for this pair). The doubled brackets are given a real reason at once, and are never offered as a rule. The learner has seen head and a column, so the output is not new."

  # 5
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "column", "summary-follows", "list-of-columns", "look-at-rows", "list", "get-by-name"]
    text: "Show me the name and the cuisine of the first three restaurants."
    model: |
      import pandas as pd
      restaurants = pd.read_csv('restaurants.csv')
      print(restaurants[['name', 'cuisine']].head(3))
    output: |-
      name     cuisine
      0  Rest 01  brasileira
      1  Rest 02    saudavel
      2  Rest 03  hamburguer
    narration:
      - "Three restaurants, each with its name and its cuisine. A list of two names in the table's brackets gave a table of two columns."
      - "Two names, so a list. The table came out narrower, and head cut it to three rows."
      - ""
    wrong:
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants['name', 'cuisine'].head(3))
        ask: "You gave the brackets two names, but they take one thing. What puts several names into one thing?"
        why: "several names go in a list, and a list wears square brackets of its own."
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants['name'].head(3))
        ask: "That is one column. How do we ask for two?"
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants[['name', 'cuisine']])
        ask: "That is the whole table, as much as fits. Which action asks for only the first few rows?"
    walk:
      - "Read restaurants.csv."
      - "Ask for two columns: a list of two names, in quotes, inside the table's brackets."
      - "Ask for the first three rows of what came out."
    return:
      text: "From the couriers, show me the id and the vehicle of the first two."
      model: |
        import pandas as pd
        couriers = pd.read_csv('couriers.csv')
        print(couriers[['courier_id', 'vehicle']].head(2))
      output: |-
        courier_id vehicle
        0           1    bike
        1           2    bike
      narration:
        - "Two couriers, each with an id and a vehicle. A list of names, in the table's brackets."
        - "Two columns, two rows: a narrower, shorter table."
      note: "Return for step 5."
    note: "Lists were in PY-1 and the table's brackets in PD-1. Together they give the two pairs. The wrong answer with two names and no list is the slip the thought exists for. Name only what the learner has seen: name and cuisine appeared in step 4 of PD-1's restaurants head."

