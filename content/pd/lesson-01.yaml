      output: "0       False\n1        True\n2       False\n3        True\n4       False\n        ...  \n5995    False\n5996     True\n5997    False\n5998    False\n5999    False\nName: promised_minutes, Length: 6000, dtype: bool"
      narration:
        - "A True or False for each of the 6,000 orders: promised in under 40, or not."
        - "The same question with another column and another sign."
      note: "Return for step 15."
    note: "The question on its own, kept for a step so the next step can hand it to the brackets. It is the question of SQL-1 step 6 in Python. Spelling out the answer as a column is the thought, and nothing is dropped yet."

  # 16
  - kind: "give"
    lang: "python"
    new: ["brackets-keep-yes"]
    text: |-
      You have a column of yes and no. Hand it to the table's square brackets, the same brackets that took a column out by its name, and the table keeps only the rows that said yes. How many orders were cancelled?

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(len(orders[orders['status'] == 'cancelled']))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(len(orders[orders['status'] == 'cancelled']))
    after_run: "399, the number SQL found. The brackets were given a column of yes and no in place of a name, and they kept the yes rows. A table came out, so len counted its rows. The question inside the brackets has to say which table's column it is asking about, and that is why orders appears twice. Say it as you would in English: from orders, keep the rows where the status is cancelled."
    note: "The doubled orders is explained in one clause as a plain reason and left there: the outer one is where the rows come from, and the inner one says whose column. It is never offered as a rule to remember, because the learner has just typed the question alone in step 15. B5 holds."

  # 17
