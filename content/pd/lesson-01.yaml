        ask: "That is the shortest. Which end did I ask for?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders['actual_minutes'].sum())
        ask: "That adds every delivery's minutes up. Which summary finds the biggest?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders['actual_minutes'])
        ask: "That shows the column. Which word turns many values into one?"
    walk:
      - "Read orders.csv, and take the column that holds the minutes the deliveries really took."
      - "Say the summary after it: the biggest is called max."
    return:
      text: "What did all the subtotals add up to?"
      model: |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders['subtotal'].sum())
      output: "360885.35"
      narration:
        - "360,885.35, the total SQL gave you. The column first, then the word for adding up."
        - "Every subtotal added together: one number out of 6,000 values."
      note: "Return for step 12."
    note: "Two spellings, sum and max, in two steps. The echoes are 109.9 from SQL-2 step 7 and 360,885.35 from SQL-2 step 6."

  # 13
  - kind: "aside"
    lang: "python"
    text: "Something that is only interesting, with nothing in it to keep. The name pandas has nothing to do with the animal. It comes from panel data, the economists' word for tables that follow the same things over time. The library was first written in 2008, at an investment firm, for exactly the work you are about to do: asking questions of tables of numbers."
    note: "Relief after the first climb (rule C8), and before the question-and-brackets climb. A real origin and not a mnemonic. The firm is not named."

  # 14
  - kind: "classmate"
    lang: "python"
    new: ["yes-no-column"]
    text: |-
      Now a question, as in SQL, where every row answers yes or no. Davi wanted to ask every order whether it was delivered. He wrote:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(status == 'delivered')
      ```

      Python answered: NameError: name 'status' is not defined. Davi, is status a name in the program, or a column of the table? ... A column. And you know how a column is asked for: the table, then its name in square brackets and quotes. The two equals signs then ask the question, as they did in your loop, but of the whole column at once:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders['status'] == 'delivered')
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders['status'] == 'delivered')
    broken: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(status == 'delivered')
    after_run: "A column of True and False, one answer for every row. Pandas shows only the first few and the last few of the 6,000. True means the order was delivered. Nothing has been dropped: all the rows are still here, each with its answer. In the loop you asked one row at a time, and here one line asked every row."
    note: "Davi makes the mistake before the learner can (rule E6), and Python's own message supplies the real reason: a bare word is a name in the program, and status is a column. It is the same slip as the unquoted word in SQL-1 step 8. Equals-asks arrives as an import from PY-1, said aloud. A list of True and False is shown as it is. The words yes and no stay in the narration."

