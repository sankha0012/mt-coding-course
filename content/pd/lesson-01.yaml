lesson: pd-01
title: "The same movements, in thinking order"
strand: pd
stage: 1
thoughts:
  bring-pandas-in: "`import pandas as pd` brings the library in, under a short name."
  read-a-table: "`orders = pd.read_csv('orders.csv')` reads a file into a table and names it."
  dataframe: "The table is called a DataFrame. A table goes in, a table comes out, as before."
  look-at-rows: "`orders.head()` shows the first rows."
  column: "`orders['subtotal']` gets one column by name. The name is text, so it wears quotes."
  summary-follows: "The summary comes after the column: `.mean()`, `.sum()`, `.max()`. In SQL it wrapped the column."
  yes-no-column: "`orders['status'] == 'delivered'` asks every row and gives a column of yes and no."
  brackets-keep-yes: "Hand that column to the brackets and only the yes rows come out."
  name-the-result: "Name what came out, then do something with it."
steps:
  # 1
  - kind: "cold-check"
    lang: "python"
    requires: ["row-is-dict", "table-is-list-of-rows", "cell", "for-each", "block", "if-question", "equals-asks", "running-result", "build-average", "show"]
    text: |-
      Here are three delivery rows, each one a dict, in a list:

      ```python
      rows = [{'status': 'delivered', 'fee': 5.0}, {'status': 'cancelled', 'fee': 7.5}, {'status': 'delivered', 'fee': 3.0}]
      ```

      Type them in, and print the average fee of the delivered rows.
    model: |
      rows = [{'status': 'delivered', 'fee': 5.0}, {'status': 'cancelled', 'fee': 7.5}, {'status': 'delivered', 'fee': 3.0}]
      total = 0
      count = 0
      for row in rows:
          if row['status'] == 'delivered':
              total = total + row['fee']
              count = count + 1
      print(total / count)
    output: "4.0"
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from PY-6, the closing idea in small: a list of rows, a loop, a question, a running total and a count. It is also the loop that pandas is about to replace, so the lesson can say so in step 10. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["bring-pandas-in"]
    text: |-
      You have spent six lessons doing by hand what a library does in a word. The library for tables is called pandas. It lives outside the plain Python you have used so far, so before we can use it we have to bring it in. One line does it, and it goes at the top of every script from now on:

      ```python
      import pandas as pd
      ```

      Run it.
    shows:
      - "import pandas as pd"
    after_run: "Nothing came out, and nothing should: the line only brought the library in. The \"as pd\" gives it a short name, so that from here on pd means pandas. Everybody writes pd. That one just is."
    note: "The first line of every pandas script, used before it is explained (rule B3). \"Everybody writes pd\" is the honest reason, and the rule about mnemonics says to say so (rule B6). The learner will type this line in every step from here on."

  # 3
  - kind: "give"
    lang: "python"
    new: ["read-a-table"]
    text: |-
      Now a table. The orders are in a file called orders.csv, and pandas can read a file into a table in one line. You know this shape: a name, one equals sign, and what the name is given to. The file's name is text, so it wears quotes. Then a line to say how many rows came in, with the word that counted a list:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(len(orders))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(len(orders))
    after_run: "6,000, the count SQL gave you in the first minute. pd.read_csv read the file, and orders is the name we gave to the table that came out. The name is ours to choose, and it is kind to call a table what it is."
    note: "Three imports said aloud: one equals sign names (PY-1), text wears quotes, len counts. The learner types the read line in every step from here on, which is the owner's decision of 24 Nov."

  # 4
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "how-many", "name-a-value", "text-quotes"]
    text: "The restaurants are in a file called restaurants.csv. Read them in and print how many there are. Think it out before you type, and start the script the way every script starts."
    model: |
      import pandas as pd
      restaurants = pd.read_csv('restaurants.csv')
      print(len(restaurants))
    output: "60"
    narration:
      - "60. Bring pandas in, read the file under a name, count the rows: the same three movements as with the orders."
      - "60 restaurants, the same 60 SQL counted. Only the file and the name changed."
      - "60."
    wrong:
      - code: |-
          restaurants = pd.read_csv('restaurants.csv')
          print(len(restaurants))
        ask: "Python reads your first line and meets pd. Has it been told what pd is?"
        why: "pd is only a short name for pandas, and it exists once the library has been brought in. Every script starts there."
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv(restaurants.csv)
          print(len(restaurants))
        ask: "Is restaurants.csv a name in your program, or a piece of text?"
        why: "a file's name is text, so it wears quotes, like any other word we are looking for."
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants)
        ask: "That shows the table, or as much as fits. I asked how many rows there are. What counted the items of a list?"
        why: "len counts whatever it is given, and a table's items are its rows."
    walk:
      - "Bring pandas in, the way every script starts."
      - "Read restaurants.csv into a table and give it a name: a name, one equals sign, then pd.read_csv with the file's name in quotes."
      - "Print how many rows it has. The word that counted a list counts these."
    return:
      text: "There is a small file called coupons.csv. Read it in and tell me how many rows it has."
      model: |
        import pandas as pd
        coupons = pd.read_csv('coupons.csv')
        print(len(coupons))
      output: "4"
      narration:
        - "4 coupons. Bring pandas in, read the file, count the rows: the same three movements."
        - "4. The file's name wore quotes, and len counted the rows."
      note: "Return for step 4. Early step: only the table can change."
    note: "First typed sentence, and the first rule of engagement, at the moment it matters. Only the table changes from step 3, on purpose: it fixes where the file's name goes. This is the one place where a one-slot change is wanted. SQL-1 step 2 did the same."

  # 5
  - kind: "give"
    lang: "python"
    new: ["dataframe"]
    text: |-
      Pause on what you just made. Pandas has a name for it: a DataFrame. It is a table, with rows and columns, the very same table SQL had. And the picture you kept from the first lesson still holds: a table goes in, a table comes out. Everything from here is that, written in Python.

      You will hardly need the word DataFrame again, but you will hear it everywhere, so now you have met it.
    note: "The overarching idea (rule C10), carried over from SQL-1 step 5 and marked as the one thing to hold on to. It is only a name, and the learner is told it is only a name."

  # 6
  - kind: "give"
    lang: "python"
    new: ["look-at-rows"]
    text: |-
      To look at a table without drowning in it, ask it for its first few rows. A thing in Python is asked to do something by a dot after its name and the action after the dot, the way a list was asked to append. The action here is called head, and the number in its brackets says how many rows:

      ```python
      import pandas as pd
      restaurants = pd.read_csv('restaurants.csv')
      print(restaurants.head(3))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        restaurants = pd.read_csv('restaurants.csv')
        print(restaurants.head(3))
    after_run: "Three rows, every column, and a number down the side that pandas adds for itself. With nothing in the brackets, head gives five. A table went in and a smaller table came out."
    note: "The dot-and-brackets of an action is imported from the list's append, not explained. The restaurants table has five columns and fits the screen. The orders table has eleven, and pandas would cut the middle out, so it is not shown yet."

  # 7
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "look-at-rows", "dataframe", "text-quotes"]
    text: "The couriers are in couriers.csv. Show me their first four rows."
    model: |
      import pandas as pd
