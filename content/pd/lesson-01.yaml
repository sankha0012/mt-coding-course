      - "Ask it for its first rows, and print."
    return:
      text: "Now the couriers again. Show me the first five of the vehicle column."
      model: |
        import pandas as pd
        couriers = pd.read_csv('couriers.csv')
        print(couriers['vehicle'].head())
      output: |-
        0     bike
        1     bike
        2    carro
        3     bike
        4     bike
        Name: vehicle, dtype: str
      narration:
        - "Bike, bike, carro, bike: the vehicle of each of the first couriers. A column by name, then its first rows."
        - "The same movement on another table and another column."
      note: "Return for step 9. Other table and column."
    note: "Brackets and quotes met in one sentence. The word city is the first thing in this table that is only text."

  # 10
  - kind: "give"
    lang: "python"
    new: ["summary-follows"]
    text: |-
      A summary of a column is still what it was in SQL: an average, a total, a biggest. But the order changes. In SQL the summary wrapped the column, AVG of the subtotal. In pandas you take the column first, and the summary follows it after a dot, as head did:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders['subtotal'].mean())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders['subtotal'].mean())
    after_run: "About 60.40, the average SQL gave you in the first lesson. 25 of the subtotals are empty, and pandas leaves them out, as AVG did. The table, then the column, then the summary: that is the order you think it in, and now it is the order you write it in. Two more work the same way: .sum() adds the column up, and .max() finds its biggest."
    note: "The thought is an order, not a spelling. The map says SQL wrapped the column and pandas follows it. mean, sum and max are the spellings of AVG, SUM and MAX, said here once. 25 subtotals are empty, which is why the number is not exactly SQL's to the last digit, and it is said as a plain fact."

  # 11
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "column", "summary-follows", "text-quotes"]
    text: "What was the average delivery fee over all the orders?"
    model: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders['delivery_fee'].mean())
    output: "5.213018333333333"
    narration:
      - "About 5.21. The table, then the column, then the summary after it."
      - "5.21 on average. The word for an average is shorter here, mean, and it comes last."
      - "The summary followed the column, and a single number came out."
    wrong:
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders['delivery_fee'])
        ask: "That is the column itself. What do we want said about it?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(mean(orders['delivery_fee']))
        ask: "In SQL the summary wrapped the column. Which one comes first in pandas?"
        why: "in pandas the column comes first and the summary follows it."
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders['delivery_fee'].avg())
        tell: "The word is mean. That spelling just is."
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders['delivery_fee'].mean)
        ask: "Python showed you the action and did not run it. What do brackets do after an action's name?"
    walk:
      - "Read orders.csv into a table, as every script does."
      - "Take the delivery fee column out of it."
      - "Say the summary after the column: the average is called mean."
    return:
      text: "The promised_minutes column says how long each delivery was promised for. What was the average promise?"
      model: |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders['promised_minutes'].mean())
      output: "39.931666666666665"
      narration:
        - "About 39.93 minutes, SQL's answer again. The column first, and the summary after it."
        - "The table, then the column, then the average."
      note: "Return for step 11. Other column."
    note: "The first summary the learner types. The thinking-order phrase is on the step so the order of the sentence can be found, as in SQL-1 step 7."

