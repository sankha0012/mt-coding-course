        ask: "Python showed you the action itself and did not run it. What do brackets do after an action's name?"
        why: "the brackets are what run it. With none, you have only named it."
      - code: |-
          import pandas as pd
          couriers = pd.read_csv('couriers.csv')
          print(couriers.head())
        ask: "Count the rows that came out. How many did I ask for, and where does a number go?"
    walk:
      - "Bring pandas in and read couriers.csv into a table with a name."
      - "Ask the table for its first rows: a dot, head, and in its brackets the number you want."
      - "Print what came out."
    return:
      text: "The coupons file has only a few rows. Show me the first two."
      model: |
        import pandas as pd
        coupons = pd.read_csv('coupons.csv')
        print(coupons.head(2))
      output: |-
        coupon_code  discount_pct
        0   BEMVINDO10            10
        1  FRETEGRATIS             0
      narration:
        - "The first two coupons, and their codes and discounts. The same action, with another number and another table."
        - "Two rows came out of the table that went in."
      note: "Return for step 7."
    note: "Show me, in place of count me. The learner has met couriers.csv by name only. The vehicle column is seen here, many steps before the closing cold check needs it."

  # 8
  - kind: "give"
    lang: "python"
    new: ["column"]
    text: |-
      A table has columns, and each column has a name. To take one column out, put its name in square brackets after the table. You have used square brackets before: they always mean get something from inside. And a column's name is text, so it wears quotes. A column is long, so we look at its first five with head:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders['subtotal'].head())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders['subtotal'].head())
    after_run: "One column, with the row numbers beside its values. The line at the foot is only pandas saying what it is. Square brackets, a name in quotes: get that one from inside. The table came out narrower, down to a single column."
    note: "Imports square brackets (get from inside, PY-3) and quotes. The quotes-and-brackets spelling is the only one this course uses for a column. Dot-spelling is never taught (decision in the map)."

