      print(couriers.head(4))
    output: |-
      courier_id vehicle       city
      0           1    bike  São Paulo
      1           2    bike  São Paulo
      2           3   carro  São Paulo
      3           4    bike  São Paulo
    narration:
      - "Four couriers, with their vehicle and their city. The table was asked for its first rows, and the number said how many."
      - "The first four rows, and nothing else: a smaller table came out of the table that went in."
      - ""
    wrong:
      - code: |-
          import pandas as pd
          couriers = pd.read_csv('couriers.csv')
          print(couriers)
        ask: "That shows the table, or as much of it as fits. Which action asks for only the first few?"
      - code: |-
