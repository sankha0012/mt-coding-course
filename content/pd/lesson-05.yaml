  # 7
  - kind: "aside"
    lang: "python"
    text: "\nSomething that is only interesting, with nothing in it to keep. The pattern behind groupby and transform has a name: split, apply, combine. Split the rows into piles, apply a summary to each pile, combine the answers back into one table. The statistician Hadley Wickham gave it that name in a paper in 2011, for the R language, and pandas follows the same idea. The only difference between the two words you now own is the combining: `.mean()` puts the answers together as one row per pile, and `transform('mean')` puts them back beside the original rows.\n"
    note: "Relief after the first climb, and a real origin, not a mnemonic. It restates the contrast between a summary per pile and a summary beside each row, in the words the pass-bar interview would use."

  # 8
  - kind: "give"
    lang: "python"
    new: ["top-n-in-pandas"]
    text: |
      Another job SQL did with a window: the three biggest orders of each restaurant. There you numbered the rows inside each pile and kept the numbers up to 3. In pandas it takes three movements, in the order they happen. Sort the whole table, make the piles, take the first three rows of each pile:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      ranked = orders.sort_values('subtotal', ascending=False)
      top = ranked.groupby('restaurant_id').head(3)
      print(len(top))
      print(round(top['subtotal'].sum(), 2))
      ```

      Run it. The `round(number, 2)` is plain Python: the number, and how many places to keep.
    shows:
      - |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        ranked = orders.sort_values('subtotal', ascending=False)
        top = ranked.groupby('restaurant_id').head(3)
        print(len(top))
        print(round(top['subtotal'].sum(), 2))
    after_run: |
      180 rows: three for each of sixty restaurants, the same 180 SQL found. You have met `.head()` as the first rows of a table. After `groupby` it gives the first rows of each pile, and the sorting you did first is kept inside every pile, so the first three are the biggest three.
    note: "In SQL, ROW_NUMBER then keep up to 3. Here there is no numbering: the sorted order is kept inside each pile, so head(3) is enough. The learner owns sort_values and head already. The reason given is real. `round` is supplied in the teacher's line."

