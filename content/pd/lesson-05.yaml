  # 2
  - kind: "give"
    lang: "python"
    new: ["transform-beside"]
    text: |
      Today we take the jobs SQL did with windows and do them in pandas. The first one. When you made piles, one row came out for each pile. Sometimes you want each pile's answer written beside every row of that pile instead, so that the rows stay. In SQL that was `AVG(subtotal) OVER (PARTITION BY restaurant_id)`. In pandas it is the piles you already know, then the column, then one new word, `transform`, with the name of the summary in quotes:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      orders['rest_avg'] = orders.groupby('restaurant_id')['subtotal'].transform('mean')
      print(orders[['restaurant_id', 'subtotal', 'rest_avg']].head())
      ```

      Run it.
    shows:
      - |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        orders['rest_avg'] = orders.groupby('restaurant_id')['subtotal'].transform('mean')
        print(orders[['restaurant_id', 'subtotal', 'rest_avg']].head())
    after_run: |
      Look down the rest_avg column. Every row of one restaurant carries that restaurant's average, and the rows did not collapse: 6,000 went in and 6,000 are here. `.mean()` alone gives sixty numbers, one per pile. `transform('mean')` gives a number for every row, so it can sit in a column beside them. The summary's name wears quotes because it is a word, not a column.
    note: "The first word of the lesson. It is SQL's OVER with PARTITION BY, in thinking order: piles, the column, the summary. The learner already owns groupby, a column by name, and a new column from PD-3, so only `transform` is new. The step prints five rows so that the learner sees a different restaurant's number on each row."

