    walk:
      - "Make the piles by status, pick the delivery fee, and say the total."
      - "Sort what came out."
      - "Turn it round so the biggest is first."
    return:
      text: "Show each promised_minutes value with the average actual_minutes of its orders, the biggest average first."
      model: |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders.groupby('promised_minutes')['actual_minutes'].mean().sort_values(ascending=False))
      output: |-
        promised_minutes
        50    49.439216
        40    39.606924
        30    29.377445
        Name: actual_minutes, dtype: float64
      narration:
        - "50 minutes promised took about 49.4, then 40, then 30. Piles, the average, the sort."
        - "The same last word as before, on a different column."
      note: "Return for step 12."
    note: "Sort after summaries. The unsorted answer happens to be in the alphabet's order and the sort without ascending=False gives the same order, so the first two wrong answers both show."

  # 13
  - kind: "aside"
    lang: "python"
    text: "Something that is only interesting, with nothing in it to keep. The three movements you keep making, split the table into piles, say something about each pile, put the answers together into a new table, have a name among people who work with data: split, apply, combine. A paper in 2011 gave it that name, and pointed out that it is what GROUP BY and groupby and half the other tools do, under different spellings. It is why your thought in SQL was already the thought in Python."
    note: "Relief after the climb of steps 11 and 12 and before the steepest part of the lesson (rule C8). A real origin of a real phrase, and no mnemonic. It restates, from a distance, the course's own claim that the movements do not change."

  # 14
  - kind: "give"
    lang: "python"
    new: ["keep-piles-again"]
    text: |-
      Piles that have been counted are a table, or very nearly: a column of numbers, each with a name beside it. So you can keep some of them the way you keep rows. Ask a question of the column, and hand the answers to the brackets. We name the counts first, because we use them twice:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      counts = orders[orders['status'] == 'delivered'].groupby('restaurant_id').size()
      print(counts[counts > 110])
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        counts = orders[orders['status'] == 'delivered'].groupby('restaurant_id').size()
        print(counts[counts > 110])
    after_run: "Two restaurants had more than 110 delivered orders: restaurant 2 with 113, and restaurant 24 with 112. The question was asked of the piles' counts, and the brackets kept the yes. There is no second word for it. In SQL, WHERE asked about rows and HAVING asked about piles, and you had to know which was which. Here the piles are a table, so keeping piles is keeping rows."
    note: "The thought that dissolves HAVING (map note). counts[counts > 110] is the same brackets and the same question as PD-1 step 16, so it is a discovery. counts is named because it is needed twice, which is name-the-result again. The list comes out short, on purpose."

  # 15
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "column", "summary-follows", "yes-no-column", "brackets-keep-yes", "text-quotes", "groupby", "size", "keep-piles-again", "name-the-result", "how-many", "compare-signs"]
    text: "Show how many restaurants had more than 100 delivered orders."
    model: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      counts = orders[orders['status'] == 'delivered'].groupby('restaurant_id').size()
      print(len(counts[counts > 100]))
    output: "16"
    narration:
      - "16: the same 16 restaurants SQL kept with HAVING. You made the piles, counted them, named the counts, and kept the piles that passed."
      - "Keep the delivered orders, pile them by restaurant, count each pile, then keep the piles above 100. And only a table was ever kept."
      - "16 restaurants."
    wrong:
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          counts = orders[orders['status'] == 'delivered'].groupby('restaurant_id').size()
          print(len(counts))
        ask: "That is every restaurant. Where do we keep only the ones above 100?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          counts = orders[orders['status'] == 'delivered'].groupby('restaurant_id').size()
