    model: |
      import pandas as pd
      couriers = pd.read_csv('couriers.csv')
      print(couriers.groupby('vehicle').size())
    output: |-
      vehicle
      bike      73
      carro     17
      moto     110
      dtype: int64
    narration:
      - "Bike 73, carro 17, moto 110. Piles by vehicle, then a count of each pile, with the names on the left."
      - "The 73 you found in the first lesson, now with its two neighbours and all three names."
      - ""
    wrong:
      - code: |-
          import pandas as pd
          couriers = pd.read_csv('couriers.csv')
          print(couriers.groupby('vehicle'))
        ask: "Piles are made, and nothing is said about them. What do we want to know about each?"
      - code: |-
          import pandas as pd
          couriers = pd.read_csv('couriers.csv')
          print(couriers['vehicle'].size())
        ask: "That asks a column about its size, and a column has no piles. What makes the piles first?"
      - code: |-
          import pandas as pd
          couriers = pd.read_csv('couriers.csv')
          print(couriers.groupby('city').size())
        ask: "Those are the cities. Which column holds the vehicle?"
    walk:
      - "Read couriers.csv into a table."
      - "Make piles by the vehicle column."
      - "Count the rows of each pile, and print."
    return:
      text: "The restaurants have a cuisine. Show each cuisine with how many restaurants serve it."
      model: |
        import pandas as pd
        restaurants = pd.read_csv('restaurants.csv')
        print(restaurants.groupby('cuisine').size())
      output: |-
        cuisine
        arabe          8
        brasileira    11
        hamburguer    13
        japonesa      10
        pizza          8
        saudavel      10
        dtype: int64
      narration:
        - "Six cuisines, each with its count: arabe 8, brasileira 11, hamburguer 13, japonesa 10, pizza 8, saudavel 10."
        - "Piles by cuisine, then a count of each. The names came out without being asked for."
      note: "Return for step 7."
    note: "Counting piles of another table. The learner never needs to pick a column here, which is why the star was never a worry in SQL either."

  # 8
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "column", "summary-follows", "yes-no-column", "brackets-keep-yes", "text-quotes", "groupby", "size", "pile-names-on-left", "compare-signs", "keep-before-piles"]
    text: "Among the orders with a subtotal above 100, show each promised_minutes value with how many of those orders have it."
    model: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders[orders['subtotal'] > 100].groupby('promised_minutes').size())
    output: |-
      promised_minutes
      30    219
      40    199
      50    214
      dtype: int64
    narration:
      - "219 for the 30-minute promises, 199 for 40 and 214 for 50. You kept the big orders first, then made the piles, then counted them."
      - "Keep, pile, count: the same order as SQL, with the table first. After the table, the sentence runs in the order things happen."
      - ""
    wrong:
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders.groupby('promised_minutes').size())
        ask: "Those counts include every order. Which ones did I ask about?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders.groupby('promised_minutes')[orders['subtotal'] > 100].size())
        ask: "Which happens first, keeping rows or making piles? Write them in that order."
        why: "the rows are kept before the piles are made, so the keeping comes first in the sentence."
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(len(orders[orders['subtotal'] > 100]))
        ask: "That is how many big orders there are in all. How many for each promised time?"
    walk:
      - "Read orders.csv. Keep only the orders above 100, as before."
      - "Of what is left, make the piles by promised time."
      - "Count the rows of each pile, and print."
    return:
      text: "Among the cancelled orders, show each promised_minutes value with how many of those orders have it."
      model: |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders[orders['status'] == 'cancelled'].groupby('promised_minutes').size())
      output: |-
        promised_minutes
        30    117
        40    140
        50    142
        dtype: int64
      narration:
        - "117 at 30 minutes, 140 at 40 and 142 at 50. Keep the cancelled ones, pile them, count the piles."
        - "The same order as before: keep, then piles, then the count."
      note: "Return for step 8."
    note: "PD-1's keep, joined to this lesson's piles. Keep-before-piles is SQL-1's last thought, now in the order of the sentence itself."

  # 9
  - kind: "give"
    lang: "python"
    new: ["value-counts"]
    text: |-
      For a single column, piles and a count are so common that pandas has one word for the lot. Ask a column how many of each, and it tells you, the biggest first:

      ```python
      import pandas as pd
      couriers = pd.read_csv('couriers.csv')
      print(couriers['vehicle'].value_counts())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        couriers = pd.read_csv('couriers.csv')
        print(couriers['vehicle'].value_counts())
    after_run: "Moto 110, bike 73, carro 17: the piles you made a moment ago, already counted and already in order, with no groupby and no size. It is the first thing people do to a table they have never seen: what is in this column, and how many of each."
    note: "value-counts was added to the map on 24 Nov for the cold sittings, which use tables the learner has never seen. It is a shortcut for step 7 plus a sort, and the learner is told what it is a shortcut for."

  # 10
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "column", "value-counts"]
    text: "Show each restaurant city with how many restaurants are in it, the biggest number first."
    model: |
      import pandas as pd
      restaurants = pd.read_csv('restaurants.csv')
      print(restaurants['city'].value_counts())
    output: |-
      city
      São Paulo         25
      Belo Horizonte    15
      Rio de Janeiro    14
      Curitiba           6
      Name: count, dtype: int64
    narration:
      - "São Paulo 25, Belo Horizonte 15, Rio 14, Curitiba 6. That is the sentence you wrote in SQL at the start of the sitting, in a single word."
      - "One column, asked how many of each, biggest first."
      - ""
    wrong:
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants.groupby('city').size())
        ask: "Right numbers, but in the order of the alphabet. Which word gives the biggest first, on its own?"
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants['city'].value_counts)
        ask: "Python showed you the action and did not run it. What do brackets do after an action's name?"
      - code: |-
          import pandas as pd
          restaurants = pd.read_csv('restaurants.csv')
          print(restaurants['city'].count())
        ask: "That is one number: how many cities were written down. What do we want for each city?"
    walk:
      - "Read restaurants.csv into a table."
      - "Take the city column out."
      - "Ask it how many of each: value_counts, with its brackets."
    return:
      text: "The couriers work in cities too. Show me each city and how many couriers it has, the biggest first."
      model: |
        import pandas as pd
        couriers = pd.read_csv('couriers.csv')
        print(couriers['city'].value_counts())
      output: |-
        city
        São Paulo         89
        Rio de Janeiro    49
        Belo Horizonte    32
        Curitiba          30
        Name: count, dtype: int64
      narration:
        - "São Paulo 89, Rio de Janeiro 49, Belo Horizonte 32, Curitiba 30. A column, asked how many of each."
        - "Piles by city, counted and sorted, in one word."
      note: "Return for step 10."
    note: "The same sentence as the cold check, written in the shortest way. A learner who answers with groupby and size gets the right numbers in the alphabet's order, which is the first wrong answer, and the question points them at the sort."

  # 11
  - kind: "give"
    lang: "python"
    new: ["sort-values"]
    text: |-
      When the piles are made some other way, and you want them in the order of their numbers, you sort the values. It starts from the smallest, as sorted did for a list, and ascending=False turns it round, as reverse=True did there. The sort is the last thing said, because it happens last:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders.groupby('promised_minutes')['subtotal'].mean().sort_values(ascending=False))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders.groupby('promised_minutes')['subtotal'].mean().sort_values(ascending=False))
    after_run: "50 first, with the biggest average, then 30, then 40. The averages were made first, and then put in order, which is why the sort comes at the end, as ORDER BY did. The word for turning it round is not reverse here. It is ascending=False. That spelling just is."
    note: "Imports sorted and reverse=True from PY-2 and ORDER BY ... DESC from SQL-2. ascending versus reverse is an arbitrary difference, and the step says so, as SQL-1 did for AVG (rule B6)."

