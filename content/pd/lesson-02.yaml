      Python answered: ValueError: The truth value of a Series is ambiguous. Ana, how many answers does each of those questions give? ... 6,000, one for every row. And the word and asks once: is this whole thing true, or is it false? A column of 6,000 answers cannot be true as a whole, so Python refuses.

      The sign that asks both at once, row by row, is &. For either, it is |. Each question goes in its own round brackets, because & is done before == and >, and the brackets say: questions first.

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(len(orders[(orders['status'] == 'delivered') & (orders['subtotal'] > 100)]))
      ```

      Run it.
