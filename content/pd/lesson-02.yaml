lesson: pd-02
title: "Piles in pandas"
strand: pd
stage: 1
thoughts:
  groupby: "`orders.groupby('status')` makes the piles."
  pick-then-summarise: "Then pick the column, then say the summary: thinking order."
  pile-names-on-left: "The pile names come out on the left, by themselves. Nobody has to ask for them."
  size: "`.size()` counts the rows of each pile."
  value-counts: "`orders['status'].value_counts()` is piles and a count in one word, biggest first."
  sort-values: "`.sort_values(ascending=False)` sorts, biggest first."
  keep-piles-again: "The piles are a table, so keeping piles is keeping rows. There is no second word."
  row-by-row-and: "Two questions are joined with `&` or `|`, each in its own brackets. Python's `and` asks once, and these ask every row."
steps:
  # 1
  - kind: "cold-check"
    requires: ["count-rows", "from-table", "piles", "one-row-per-pile", "pile-name", "commas", "sort", "sort-direction", "sort-by-summary"]
    ordered: true
    any_column_order: true
    text: "From restaurants, show each city with how many restaurants it has, the biggest number first."
    model: "SELECT city, COUNT(*) FROM restaurants GROUP BY city ORDER BY COUNT(*) DESC"
    rows: 4
    result: [["São Paulo", 25], ["Belo Horizonte", 15], ["Rio de Janeiro", 14], ["Curitiba", 6]]
    after_run: "That one is SQL, from a few lessons back. Hold on to what it did: piles, a count for each, the biggest first. Today we write it in Python."
    note: "Opening cold check, from SQL-1 and SQL-2: piles, the pile's name, a count, a sort by the count. It is deliberately SQL. Step 10 writes the same sentence in one word of pandas. No two cities share a count, so the order is stable. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["groupby"]
    text: |-
      Piles in SQL were GROUP BY. Pandas makes piles too, and says them in the order you think them: the table first, then the piles. Here the orders are sorted into piles by their status, and then a line to count how many piles there are:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(len(orders.groupby('status')))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(len(orders.groupby('status')))
    after_run: "Two piles: cancelled and delivered. The orders were sorted by what their status column holds, as GROUP BY did. We have not said anything about the piles yet, so there is nothing to see except how many there are. The piles are not a table you can look at. They wait for something to be said about them."
    note: "Printing the piles themselves would show a memory address that changes every run, so the first step counts them. len on piles counts piles, where len on a table counts rows. That is said once, and is the real reason for the odd-looking line."

  # 3
  - kind: "give"
    lang: "python"
    new: ["pick-then-summarise"]
    text: |-
      Now say something about each pile. You already know how to say something about a column of a table: pick the column, then say the summary. Do just that to the piles:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders.groupby('status')['subtotal'].mean())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders.groupby('status')['subtotal'].mean())
    after_run: "About 59.99 for the cancelled orders and 60.43 for the delivered ones: the two numbers SQL gave you in the first lesson. The table, then the piles, then the column, then the summary. In SQL the summary came first and the piles last, and here the sentence runs in the order you think it."
    note: "Pick-then-summarise is the PD-1 sentence with the piles inserted. Nothing new is spelled, only an order. 59.99 and 60.43 are SQL-1 step 19."

  # 4
  - kind: "ask"
    lang: "python"
    requires: ["bring-pandas-in", "read-a-table", "column", "summary-follows", "groupby", "pick-then-summarise"]
    text: "Show each status with the average delivery_fee of its orders."
    model: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders.groupby('status')['delivery_fee'].mean())
    output: |-
      status
      cancelled    5.368246
      delivered    5.201960
      Name: delivery_fee, dtype: float64
    narration:
      - "Cancelled about 5.37, delivered about 5.20. Piles by status, the delivery fee picked, its average said."
      - "One average for each pile: the table, the piles, the column, the summary."
      - ""
    wrong:
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders['delivery_fee'].mean())
        ask: "That is one number for the whole table. What makes it one for each status?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders.groupby('delivery_fee')['status'].mean())
        ask: "Which column makes the piles, and which is the average about?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders.groupby('status').mean()['delivery_fee'])
        ask: "Python cannot average the whole table, because some columns are words. Pick the column before the summary."
    walk:
      - "Make the piles by status, after the table."
      - "Pick the delivery fee column."
      - "Say the average, and print."
    return:
      text: "Show each promised_minutes value with the largest actual_minutes of its orders."
      model: |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders.groupby('promised_minutes')['actual_minutes'].max())
      output: |-
        promised_minutes
        30     63.9
        40     95.5
        50    109.9
        Name: actual_minutes, dtype: float64
      narration:
        - "109.9 for the 50-minute promises, and less for the others. A different pile, a different column, a different summary."
        - "Piles by promised time, the real minutes picked, the biggest said."
      note: "Return for step 5."
    note: "First pile sentence with no hand-holding. It follows the give of step 3 with another pile column and another picked column, so it is not an edit of it in one place. Its names on the left have already been seen in step 3 and are not remarked on until the next step."

  # 5
  - kind: "ask"
    lang: "python"
    new: ["pile-names-on-left"]
    requires: ["bring-pandas-in", "read-a-table", "column", "summary-follows", "groupby", "pick-then-summarise"]
    text: "The promised_minutes column holds 30, 40 or 50. For each promised_minutes value, show the average subtotal of its orders. In SQL you had to ask for the pile's name, or the numbers came out unlabelled. Look at what pandas does about that when you run it."
    model: |
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      print(orders.groupby('promised_minutes')['subtotal'].mean())
    output: |-
      promised_minutes
      30    60.335199
      40    60.069905
      50    60.797772
      Name: subtotal, dtype: float64
    narration:
      - "Each number has its pile beside it, 30, 40 and 50, and you did not ask for them. The answer is filed under the names of the piles, down the left, by itself."
      - "Three piles, and each average already carries its name. In SQL you had to ask for the name. Here nobody does."
      - "30, 40 and 50 are there on the left, without a word from you."
    wrong:
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders.groupby('promised_minutes')['subtotal'])
        ask: "Piles are made and a column is picked, but nothing is said about each pile. What do we want to know about each?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders.groupby('subtotal')['promised_minutes'].mean())
        ask: "How many piles did you expect, and what are we piling by? Which column makes the piles?"
      - code: |-
          import pandas as pd
          orders = pd.read_csv('orders.csv')
          print(orders['subtotal'].mean())
        ask: "That is one number for every order. Where do the piles come in?"
    walk:
      - "Read orders.csv. Then, after the table, make the piles: groupby, with the column to pile by in quotes."
      - "Pick the column the average is about."
      - "Say the summary, and print."
    return:
      text: "Show each status with the average promised_minutes of its orders."
      model: |
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        print(orders.groupby('status')['promised_minutes'].mean())
      output: |-
        status
        cancelled    40.626566
        delivered    39.882164
        Name: promised_minutes, dtype: float64
      narration:
        - "Two piles, each with its name beside it: cancelled and delivered. The names came out without being asked for."
        - "The table, the piles, the column, the summary. And the pile's name on the left by itself."
      note: "Return for step 4. Other pile column and other summary column."
    note: "The new thought is a discovery and not a rule: the learner is told to look, then sees. The names have been on the left since step 3, and this is the step that says so. It resolves, without a word of teaching, the tension SQL-1 built in steps 15 to 17. Echoes SQL-1 step 19's return, where the promised times were the piles."

  # 6
  - kind: "give"
    lang: "python"
    new: ["size"]
    text: |-
      Counting is the one summary that needs no column, because it counts whole rows, not the values of one column. In SQL that was the star. After the piles, the word for it is size:

      ```python
      import pandas as pd
      restaurants = pd.read_csv('restaurants.csv')
      print(restaurants.groupby('city').size())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        restaurants = pd.read_csv('restaurants.csv')
        print(restaurants.groupby('city').size())
    after_run: "15, 6, 14 and 25: how many restaurants each city has, the same numbers SQL gave, each with its city beside it. Nothing was picked, because rows are what is counted. Size is COUNT of the star, said after the piles."
    note: "size, and no column picked, is COUNT(*) said in the new order. The learner has met the cities and their counts in SQL-1 steps 16 to 18."

  # 7
  - kind: "ask"
    lang: "python"
