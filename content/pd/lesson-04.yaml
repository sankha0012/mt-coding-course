    text: "Something that is only interesting, with nothing in it to keep. If you have ever used a spreadsheet, you have done a merge. VLOOKUP looks a value up in another table and brings a column back, and that is what you did with the city. People say join, merge and lookup for the same movement, and interviewers use all three, so now each of them will be familiar."
