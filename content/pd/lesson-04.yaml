  # 12
  - kind: "give"
    lang: "python"
    new: ["several-summaries"]
    supplies: [".agg(['mean', 'count'])"]
    text: |-
      This one you would look up, and nobody minds. The thought is: say several things about each pile at once. Here it is spelled `.agg(['mean', 'count'])`, a list of the summaries you want, each in quotes, after the column. The names of the summaries are the ones you know:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
