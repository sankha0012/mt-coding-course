  # 4
  - kind: "give"
    lang: "python"
    new: ["pile-by-merged"]
    text: |-
      Once the city is on the order's row, it is a column like any other, and a column can make the piles. This is the sentence you wrote in SQL at the start of the sitting:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      restaurants = pd.read_csv('restaurants.csv')
      joined = orders.merge(restaurants, on='restaurant_id')
      print(joined.groupby('city').size())
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        restaurants = pd.read_csv('restaurants.csv')
        joined = orders.merge(restaurants, on='restaurant_id')
        print(joined.groupby('city').size())
    after_run: "1,494, 639, 1,375 and 2,492: the same four numbers SQL gave, one for each city. The orders never had a city. The merge put one on each row, and from then on it was an ordinary column, so it could make piles. The sentence reads in the order it happens: stick on, pile, count."
    note: "The echo of step 1, deliberate: the learner sees the same four numbers with a different spelling. It is a discovery, because a merged column behaves exactly as any other, and nothing about piles had to be learned again."

