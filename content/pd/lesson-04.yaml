  # 7
  - kind: "give"
    lang: "python"
    new: ["only-matches-survive"]
    text: |-
      There is a fourth table, in deliveries.csv. It has one row for each order that was delivered: the order's number, how far it travelled, whether it rained, and how many orders the courier was carrying. Merge the orders with it, and count the rows before and after:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      deliveries = pd.read_csv('deliveries.csv')
      joined = orders.merge(deliveries, on='order_id')
      print(len(orders))
      print(len(deliveries))
      print(len(joined))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        deliveries = pd.read_csv('deliveries.csv')
        joined = orders.merge(deliveries, on='order_id')
        print(len(orders))
        print(len(deliveries))
        print(len(joined))
    after_run: "6,000 orders, 5,601 deliveries, and 5,601 rows after the merge. 399 orders vanished. Those are the cancelled orders: they were never delivered, so they have no row in deliveries. A merge keeps only the rows that have a partner in the other table, and the rest drop out without a word. That is what JOIN did in SQL too."
    note: "A real wrinkle the learner has not met, and a consequence of the data: restaurants and couriers have no unmatched rows. 399 is the number of cancelled orders SQL-1 found. It is the bridge to the closing sentence, where it makes the lateness comparison honest. The way to keep them is a later thought and is not mentioned."

