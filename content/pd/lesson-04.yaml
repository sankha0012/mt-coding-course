  # 10
  - kind: "give"
    lang: "python"
    new: ["names-back-as-column"]
    text: |-
      Piles put their names on the left, but not as a column: they are the labels of the rows. That matters when the next step wants to ask the names a question, or take them in a list of columns, as with any ordinary column. reset_index turns the names back into an ordinary column:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      restaurants = pd.read_csv('restaurants.csv')
      joined = orders.merge(restaurants, on='restaurant_id')
      by_city = joined.groupby('city')['subtotal'].mean().reset_index()
      print(by_city[by_city['city'] == 'Curitiba'])
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        restaurants = pd.read_csv('restaurants.csv')
        joined = orders.merge(restaurants, on='restaurant_id')
        by_city = joined.groupby('city')['subtotal'].mean().reset_index()
        print(by_city[by_city['city'] == 'Curitiba'])
    after_run: "One row, for Curitiba, with its average beside it. The city is now an ordinary column called city, so the brackets could ask it a question: is it Curitiba? Before reset_index the cities were only labels, and by_city['city'] would have failed. A table with two ordinary columns takes anything you know how to do to a table."
    note: "The real need, stated: an ordinary column can be asked a question, put in a list of columns, and merged on. The map says 'for when the next step needs them as one'. The step shows the next step. It is not claimed that a merge needs it (a merge can match on the labels too), and nothing here depends on that."

