lesson: pd-04
title: "Look things up in pandas"
strand: pd
stage: 1
thoughts:
  merge: "`orders.merge(restaurants, on='restaurant_id')` sticks each order's restaurant on the end of its row."
  pile-by-merged: "A column that came from the other table can make the piles."
  only-matches-survive: "Rows with no partner drop out of a merge. Cancelled orders have no delivery, so they are gone."
  names-back-as-column: "`.reset_index()` turns the pile names back into an ordinary column, for when the next step needs them as one."
  several-summaries: {text: "`.agg(['mean', 'count'])` says several things about each pile at once.", grade: shape}
steps:
  # 1
  - kind: "cold-check"
    requires: ["count-rows", "from-table", "piles", "one-row-per-pile", "pile-name", "commas", "join", "join-on", "whose-column", "short-names", "pile-by-looked-up"]
    any_column_order: true
    text: "The orders table has no city. How many orders did the restaurants of each city get? Show each city with its count."
    model: "SELECT r.city, COUNT(*) FROM orders o JOIN restaurants r ON o.restaurant_id = r.restaurant_id GROUP BY r.city"
    rows: 4
    result: [["Belo Horizonte", 1494], ["Curitiba", 639], ["Rio de Janeiro", 1375], ["São Paulo", 2492]]
    after_run: "That one is SQL, from a while back: stick the restaurant on each order, then make piles by its city. Today the same two movements, in Python."
    note: "Opening cold check from SQL-4, on a combination never practised (SQL-4 asked for an average, not a count). It is SQL on purpose: PD-4 writes the same sentence in step 4. Never scored."

  # 2
  - kind: "give"
    lang: "python"
    new: ["merge"]
    text: |-
      The orders table holds a restaurant's number and nothing else about it. The city lives in the restaurants table. In SQL, JOIN stuck the restaurant onto each order. Pandas calls it merge, and it is said in the order you think it: the table you start from, the table to stick on, and the column they share, after the word on:

      ```python
      import pandas as pd
      orders = pd.read_csv('orders.csv')
      restaurants = pd.read_csv('restaurants.csv')
      joined = orders.merge(restaurants, on='restaurant_id')
      print(joined[['order_id', 'restaurant_id', 'city', 'cuisine']].head(3))
      ```

      Run it.
    shows:
      - |-
        import pandas as pd
        orders = pd.read_csv('orders.csv')
        restaurants = pd.read_csv('restaurants.csv')
        joined = orders.merge(restaurants, on='restaurant_id')
        print(joined[['order_id', 'restaurant_id', 'city', 'cuisine']].head(3))
    after_run: "Each order now has its restaurant's city and cuisine at the end of its row. The word on says which column is the same in both tables, as ON did in SQL, and it appears only once in what came out. We gave the result a name, joined, and then did something with it: name what came out, then do something with it. The table went in twice and one table came out."
    note: "Imports JOIN and ON from SQL-4, and name-the-result from PD-1, said aloud. Both the tables are read at the top of the script, as the owner decided. The learner has been asked to take a list of columns since PD-3 step 5, so the four-column print is owned."

