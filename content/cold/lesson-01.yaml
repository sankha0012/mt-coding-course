lesson: cold-a
title: "Cold sitting A: a table you have never seen"
strand: cold
stage: 1
steps:
  # 1
  - kind: "give"
    text: |-
      This sitting is on real data you have never seen: orders from a Brazilian online marketplace, from 2016 to 2018. It is the Olist public dataset, and there are nine tables in it. You will meet some of them below, and each question names the table and the columns it needs.

      The first thing anyone does with a table they have not met is look at it. The panel at the bottom of the page, "Try your own code", is there for that, and it only ever reads. Use it whenever you like.

      Nothing here is timed or scored. It only shows us where to go back.
    note: "Cold sitting A. Real data, never seen by the learner (decision C17). The Olist dataset is licensed CC BY-NC-SA 4.0, so it is credited here and its files stay out of git."

  # 2
  - kind: "cold-check"
    data: "real/olist"
    requires: ["count-rows", "from-table", "piles", "one-row-per-pile", "pile-name", "commas", "sort", "sort-direction", "sort-by-summary"]
    ordered: true
    any_column_order: true
    text: "The table olist_orders_dataset has one row per order, and its order_status column says how far the order got. Show each status with how many orders have it, the biggest number first."
    model: "SELECT order_status, COUNT(*) FROM olist_orders_dataset GROUP BY order_status ORDER BY COUNT(*) DESC"
    rows: 8
    note: "Piles, a count, a sort by the count: the SQL-1 and SQL-2 sentence on a table never seen."

  # 3
  - kind: "cold-check"
    data: "real/olist"
    requires: ["count-rows", "from-table", "piles", "one-row-per-pile", "pile-name", "commas", "keep-piles", "rows-or-piles"]
    any_column_order: true
    text: "The table olist_order_payments_dataset has one row per payment, with a payment_type column. Show each payment type with how many payments it has, but only the types with more than 1000 payments."
    model: "SELECT payment_type, COUNT(*) FROM olist_order_payments_dataset GROUP BY payment_type HAVING COUNT(*) > 1000"
    rows: 4
    result: [["boleto", 19784], ["credit_card", 76795], ["debit_card", 1529], ["voucher", 5775]]
    note: "Keeping piles. A fifth type, not_defined, has three payments, so the question really does drop one."

  # 4
  - kind: "cold-check"
    data: "real/olist"
    requires: ["from-table", "summary-column", "piles", "pile-name", "commas", "join", "join-on", "whose-column", "short-names", "pile-by-looked-up"]
    any_column_order: true
    text: "The table olist_order_items_dataset has one row for each item bought, with a seller_id and a price. The table olist_sellers_dataset says, for each seller_id, the seller_state. Show each seller state with the average price of the items sold from it."
    model: "SELECT s.seller_state, AVG(i.price) FROM olist_order_items_dataset i JOIN olist_sellers_dataset s ON i.seller_id = s.seller_id GROUP BY s.seller_state"
    rows: 23
    note: "A join, then piles by a column that came from the other table, with short names."

  # 5
  - kind: "cold-check"
    lang: "python"
    data: "real/olist"
    requires: ["list", "for-each", "block", "dict", "set-by-name", "get-with-default", "update-the-pile", "go-through-dict", "sorted", "show"]
    text: "Here are ten review scores: 5, 4, 5, 1, 3, 5, 4, 4, 1, 5. In Python, count how many of each there are, and print each score with its count on its own line, the smallest score first."
    start: "scores = [5, 4, 5, 1, 3, 5, 4, 4, 1, 5]"
    model: |-
      scores = [5, 4, 5, 1, 3, 5, 4, 4, 1, 5]
      counts = {}
      for s in scores:
          counts[s] = counts.get(s, 0) + 1
      for s in sorted(counts):
          print(s, counts[s])
    output: |-
      1 2
      3 1
      4 3
      5 4
    note: "Piles by hand: GROUP BY and COUNT, written out. No file is read, because the scores are in the question."

  # 6
  - kind: "cold-check"
    lang: "python"
    data: "real/olist"
    requires: ["bring-pandas-in", "read-a-table", "column", "yes-no-column", "brackets-keep-yes", "how-many", "show"]
    text: "In pandas: read olist_orders_dataset.csv and print how many orders have the order_status 'delivered'."
    model: |-
      import pandas as pd
      orders = pd.read_csv('olist_orders_dataset.csv')
      print(len(orders[orders['order_status'] == 'delivered']))
    output: "96478"
    note: "Reading the file, asking every row, keeping the yes rows. It is SQL-1's count, as in the first lesson."

  # 7
  - kind: "cold-check"
    lang: "python"
    data: "real/olist"
    requires: ["bring-pandas-in", "read-a-table", "merge", "pile-by-merged", "groupby", "size", "sort-values", "look-at-rows", "for-each", "two-names", "show"]
    text: "In pandas: olist_orders_dataset.csv has an order for each customer_id, and olist_customers_dataset.csv says, for each customer_id, the customer_state. Print the three states with the most orders, one per line, the state and its number of orders, the biggest first."
    model: |-
      import pandas as pd
      orders = pd.read_csv('olist_orders_dataset.csv')
      customers = pd.read_csv('olist_customers_dataset.csv')
      top = orders.merge(customers, on='customer_id').groupby('customer_state').size().sort_values(ascending=False).head(3)
      for state, n in top.items():
          print(state, n)
    output: |-
      SP 41746
      RJ 12852
      MG 11635
    accepts:
      - |-
        import pandas as pd
        orders = pd.read_csv('olist_orders_dataset.csv')
        customers = pd.read_csv('olist_customers_dataset.csv')
        print(orders.merge(customers, on='customer_id').groupby('customer_state').size().sort_values(ascending=False).head(3))
    after_run: "That's the sitting. We pick up from here next time."
    note: "A merge, piles by a column from the other table, a sort and a cut, in thinking order. Printing the Series as it is also counts."
