lesson: cold-b
title: "Cold sitting B: the same marketplace, harder questions"
strand: cold
stage: 1
steps:
  # 1
  - kind: "give"
    text: |-
      The second sitting is on the same marketplace data. Some questions need a window function, some a function you write, some a model. Each question names its tables and columns.

      The panel at the bottom of the page is still there for looking. Nothing is timed or scored.
    note: "Cold sitting B. Same Olist data as sitting A, credited the same way."

  # 2
  - kind: "cold-check"
    data: "real/olist"
    requires: ["count-rows", "from-table", "join", "join-on", "short-names", "name-a-table", "name-a-result", "number-inside-pile", "latest-is-number-one", "beside-comes-late", "keep-rows", "compare-signs"]
    text: "Each real person in olist_customers_dataset has a customer_unique_id, and may have several customer_id values, one for each order they made. Join olist_orders_dataset to that table on customer_id, keep only each person's latest order by order_purchase_timestamp, and count how many rows that leaves."
    model: "WITH ranked AS (SELECT c.customer_unique_id, o.order_id, ROW_NUMBER() OVER (PARTITION BY c.customer_unique_id ORDER BY o.order_purchase_timestamp DESC) AS rn FROM olist_orders_dataset o JOIN olist_customers_dataset c ON o.customer_id = c.customer_id) SELECT COUNT(*) FROM ranked WHERE rn = 1"
    rows: 1
    result: [[96096]]
    note: "The latest row per person, which is a top-one-per-pile. A count of rows does not depend on the 290 customer and timestamp pairs that tie."

  # 3
  - kind: "cold-check"
    data: "real/olist"
    requires: ["count-rows", "from-table", "join-on", "short-names", "keep-all-of-first", "empty-side", "keep-the-empties", "keep-rows"]
    text: "How many orders in olist_orders_dataset have no row at all in olist_order_items_dataset? Match them on order_id."
    model: "SELECT COUNT(*) FROM olist_orders_dataset o LEFT JOIN olist_order_items_dataset i ON o.order_id = i.order_id WHERE i.order_id IS NULL"
    rows: 1
    result: [[775]]
    note: "Rows with no match, found in the wild."

  # 4
  - kind: "cold-check"
    data: "real/olist"
    requires: ["count-rows", "from-table", "piles", "one-row-per-pile", "pile-name", "commas", "name-a-table", "name-a-result", "pile-by-computed", "date-to-month", "previous-row", "column-arithmetic"]
    supplies: ["strftime('%Y-%m', order_purchase_timestamp)"]
    ordered: true
    any_column_order: true
    text: "For each month of order_purchase_timestamp in olist_orders_dataset, show the month, the number of orders, and the change in that number since the month before, in order of month. You would look up how to cut a timestamp down to its month: in SQLite it is strftime('%Y-%m', order_purchase_timestamp)."
    model: "WITH monthly AS (SELECT strftime('%Y-%m', order_purchase_timestamp) AS month, COUNT(*) AS n FROM olist_orders_dataset GROUP BY month) SELECT month, n, n - LAG(n) OVER (ORDER BY month) AS change FROM monthly"
    rows: 25
    note: "Pass-bar task 6, on 25 real months. The date spelling is shape grade, so the question supplies it."

  # 5
  - kind: "cold-check"
    data: "real/olist"
    requires: ["count-rows", "from-table", "piles", "one-row-per-pile", "pile-name", "commas", "name-a-table", "name-a-result", "one-number-from-a-query", "keep-rows", "compare-signs", "summary-column"]
    text: "How many sellers in olist_order_items_dataset sold more items than the average seller? Count the rows for each seller_id first, and compare each to the average of those counts."
    model: "WITH per_seller AS (SELECT seller_id, COUNT(*) AS n FROM olist_order_items_dataset GROUP BY seller_id) SELECT COUNT(*) FROM per_seller WHERE n > (SELECT AVG(n) FROM per_seller)"
    rows: 1
    result: [[594]]
    note: "A result queried again, and a number from a query."

  # 6
  - kind: "cold-check"
    lang: "python"
    data: "real/olist"
    requires: ["def", "what-goes-in", "what-comes-out", "call-it", "dict", "get-with-default", "pair", "dict-as-pairs", "key-function", "lambda", "tie-rule", "first-few"]
    text: "In Python, write a function top_k(items, k) that returns the k most common items, each as a pair of the item and its count, the most common first, and items with the same count in alphabetical order."
    check: |-
      print(top_k(['cama_mesa_banho', 'beleza_saude', 'cama_mesa_banho', 'esporte_lazer', 'beleza_saude', 'informatica_acessorios'], 2))
      print(top_k([], 3))
    model: |-
      def top_k(items, k):
          counts = {}
          for item in items:
              counts[item] = counts.get(item, 0) + 1
          return sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))[:k]
    output: |-
      [('beleza_saude', 2), ('cama_mesa_banho', 2)]
      []
    note: "Pass-bar task 7. The check includes the empty list and a tie, which a freezing learner forgets."

  # 7
  - kind: "cold-check"
    lang: "python"
    data: "real/olist"
    requires: ["def", "what-goes-in", "what-comes-out", "list-of-lists", "remember-previous", "compare-with-previous", "start-new-group", "close-last-group", "nothing", "empty-case"]
    text: "In Python, write a function sessions(times, gap) that takes minutes in order, such as 1, 5, 9, 50, 55, 120, and a gap, and returns a list of groups. A new group starts whenever the time since the one before is more than the gap."
    check: |-
      print(sessions([1, 5, 9, 50, 55, 120], 30))
      print(sessions([], 30))
    model: |-
      def sessions(times, gap):
          groups = []
          current = []
          previous = None
          for t in times:
              if previous is not None and t - previous > gap:
                  groups.append(current)
                  current = []
              current.append(t)
              previous = t
          if len(current) > 0:
              groups.append(current)
          return groups
    output: |-
      [[1, 5, 9], [50, 55], [120]]
      []
    note: "Pass-bar task 11. Forgetting to put away the last group is the classic slip."

  # 8
  - kind: "cold-check"
    lang: "python"
    data: "real/olist"
    requires: ["bring-pandas-in", "read-a-table", "merge", "groupby", "sort-values", "latest-in-pandas", "how-many", "show"]
    text: "In pandas: using olist_orders_dataset.csv and olist_customers_dataset.csv, which share customer_id, keep each real person's latest order by order_purchase_timestamp (a person is a customer_unique_id), and print how many rows that is."
    model: |-
      import pandas as pd
      orders = pd.read_csv('olist_orders_dataset.csv')
      customers = pd.read_csv('olist_customers_dataset.csv')
      latest = orders.merge(customers, on='customer_id').sort_values('order_purchase_timestamp').groupby('customer_unique_id').tail(1)
      print(len(latest))
    output: "96096"
    note: "The same question as the SQL one above, in pandas: the answer is the same 96,096."

  # 9
  - kind: "cold-check"
    lang: "python"
    data: "real/olist"
    requires: ["bring-pandas-in", "read-a-table", "merge", "groupby", "list-of-columns", "names-back-as-column", "find-missing", "yes-no-as-column", "features-and-target", "hold-rows-back", "make-fit-predict", "probabilities", "score", "ml-imports"]
    supplies: ["from sklearn.linear_model import LogisticRegression", "from sklearn.metrics import roc_auc_score", "from sklearn.model_selection import train_test_split"]
    text: "In pandas and scikit-learn: add up price and freight_value for each order in olist_order_items_dataset.csv, join those totals to olist_orders_dataset.csv, keep the delivered orders that have an order_delivered_customer_date, and predict whether an order arrived after its order_estimated_delivery_date. Use price and freight_value as the features, a logistic regression, and train_test_split with test_size=0.2 and random_state=0. Print the AUC on the held-back rows, rounded to 3 places, then on a second line the number of rows you used and the share that were late, rounded to 3 places. The imports are the part everyone looks up: from sklearn.linear_model import LogisticRegression, from sklearn.metrics import roc_auc_score, from sklearn.model_selection import train_test_split."
    model: |-
      import pandas as pd
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import roc_auc_score
      from sklearn.model_selection import train_test_split
      orders = pd.read_csv('olist_orders_dataset.csv')
      items = pd.read_csv('olist_order_items_dataset.csv')
      totals = items.groupby('order_id')[['price', 'freight_value']].sum().reset_index()
      data = orders.merge(totals, on='order_id')
      data = data[data['order_status'] == 'delivered'].dropna(subset=['order_delivered_customer_date'])
      y = data['order_delivered_customer_date'] > data['order_estimated_delivery_date']
      X = data[['price', 'freight_value']]
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)
      model = LogisticRegression()
      model.fit(X_train, y_train)
      print(round(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]), 3))
      print(len(data), round(y.mean(), 3))
    output: |-
      0.55
      96470 0.081
    after_run: "That's the sitting. We pick up from here next time."
    note: "Pass-bar task 15 on real data, worked out end to end. The score is humbling, 0.55, which is true of price and freight as predictors of lateness. Late is only 8.1 percent here, so the metric question from ML-2 is real."
