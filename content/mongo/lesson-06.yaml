        - "A 1 for each late order and a 0 for the others, summed in each pile."
      note: "Return for step 13. Other pile, a dotted name."
    note: "Ana makes the slip before the learner could: `$sum` of true and false gives 0, quietly, because `$sum` skips what is not a number (this was run: 0 for all three piles). `$cond` is an if with a real reason, and the order of its two values is said in the same breath (first for true, second for false). The echo of SQL-9's conditional count is said aloud, not required."

