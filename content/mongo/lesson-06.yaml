lesson: mg-06
title: "Top of each pile, dates, and changing things"
strand: mongo
stage: 2
thoughts:
  first-in-pile: "Sort first, then group: `$first` takes each pile's first document, so after a sort it is the newest, or the biggest. The sort stage comes before the piles are made."
  mongo-top-n-per-pile: {text: "`{$topN: {n: 2, sortBy: {subtotal: -1}, output: \"$subtotal\"}}` keeps the best few of each pile, in one stage. This one you would look up.", grade: shape}
  mongo-date-to-month: {text: "A date cut down to its month: `{$dateToString: {format: \"%Y-%m\", date: \"$created_at\"}}`. This one you would look up.", grade: shape}
  comparison-in-a-stage: "Inside a stage, a comparison is written as a list of the two things: `{$gt: [\"$actual_minutes\", \"$promised_minutes\"]}` gives true or false for each document."
  conditional-sum: "`{$cond: [question, 1, 0]}` gives 1 where the question is true and 0 where it is not, and `$sum` of that counts."
  update-one: {text: "`updateOne({_id: 100001}, {$set: {status: \"cancelled\"}})` changes a field of one document and reports how many it found and changed. This one you would look up.", grade: shape}
  upsert-index-explain: {text: "Names only: an `upsert` inserts when nothing matches, an index makes a question faster, and `explain` shows how a question was answered.", grade: name-only}
steps:
  # 1
  - kind: "cold-check"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "lookup-stage", "lookup-gives-a-list", "mongo-pile-by-looked-up"]
    supplies: ["{$lookup: {from: \"couriers\", localField: \"courier_id\", foreignField: \"_id\", as: \"courier\"}}"]
    text: "Show each courier `vehicle` with the number of delivered orders carried by couriers with that vehicle. An order's `courier_id` is the `_id` of its courier. The lookup is one to look up: `{$lookup: {from: \"couriers\", localField: \"courier_id\", foreignField: \"_id\", as: \"courier\"}}`."
    model: |-
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$lookup: {from: "couriers", localField: "courier_id", foreignField: "_id", as: "courier"}},
        {$unwind: "$courier"},
        {$group: {_id: "$courier.vehicle", n: {$sum: 1}}}
      ])
    rows: 3
    result: [["bike", 2038], ["carro", 488], ["moto", 3075]]
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from MG-5: a lookup, an unwind and a pile named by a looked-up field, on couriers and not restaurants as in MG-5's closing sentence. The lookup is a shape thought, so the text carries its spelling and `supplies` lists it. Every delivered order has a courier (the 399 without one are the cancelled ones). Never scored."

  # 2
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["first-in-pile"]
    text: |-
      Now the questions interviewers love. The first: which order is the biggest of each restaurant? A pile collects its documents in the order they reach it, and `$first` is a summary, like `$sum`, that takes the first document to arrive. So the sort goes before the piles are made, with the biggest subtotal at the top, and the first of each pile is its biggest:

      ```js
      db.orders.aggregate([
        {$sort: {subtotal: -1}},
        {$group: {_id: "$restaurant_id", order: {$first: "$_id"}, subtotal: {$first: "$subtotal"}}}
      ])
      ```

      Run it.
    shows:
      - |-
        db.orders.aggregate([
          {$sort: {subtotal: -1}},
          {$group: {_id: "$restaurant_id", order: {$first: "$_id"}, subtotal: {$first: "$subtotal"}}}
        ])
    after_run: "Sixty documents, one for each restaurant. Restaurant 33's biggest order is 102270, with a subtotal of 158.5. The sort stage had to come first, because stages happen in the order they are written, so the documents reached the piles already in order. SQL has this idea too, the first row of each pile, in the interview part of its course. If you have met it, this is the same thought in a new spelling. If you have not, nothing here needs it."
    note: "`first-in-pile`. The reason is the one the learner already has: stages happen in the order written. `$first` is introduced as one more summary beside `$sum` (`group-summaries`). The SQL echo is said aloud and required nowhere. Restaurant 33 gives 102270 at 158.5, from a real run."

  # 3
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "sort-and-limit-stages", "sort-spelling", "first-in-pile", "keep-before-piles"]
    text: "Among the delivered orders, show each `restaurant_id` with the `_id` of its earliest order, the one with the smallest `created_at`."
    thinking_order: "From orders, keep the delivered ones, sort them with the oldest first, make a pile for each restaurant, and from each pile take the first `_id`."
    model: |-
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$sort: {created_at: 1}},
        {$group: {_id: "$restaurant_id", first: {$first: "$_id"}}}
      ])
    rows: 60
    narration:
      - "Sixty restaurants, each with its earliest delivered order. Keep, sort, pile, and `$first` takes the top of each pile."
      - "Oldest first came from the sort, and the sort came before the piles because that is when it has to happen."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$restaurant_id", first: {$first: "$_id"}}}
          ])
        ask: "Which order reaches each pile first when nobody has put the orders in order?"
        why: "a pile keeps its documents in the order they arrived, so without a sort `$first` takes whichever came first."
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$sort: {created_at: -1}},
            {$group: {_id: "$restaurant_id", first: {$first: "$_id"}}}
          ])
        ask: "Look at the sort direction. Which end of the sort puts the oldest order at the top?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$restaurant_id", first: {$first: "$_id"}}},
            {$sort: {created_at: 1}}
          ])
        ask: "The sort is there, but is it there before the piles are made, or after? Which stage decides what arrives first in a pile?"
    walk:
      - "From orders, keep only the delivered ones."
      - "Sort them with the oldest first. A `1` puts the smallest first."
      - "Now make a pile for each `restaurant_id`, and from each pile take the first `_id` with `$first`."
    return:
      text: "Among the delivered orders, show each `courier_id` with the `_id` of its latest order, the one with the largest `created_at`."
      model: |-
        db.orders.aggregate([
          {$match: {status: "delivered"}},
          {$sort: {created_at: -1}},
          {$group: {_id: "$courier_id", last: {$first: "$_id"}}}
        ])
      rows: 200
      narration:
        - "Two hundred couriers, each with the order they delivered last. Sort first, newest at the top, then `$first` of each pile."
        - "Newest first this time, and a pile for each courier. The sort still came before the piles."
      note: "Return for step 3. Other pile, other end of the sort. No courier has two orders at the same minute."
    note: "First typed `$first`. The prompt says which end of the sort. The delivered orders all have a `courier_id`, so the courier return has no null pile. No restaurant has two orders at the same minute, so the answer is the same on every run."

  # 4
  - kind: "classmate"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "sort-and-limit-stages", "sort-spelling", "first-in-pile"]
    text: |-
      Davi was asked: for each `customer_id`, show the `_id` of that customer's order with the biggest `subtotal`. He remembered `$first`, and he wrote this:

      ```js
      db.orders.aggregate([
        {$group: {_id: "$customer_id", order: {$first: "$_id"}}}
      ])
      ```

      It runs without a word of complaint, and 1,475 documents come back, one for each customer. Davi, is each of those orders the customer's biggest? ... He has no way to know, and neither do we. A pile keeps its documents in the order they arrived, nobody put them in order, so `$first` took whichever came first. It is `LIMIT` with no `ORDER BY` again: you get something, and nothing says which. What should he have written?
    model: |-
      db.orders.aggregate([
        {$sort: {subtotal: -1}},
        {$group: {_id: "$customer_id", order: {$first: "$_id"}}}
      ])
    rows: 1475
    shows:
      - |-
        db.orders.aggregate([
          {$group: {_id: "$customer_id", order: {$first: "$_id"}}}
        ])
    narration:
      - "1,475 documents again, and this time each order is the customer's biggest. One stage went in, in front of the piles."
      - "The sort goes first, biggest subtotal at the top, and then each pile's first is its biggest."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$sort: {subtotal: 1}},
            {$group: {_id: "$customer_id", order: {$first: "$_id"}}}
          ])
        ask: "The sort is there now. Which end of it puts the biggest subtotal at the top?"
      - code: |-
          db.orders.aggregate([
            {$group: {_id: "$customer_id", order: {$first: "$_id"}}},
            {$sort: {subtotal: -1}}
          ])
        ask: "The sort is there, but is it before the piles are made, or after them?"
      - code: |-
          db.orders.aggregate([
            {$sort: {_id: -1}},
            {$group: {_id: "$customer_id", order: {$first: "$_id"}}}
          ])
        ask: "That puts the highest order number first. Is the highest order number the biggest order? Which field holds the size?"
    walk:
      - "Davi's group stage is right. What has to happen to the orders before they reach it, so that the biggest of each customer arrives first?"
      - "Put a stage in front that sorts by `subtotal`, with the biggest first."
    return:
      text: "Show each `restaurant_id` with the `_id` of its order with the smallest `created_at`, among all the orders."
      model: |-
        db.orders.aggregate([
          {$sort: {created_at: 1}},
          {$group: {_id: "$restaurant_id", first: {$first: "$_id"}}}
        ])
      rows: 60
      narration:
        - "Sixty restaurants, each with its oldest order. Oldest first from the sort, then the first of each pile."
        - "The sort goes in front of the piles, with the smallest time first."
      note: "Return for step 4. No restaurant has two orders at the same minute."
    note: "Davi makes the slip before the learner could (rule E6): the same trap as LIMIT without ORDER BY. The broken sentence runs without error, so it is shown (`shows`) and not marked `broken`. It gives for most customers an order that is not their biggest, but the teacher names no number, because without a sort the order a pile sees is not promised. No customer has two orders with the same top subtotal, and none has only orders without one, so the model is the same on every run."

  # 5
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["mongo-top-n-per-pile"]
    text: |-
      `$first` takes one document from each pile. Often you want the best few. For that there is a summary that does the sorting and the taking inside the pile, so no sort stage is needed in front: `$topN`. It is one to look up. It is spelled `{$topN: {n: 2, sortBy: {subtotal: -1}, output: "$subtotal"}}`. The `n` is how many to keep, the `sortBy` is the sort, and the `output` is what to keep from each document. Here are the two biggest subtotals of each restaurant:

      ```js
      db.orders.aggregate([
        {$group: {_id: "$restaurant_id", best: {$topN: {n: 2, sortBy: {subtotal: -1}, output: "$subtotal"}}}}
      ])
      ```

      Run it.
    shows:
      - |-
        db.orders.aggregate([
          {$group: {_id: "$restaurant_id", best: {$topN: {n: 2, sortBy: {subtotal: -1}, output: "$subtotal"}}}}
        ])
    after_run: "Sixty documents again, and each holds a list of two numbers. Restaurant 1 has 158.13 and 154.34. The sort and the taking happened inside each pile, which is why there is no sort stage. It is the same idea as the sort and `$first`, for the best few and not only the best one. The spelling is exactly as written, and it is one to look up."
    note: "`mongo-top-n-per-pile`, shape grade: the spelling is supplied every time and the teacher says it is one to look up. Restaurant 1 gives 158.13 and 154.34, as in the map."

  # 6
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "mongo-top-n-per-pile"]
    supplies: ["{$topN: {n: 3, sortBy: {created_at: -1}, output: \"$created_at\"}}"]
    text: "Among the delivered orders, show each `courier_id` with the `created_at` of its 3 latest orders. The summary is one to look up: `{$topN: {n: 3, sortBy: {created_at: -1}, output: \"$created_at\"}}`."
    thinking_order: "From orders, keep the delivered ones, make a pile for each courier, and in each pile keep the 3 largest `created_at`."
    model: |-
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$group: {_id: "$courier_id", latest: {$topN: {n: 3, sortBy: {created_at: -1}, output: "$created_at"}}}}
      ])
    rows: 200
    narration:
      - "Two hundred couriers, each with a list of their last three delivery times. The sorting happened inside the pile."
      - "Keep the delivered orders, a pile for each courier, and `$topN` keeps the three newest times of each."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$group: {_id: "$courier_id", latest: {$topN: {n: 3, sortBy: {created_at: -1}, output: "$created_at"}}}}
          ])
        ask: "You have 201 piles. One has no name at all. Which orders have no `courier_id`, and how do we leave them out?"
        why: "the cancelled orders were never carried by anyone, so they have no courier, and they make a pile of their own."
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$courier_id", latest: {$topN: {n: 3, sortBy: {created_at: 1}, output: "$created_at"}}}}
          ])
        ask: "Which end of the sort puts the latest time first?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$courier_id", latest: {$topN: {n: 3, sortBy: {created_at: -1}, output: "$_id"}}}}
          ])
        ask: "Those are the order numbers. What did I ask you to show of each order?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$courier_id", latest: {$topN: {n: 2, sortBy: {created_at: -1}, output: "$created_at"}}}}
          ])
        ask: "How many times did I ask for in each pile?"
    walk:
      - "Keep only the delivered orders, and make a pile for each `courier_id`."
      - "Beside the pile's name, add the summary with `n` as 3, sorted by `created_at` with the latest first, keeping `$created_at`."
    return:
      text: "Show each `restaurant_id` with the `created_at` of its 2 earliest orders, among all the orders. The summary is one to look up: `{$topN: {n: 2, sortBy: {created_at: 1}, output: \"$created_at\"}}`."
      model: |-
        db.orders.aggregate([
          {$group: {_id: "$restaurant_id", earliest: {$topN: {n: 2, sortBy: {created_at: 1}, output: "$created_at"}}}}
        ])
      rows: 60
      narration:
        - "Sixty restaurants, each with its two oldest times. `n` is 2 and the sort puts the smallest first."
        - "A list of two times in each pile, with no sort stage in front."
      note: "Return for step 6. Other pile, other sort direction, no match."
    note: "First typed `$topN`. The text carries the exact spelling and `supplies` lists it. Only times are shown, so a tie between two orders at the same minute could not change the answer (there is none)."

  # 7
  - kind: "aside"
    lang: "mongo"
    data: "mongo"
    text: "Something to carry into the interview room, with nothing to memorise. The top few overall is easy: sort, then cut. The top few in each group is the one people slip on, in any language, because the sort has to happen before the piles, or inside them. You have written it two ways now, and in both the sort was there. If you ever leave it out, you will not get an error. You will get a plausible answer, as Davi did."
    note: "Relief after two thoughts, and the real reason the question is asked in interviews. Offered as interesting, not as a rule."

  # 8
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["mongo-date-to-month"]
    text: |-
      Now time. The field `created_at` holds a date and a time, so a pile named by it would be a pile for every minute. To pile by month, cut the date down to its month. This one you would look up. It is spelled `{$dateToString: {format: "%Y-%m", date: "$created_at"}}`: `%Y` is the year with four digits and `%m` is the month with two. It goes where a pile's name goes, in `_id`, because a pile's name can be worked out and not only copied from a field:

      ```js
      db.orders.aggregate([
        {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, n: {$sum: 1}}}
      ])
      ```

      Run it.
    shows:
      - |-
        db.orders.aggregate([
          {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, n: {$sum: 1}}}
        ])
    after_run: "Three piles: 2026-08 with 2,068 orders, 2026-09 with 1,946 and 2026-10 with 1,986. The name of each pile is text, with the year first and the month after it, and that is why the names sort in date order as text. SQL cut a date down to its month too, with its own spelling. If you have met that, this is the same thought again."
    note: "`mongo-date-to-month`, shape grade. It also shows that a pile's name can be an expression, which the next give uses again for a comparison. The echo of SQL-9's month is said aloud, not required."

  # 9
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "sort-and-limit-stages", "sort-spelling", "mongo-date-to-month"]
    supplies: ["{$dateToString: {format: \"%Y-%m\", date: \"$created_at\"}}"]
    ordered: true
    text: "Among the delivered orders, show each month of `created_at` with the average `subtotal` of that month's orders, the earliest month first. The month is one to look up: `{$dateToString: {format: \"%Y-%m\", date: \"$created_at\"}}`."
    thinking_order: "From orders, keep the delivered ones, make a pile for each month of `created_at`, say the average `subtotal` of each, and sort the piles by their name, the smallest first."
    model: |-
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, avg: {$avg: "$subtotal"}}},
        {$sort: {_id: 1}}
      ])
    rows: 3
    result: [["2026-08", 60.16], ["2026-09", 60.76], ["2026-10", 60.39]]
    narration:
      - "Three months, in date order, each with its average subtotal. The pile's name was worked out from the date."
      - "Keep, pile by month, average, then sort the piles by their name. The text sorts in date order because the year comes first."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, avg: {$avg: "$subtotal"}}},
            {$sort: {_id: -1}}
          ])
        ask: "Which month is at the top? Which direction puts the earliest first?"
      - code: |-
          db.orders.aggregate([
            {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, avg: {$avg: "$subtotal"}}},
            {$sort: {_id: 1}}
          ])
        ask: "Those averages are of all the orders. Which orders did I ask about?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: {$dateToString: {format: "%Y", date: "$created_at"}}, avg: {$avg: "$subtotal"}}},
            {$sort: {_id: 1}}
          ])
        ask: "How many piles came out? Which letters of the format say the month?"
    walk:
      - "Keep only the delivered orders."
      - "Make a pile for each month of `created_at`, and say the average `subtotal` of each."
      - "Sort the piles by their name, with the smallest first."
    return:
      text: "Among the cancelled orders, show each month of `created_at` with how many cancelled orders it had, the earliest month first. The month is one to look up: `{$dateToString: {format: \"%Y-%m\", date: \"$created_at\"}}`."
      model: |-
        db.orders.aggregate([
          {$match: {status: "cancelled"}},
          {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, n: {$sum: 1}}},
          {$sort: {_id: 1}}
        ])
      ordered: true
      rows: 3
      result: [["2026-08", 139], ["2026-09", 133], ["2026-10", 127]]
      narration:
        - "139, 133 and 127 cancelled orders, month by month. A pile for each month, counted, in date order."
        - "Keep the cancelled orders, pile by month, count, sort the piles by name."
      note: "Return for step 9. Other match, other summary."
    note: "First typed month. Months have no ties, so the answer is judged in order. The averages are 60.1586, 60.7580 and 60.3861, rounded to two places by the checker."

  # 10
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "sort-and-limit-stages", "sort-spelling", "first-in-pile", "mongo-date-to-month"]
    supplies: ["{$dateToString: {format: \"%Y-%m\", date: \"$created_at\"}}"]
    text: "Among the delivered orders, show each month of `created_at` with the `_id` of that month's order with the biggest `subtotal`. The month is one to look up: `{$dateToString: {format: \"%Y-%m\", date: \"$created_at\"}}`."
    thinking_order: "From orders, keep the delivered ones, sort them with the biggest subtotal first, make a pile for each month, and from each pile take the first `_id`."
    model: |-
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$sort: {subtotal: -1}},
        {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, biggest: {$first: "$_id"}}}
      ])
    rows: 3
    result: [["2026-08", 105080], ["2026-09", 104550], ["2026-10", 101347]]
    narration:
      - "Three months, each with its biggest order: 105080, 104550 and 101347. The sort came first, then the piles by month, then `$first`."
      - "The two thoughts met in one sentence: a pile named by a month, and the first of each pile after a sort."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, biggest: {$first: "$_id"}}}
          ])
        ask: "Which order reaches each pile first when nobody has sorted the orders?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$sort: {subtotal: 1}},
            {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, biggest: {$first: "$_id"}}}
          ])
        ask: "Which end of the sort puts the biggest subtotal at the top?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, biggest: {$first: "$_id"}}},
            {$sort: {subtotal: -1}}
          ])
        ask: "Is your sort before the piles are made, or after them?"
    walk:
      - "Keep the delivered orders, and sort them with the biggest subtotal first."
      - "Make a pile for each month of `created_at`, and from each pile take the first `_id`."
    return:
      text: "Among the delivered orders, show each month of `created_at` with the `_id` of that month's earliest order, the one with the smallest `created_at`. The month is one to look up: `{$dateToString: {format: \"%Y-%m\", date: \"$created_at\"}}`."
      model: |-
        db.orders.aggregate([
          {$match: {status: "delivered"}},
          {$sort: {created_at: 1}},
          {$group: {_id: {$dateToString: {format: "%Y-%m", date: "$created_at"}}, first: {$first: "$_id"}}}
        ])
      rows: 3
      result: [["2026-08", 104843], ["2026-09", 103587], ["2026-10", 102002]]
      narration:
        - "The first delivered order of each month: 104843, 103587 and 102002. Oldest first, then the piles by month."
        - "Sort in front, month as the pile's name, `$first` of each pile."
      note: "Return for step 10. Other sort field and direction."
    note: "Recombination: `first-in-pile` returns inside a pile named by a month. Both thoughts are used at once, so the load is high but nothing is new. No ties at the top of any month."

  # 11
  - kind: "give"
    lang: "mongo"
    data: "mongo"
