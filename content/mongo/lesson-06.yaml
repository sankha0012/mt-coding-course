  # 18
  - kind: "aside"
    lang: "mongo"
    data: "mongo"
    new: ["upsert-index-explain"]
    text: "Three names, to have heard them, and nothing to keep. The first is `upsert`. An update that finds nothing does nothing, as you saw. With `upsert` it creates the document instead: update it, or insert it if it is not there. The second is an index: a sorted list that MongoDB keeps beside a collection, so that a question about that field does not have to read all 6,000 orders. It makes a question faster and never changes its answer. The third is `explain`, which shows how MongoDB answered a question, whether it read everything or used an index. Interviewers like to ask what an index is, and when `explain` helps. That is all they are for today."
    note: "`upsert-index-explain`, name only: one aside, nothing asked, nothing required later. It is here because these three names are asked in interviews."

