  # 13
  - kind: "classmate"
    lang: "mongo"
    data: "mongo"
    new: ["conditional-sum"]
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "comparison-in-a-stage", "conditional-sum"]
    text: |-
      Ana was asked: for each `promised_minutes`, how many delivered orders were late, meaning `actual_minutes` above `promised_minutes`? She had just seen that a comparison gives true or false, and she thought: add them up. She wrote:

      ```js
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$group: {_id: "$promised_minutes", late: {$sum: {$gt: ["$actual_minutes", "$promised_minutes"]}}}}
      ])
      ```

      Every pile says 0, and there is no error. Ana, is `true` a number? ... No. `$sum` adds numbers and skips everything else, so it skipped all of them. What she needs is a 1 for each late order and a 0 for each of the others, because 1s add up to a count. That is `$cond`: an if, written as a list of three things. The question, what to give when it is true, and what to give when it is not: `{$cond: [question, 1, 0]}`. The question is the comparison. SQL called this the conditional count, if you have met it. What should she have written?
    model: |-
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$group: {_id: "$promised_minutes", late: {$sum: {$cond: [{$gt: ["$actual_minutes", "$promised_minutes"]}, 1, 0]}}}}
      ])
    rows: 3
    result: [[30, 788], [40, 804], [50, 794]]
    shows:
      - |-
        db.orders.aggregate([
          {$match: {status: "delivered"}},
          {$group: {_id: "$promised_minutes", late: {$sum: {$gt: ["$actual_minutes", "$promised_minutes"]}}}}
        ])
    narration:
      - "788, 804 and 794 late orders, one for each promised time. A 1 for each late order, a 0 for each of the others, and the sum counts the 1s."
      - "The comparison went inside `$cond` as the question, with 1 for true and 0 for false."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$promised_minutes", late: {$sum: {$cond: [{$gt: ["$actual_minutes", "$promised_minutes"]}, 0, 1]}}}}
          ])
        ask: "Which number is given when the question is true, the first or the second? Which orders did you give the 1 to?"
        why: "the first value is what the `$cond` gives when the question is true, the second when it is not."
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$promised_minutes", late: {$sum: {$cond: [{$lt: ["$actual_minutes", "$promised_minutes"]}, 1, 0]}}}}
          ])
        ask: "That counts the orders that were early. Which sign says late?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$promised_minutes", late: {$sum: {$gt: ["$actual_minutes", "$promised_minutes"]}}}}
          ])
        ask: "Is `true` a number? What does `$sum` do with something that is not a number?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$promised_minutes", late: {$sum: 1}}}
          ])
        ask: "That counts every order in the pile. Where does the question about late go?"
    walk:
      - "Keep the delivered orders, and make a pile for each `promised_minutes`, as Ana did."
      - "For `late`, sum a `$cond` whose question is the comparison, giving 1 when true and 0 when not."
    return:
      text: "Among the delivered orders, show each `delivery.bag_size` with how many orders were late, meaning `actual_minutes` above `promised_minutes`."
      model: |-
        db.orders.aggregate([
          {$match: {status: "delivered"}},
          {$group: {_id: "$delivery.bag_size", late: {$sum: {$cond: [{$gt: ["$actual_minutes", "$promised_minutes"]}, 1, 0]}}}}
        ])
      rows: 3
      result: [[1, 1246], [2, 923], [3, 217]]
      narration:
