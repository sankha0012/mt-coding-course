    text: |-
      So far the documents have come out in whatever order they lay. SQL put them in order with ORDER BY, after the keeping, and DESC for the biggest first. MongoDB chains a word after the find: `.sort(...)`, with a document inside the brackets that names the field to sort by and a number. Here are the orders with a subtotal above 190, the biggest first:

