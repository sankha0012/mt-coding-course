    after_run: "281.15 first, then 233.44, down to 191.24. The `-1` puts the biggest first, as DESC did. A `1` puts the smallest first, which is what SQL did when you said nothing. Why a number and not the words? This just is. Notice that the document looks like the one that chose fields, a name and a number, but here the number is a direction, not show or hide. And the sort works on what came out, after the keeping."
    note: "Echo of ORDER BY and DESC (SQL-2). `-1` and `1` have no reason beyond convention, which the text says. The likely confusion with the projection's 1 is addressed before it arises."

