    note: "The choice with a question, built from the pieces. The result includes the _id of each courier (it is a value and is judged). The prompt asks for 'each one's city', and the _id arriving beside it is what step 16 explains. It differs from step 14 in the question and the field."

  # 16
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["id-comes-unless-off"]
    requires: ["choose-fields", "choose-columns", "collection"]
    text: |-
      You have noticed what we promised to come back to. The _id keeps arriving beside the fields you chose, though you did not choose it. Every document has an _id, and it is how MongoDB tells the documents apart: it is what the CSV called order_id or restaurant_id. It comes along unless you turn it off. To turn it off you name it in the choice, with a 0 where the others have a 1:

      ```js
      db.restaurants.find({cuisine: "pizza"}, {name: 1, _id: 0})
      ```

      Run it.
    shows:
      - "db.restaurants.find({cuisine: \"pizza\"}, {name: 1, _id: 0})"
    after_run: "Just the names now, and no _id. A 1 means show this, and a 0 means hide this. _id is the one field that shows unless you say 0. This just is: there is no reason for it beyond MongoDB wanting every document to carry its id with it. You only have to say 0 when you do not want it."
    note: "This just is (rule B5, B6): no reason is invented. It is seen in step 2 and step 13, and named here. The only reason given is the true one: every document has an _id, which tells documents apart."

