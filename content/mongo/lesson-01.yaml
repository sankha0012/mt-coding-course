  # 21
  - kind: "recap"
    lang: "mongo"
    data: "mongo"
    text: |-
      Stop there. Today you met MongoDB: a collection is the table, a document is a row, and a question about the rows is a document of its own, with a comma where AND was. You counted, you chose what to show, and you met an _id that arrives whether you ask or not.

      You are not fast at this, and you are not meant to be. The aim today was to think each sentence out, and you have been doing that.

      Don't go over any of it before next time. One more question, cold, and then we stop.
    note: "States the limit (rule F2) and tells the learner not to revise (rule A3)."

