  # 10
  - kind: "aside"
    lang: "mongo"
    data: "mongo"
    text: "Does that sound familiar? In the SQL lesson on JOIN, the vehicles added up to 5,601 and not 6,000, because the 399 cancelled orders had no courier, and a JOIN keeps only the rows that find a partner. It is the same thing. A lookup followed by an unwind keeps only the documents that find a match, and a lookup by itself keeps them all, with an empty list where nothing matched. That is the kind of join I said was coming, the one that keeps the rows with no partner. When you do want the unwind and do not want to lose those orders, there is a word to put in it, `preserveNullAndEmptyArrays`. That one is for looking up, not for learning today."
    note: "Says aloud that this is SQL-4's dropped rows (6,000 became 5,601) again, and names the fix once as something to look up, as the map asks. It is not taught and no step asks for it."

