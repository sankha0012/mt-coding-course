lesson: mg-05
title: "Look things up in another collection"
strand: mongo
stage: 2
thoughts:
  lookup-stage: {text: "`$lookup` sticks the matching documents of another collection onto each document. It takes four names: `from`, `localField`, `foreignField` and `as`.", grade: shape}
  lookup-gives-a-list: "What `$lookup` sticks on is always a list, even when only one document matches, because it cannot know in advance how many will. `$unwind` turns the list into plain documents."
  mongo-pile-by-looked-up: "Once it is on the document, a field of the looked-up document can name the piles: `\"$restaurant.city\"`."
  lookup-keeps-unmatched: "A document with no match keeps an empty list, and `$unwind` throws that document away. Those are the rows `LEFT JOIN` kept."
  why-items-inside: {text: "Dishes sit inside the order because they belong to it alone. Restaurants live outside because many orders point to one.", grade: name-only}
steps:
  # 1
  - kind: "cold-check"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "unwind-stage", "group-after-unwind", "group-pile-name", "field-value", "group-summaries", "dotted-through-list"]
    text: "Show each dish name with the total of its `qty`, across the orders whose `restaurant_id` is 2."
    model: |-
      db.orders.aggregate([
        {$match: {restaurant_id: 2}},
        {$unwind: "$items"},
        {$group: {_id: "$items.name", qty: {$sum: "$items.qty"}}}
      ])
    rows: 5
    result: [["Quinoa", 47], ["Bowl de açaí", 49], ["Salada Caesar", 67], ["Suco verde", 69], ["Wrap de frango", 53]]
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from MG-4: match, unwind, pile by a dotted name, sum of a dotted name. Restaurant 2 has five dishes (49, 67, 69, 53, 47), no sort and no tie. Never scored."

  # 2
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["lookup-stage"]
    requires: ["pipeline-of-stages", "join", "join-on"]
    supplies: ["{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}"]
    text: |-
      Here is a question we cannot answer yet: how many orders came from each city? Look at an order. It holds a `restaurant_id` and no city. The city is a fact about the restaurant, and it lives in the `restaurants` collection, where each restaurant's `_id` is that same number. In SQL you looked it up with a JOIN.

      In MongoDB the stage is `$lookup`, and it sticks onto each order the documents of the other collection that match. It takes four names. `from` is the collection to look in. `localField` is the field of this order that holds the number. `foreignField` is the field of the other collection that must equal it, as `ON` said in SQL. `as` is the name the stuck-on part is given.

      This one you would look up. The thought is: stick the matching documents of another collection onto each one. Here it is spelled `{$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}}`. I will always write it out for you. A limit keeps just two orders on the screen:

      ```js
      db.orders.aggregate([
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$limit: 2}
      ])
      ```

      Run it.
    shows:
      - |-
        db.orders.aggregate([
          {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
          {$limit: 2}
        ])
    after_run: "Look at the end of each order. A new field called `restaurant` holds what the restaurants collection has for that order's restaurant_id: its name, city, cuisine and signup date. Two orders still, each one wider. A table went in, a wider table came out, as it did with JOIN."
    note: "MG-5 thought 1, shape grade: the spelling is supplied and the teacher says it is one to look up. Opens on the need (the city is not on the order), as SQL-4 did. The list is visible in the output but is named in the next step, so that one thought arrives at a time."

  # 3
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["lookup-gives-a-list"]
    requires: ["lookup-stage", "unwind-stage", "join", "join-on"]
    supplies: ["{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}"]
    text: |-
      Look again at the field `restaurant` on those orders. It sits inside square brackets: it is a list, with one document in it. Run these two sentences, one after the other. The second has an `$unwind` after the lookup, the stage you used on the dishes:

      ```js
      db.orders.aggregate([
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$limit: 1}
      ])
      ```

      ```js
      db.orders.aggregate([
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$unwind: "$restaurant"},
        {$limit: 1}
      ])
      ```

      Run them.
    shows:
      - |-
        db.orders.aggregate([
          {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
          {$limit: 1}
        ])
      - |-
        db.orders.aggregate([
          {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
          {$unwind: "$restaurant"},
          {$limit: 1}
        ])
    after_run: "In the first, `restaurant` is a list that holds one document. In the second, `$unwind` took the list apart, and `restaurant` is a plain document, so its fields are reached with a dot: `restaurant.city`. It was a list even though only one restaurant matches, because a lookup cannot know in advance how many documents it will find: none, one or many. So it always hands back a list. When you expect one, unwind it."
    note: "The part of $lookup that is core. The reason for the list is real (none, one or many cannot be known in advance), so nothing is left as a rule to remember. It is the same stage as MG-4's unwind, now taking a list of one apart."

  # 4
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "lookup-stage", "lookup-gives-a-list", "unwind-stage", "join", "join-on", "dotted-name"]
    supplies: ["{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}"]
    text: "The lookup is `{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}`, written out again, because it is a stage people look up. From `orders`, look up the restaurant of each order, unwind the `restaurant` list, keep the documents whose `restaurant.city` is \"Curitiba\", and make piles by the order's `restaurant_id`, with `n` counting the orders in each pile. Show each pile's `_id` and `n`."
    model: |-
      db.orders.aggregate([
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$unwind: "$restaurant"},
        {$match: {"restaurant.city": "Curitiba"}},
        {$group: {_id: "$restaurant_id", n: {$sum: 1}}}
      ])
    rows: 6
    result: [[24, 120], [12, 103], [3, 114], [6, 93], [32, 106], [23, 103]]
    narration:
      - "Six restaurants, from 93 orders to 120. Look up, unwind, keep, pile, count, in the order they happen."
      - "From orders, with the restaurant stuck on and taken out of its list, keeping the Curitiba ones, a pile for each restaurant_id."
      - "Six piles. The city question was asked of the looked-up document with a dot, as you asked about `delivery.rain`."
    wrong:
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$group: {_id: "$restaurant_id", n: {$sum: 1}}}
          ])
        ask: "Sixty piles came back. Which stage keeps only the Curitiba restaurants' orders?"
        why: "the lookup only attaches the restaurant. A question about it still needs its own match."
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$match: {"restaurant.city": "curitiba"}},
            {$group: {_id: "$restaurant_id", n: {$sum: 1}}}
          ])
        ask: "No piles came back at all. Is the city written in your sentence exactly as the data writes it?"
        why: "text inside quotes is matched letter for letter, capitals included."
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$match: {restaurant: {city: "Curitiba"}}},
            {$group: {_id: "$restaurant_id", n: {$sum: 1}}}
          ])
        ask: "No piles came back. How do you reach a field inside a field?"
        why: "a document inside a document is reached with a dotted name, in quotes."
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$match: {"restaurant.city": "Curitiba"}},
            {$group: {_id: "$restaurant.city", n: {$sum: 1}}}
          ])
        ask: "That is one pile for the whole city. Which field of the order tells one restaurant from another?"
    walk:
      - "From orders, look up the restaurant of each order and unwind the list."
      - "Keep only the documents whose restaurant.city is \"Curitiba\"."
      - "Make piles by the order's restaurant_id and count the orders in each."
    return:
      text: "From `orders`, look up the restaurant with `{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}`, unwind the `restaurant` list, keep the documents whose `restaurant.cuisine` is \"pizza\", and make piles by the order's `status`, with `n` counting the orders in each pile. Show each pile's `_id` and `n`."
      model: |-
        db.orders.aggregate([
          {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
          {$unwind: "$restaurant"},
          {$match: {"restaurant.cuisine": "pizza"}},
          {$group: {_id: "$status", n: {$sum: 1}}}
        ])
      rows: 2
      result: [["cancelled", 52], ["delivered", 793]]
      narration:
        - "Two piles, delivered and cancelled, of the orders that went to a pizza restaurant."
        - "Look up, unwind, keep by a looked-up field, then pile and count."
    note: "First typed lookup. The question about the looked-up document uses MG-2's dotted name. The pile is by the order's own restaurant_id so that pile-by-looked-up stays for the next step. Wrongs: no match, exact text, a whole-document match, a pile by city."

  # 5
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["mongo-pile-by-looked-up"]
    requires: ["lookup-stage", "lookup-gives-a-list", "unwind-stage", "group-pile-name", "field-value", "dotted-name", "pile-by-looked-up"]
    supplies: ["{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}"]
    text: |-
      Back to the question we started with: how many orders came from each city? The lookup has put the city on every order, inside `restaurant`, and you know how to reach a field inside a field: with a dot. A pile's name can be any value, so it can be that field. And, as in the pipeline lesson, a dollar sign inside quotes means the value of that field, so the name is `"$restaurant.city"`. In SQL this was the pile by a looked-up column. Here it is:

      ```js
      db.orders.aggregate([
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$unwind: "$restaurant"},
        {$group: {_id: "$restaurant.city", n: {$sum: 1}}}
      ])
      ```

      Run it.
    shows:
      - |-
        db.orders.aggregate([
          {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
          {$unwind: "$restaurant"},
          {$group: {_id: "$restaurant.city", n: {$sum: 1}}}
        ])
    after_run: "Four piles: São Paulo 2,492, Rio de Janeiro 1,375, Belo Horizonte 1,494 and Curitiba 639. They add up to 6,000, one for each order, and they are the same four numbers SQL-4 gave you. The pile's name came from the other collection. It is the same question on the same data, and only the spelling is new."
    note: "MG-5 thought 3. The learner has already used the pieces: the dot (MG-2), the dollar sign (MG-3). SQL-4's 639, 1,375, 1,494 and 2,492 are repeated here, so the echo is exact."

  # 6
  - kind: "classmate"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "lookup-stage", "lookup-gives-a-list", "unwind-stage", "join", "join-on", "mongo-pile-by-looked-up"]
    supplies: ["{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}"]
    text: |-
      Davi was asked: show each restaurant cuisine with the average `delivery_fee` of its orders. He looked up the restaurants, and made the piles by the cuisine, and wrote:

      ```js
      db.orders.aggregate([
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$group: {_id: "$restaurant.cuisine", avg: {$avg: "$delivery_fee"}}}
      ])
      ```

      Six piles came back and the averages look reasonable. But look at the pile names. Each one is in square brackets: ["pizza"], ["arabe"], not the plain word. Davi, what is `restaurant` after a lookup? ... A list. So `restaurant.cuisine` is a list that holds one cuisine, and each pile is named by a list. Nothing failed. The names are only odd, and a pile named by a list is no use to anyone who wants to read the cuisine. What should he have written?
    model: |-
      db.orders.aggregate([
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$unwind: "$restaurant"},
        {$group: {_id: "$restaurant.cuisine", avg: {$avg: "$delivery_fee"}}}
      ])
    rows: 6
    result: [["saudavel", 5.061878], ["brasileira", 5.289885], ["hamburguer", 5.343543], ["arabe", 5.162219], ["japonesa", 5.137149], ["pizza", 5.218509]]
    narration:
      - "Six cuisines, from 5.06 to 5.34, named by plain words now. The unwind took the list apart before the piles were made."
      - "Look up, unwind, then pile by the looked-up cuisine, and average the delivery fee."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$unwind: "$restaurant"},
            {$group: {_id: "$restaurant.cuisine", avg: {$avg: "$delivery_fee"}}}
          ])
        ask: "There is no restaurant on an order until something puts it there. What is missing?"
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$group: {_id: "$restaurant_id", avg: {$avg: "$delivery_fee"}}}
          ])
        ask: "Those are sixty piles named by number. Which field holds the cuisine, and where does it live?"
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$group: {_id: "restaurant.cuisine", avg: {$avg: "$delivery_fee"}}}
          ])
        ask: "One pile, named with the plain words. What does a dollar sign in front of a field name do, inside quotes?"
    walk:
      - "Look up each order's restaurant and take the list apart."
      - "Now make the piles by the cuisine on the restaurant, and say the average delivery_fee of each."
    return:
      text: "Show each restaurant city with the average `delivery_fee` of its orders. Look up the restaurant with `{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}`, unwind the list, and make piles by the city."
      model: |-
        db.orders.aggregate([
          {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
          {$unwind: "$restaurant"},
          {$group: {_id: "$restaurant.city", avg: {$avg: "$delivery_fee"}}}
        ])
      rows: 4
      result: [["Rio de Janeiro", 5.159804], ["Belo Horizonte", 5.320428], ["São Paulo", 5.146685], ["Curitiba", 5.335086]]
      narration:
        - "Four cities, each with an average fee. The list was taken apart before the piles were made."
        - "Look up, unwind, pile by the looked-up city, average."
    note: "Davi makes the predictable slip one step before the learner could (rule E6): he forgets that the lookup brings a list. Nothing errors. The pile names are lists, which is the visible symptom, and the real reason (a lookup cannot know how many) was given in step 3. First use of the new pile."

  # 7
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "lookup-stage", "lookup-gives-a-list", "unwind-stage", "join", "join-on", "mongo-pile-by-looked-up", "sort-and-limit-stages"]
    supplies: ["{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}"]
    ordered: true
    text: "Among the orders whose `status` is \"delivered\", show the two restaurant names with the most orders, each with its number of orders `n`, the biggest first. The name is the `name` of the restaurant, so look it up with `{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}`."
    model: |-
      db.orders.aggregate([
        {$match: {status: "delivered"}},
        {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
        {$unwind: "$restaurant"},
        {$group: {_id: "$restaurant.name", n: {$sum: 1}}},
        {$sort: {n: -1}},
        {$limit: 2}
      ])
    rows: 2
    result: [["Rest 02", 113], ["Rest 24", 112]]
    narration:
      - "Rest 02 with 113 and Rest 24 with 112. The same two restaurants you met by number in the pipeline lesson, now by name, which only a lookup can give."
      - "Keep the delivered orders, look up the restaurants, pile by the name, sort, cut: every part in the order it happens."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$group: {_id: "$restaurant.name", n: {$sum: 1}}},
            {$sort: {n: 1}},
            {$limit: 2}
          ])
        ask: "Those are the two smallest. Which way does the sort put the biggest first?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$group: {_id: "$restaurant.name", n: {$sum: 1}}},
            {$sort: {n: -1}}
          ])
        ask: "Every restaurant is here. Which stage keeps only the first two?"
      - code: |-
          db.orders.aggregate([
            {$match: {status: "delivered"}},
            {$group: {_id: "$restaurant_id", n: {$sum: 1}}},
            {$sort: {n: -1}},
            {$limit: 2}
          ])
        ask: "Those are numbers. I asked for the names. Where does the name live, and what puts it on the order?"
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
            {$unwind: "$restaurant"},
            {$group: {_id: "$restaurant.name", n: {$sum: 1}}},
            {$sort: {n: -1}},
            {$limit: 2}
          ])
        ask: "Those counts include the cancelled orders. Which stage drops them?"
    walk:
      - "Keep the delivered orders, look up the restaurant and unwind the list."
      - "Make piles by the restaurant's name and count the orders in each."
      - "Sort, the biggest first, and keep two."
    return:
      text: "Among the orders whose `status` is \"delivered\", show the two restaurant cities with the most orders, each with its number of orders `n`, the biggest first. The city is on the restaurant, so look it up with `{$lookup: {from: \"restaurants\", localField: \"restaurant_id\", foreignField: \"_id\", as: \"restaurant\"}}`."
      model: |-
        db.orders.aggregate([
          {$match: {status: "delivered"}},
          {$lookup: {from: "restaurants", localField: "restaurant_id", foreignField: "_id", as: "restaurant"}},
          {$unwind: "$restaurant"},
          {$group: {_id: "$restaurant.city", n: {$sum: 1}}},
          {$sort: {n: -1}},
          {$limit: 2}
        ])
      ordered: true
      rows: 2
      result: [["São Paulo", 2332], ["Belo Horizonte", 1405]]
      narration:
        - "São Paulo with 2,332 and Belo Horizonte with 1,405, the two biggest piles."
        - "Keep, look up, unwind, pile by the city, sort, cut."
    note: "Echoes MG-3's closing sentence (restaurants 2 and 24, 113 and 112), now by name. The third is Rest 59 with 109, so no tie at the cut. Match first, as the thinking order goes, though match after the lookup gives the same piles."

  # 8
  - kind: "aside"
    lang: "mongo"
    data: "mongo"
    new: ["why-items-inside"]
    text: "Something that is only interesting, with nothing in it to keep. You have now met two ways to hold a fact next to an order. The dishes sit inside the order, as a list, and need only an unwind. The restaurant sits outside, in its own collection, and needs a lookup. Why the difference? A dish line belongs to its order alone: nobody else owns \"two Margheritas on order 100001\", and nobody asks about it apart from its order. A restaurant is the opposite. Hundreds of orders point to the same one. If every order carried its own copy, the city would be written a hundred times, and a restaurant that moved would need a hundred corrections. So it lives once, outside, and the orders point to it by `restaurant_id`. That is the reason for a lookup. People sometimes copy a little of it inside anyway, for speed, and that is a choice and not a law."
    note: "Name-only aside (decision C10), never required and never asked. Relief after the first climb. The reason is the real one (a thing owned by one order versus a thing many orders share), so it is told as interesting and not as a rule."

  # 9
  - kind: "classmate"
    lang: "mongo"
    data: "mongo"
    new: ["lookup-keeps-unmatched"]
    requires: ["pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries", "lookup-stage", "lookup-gives-a-list", "unwind-stage", "join", "join-on"]
    supplies: ["{$lookup: {from: \"coupons\", localField: \"coupon_code\", foreignField: \"_id\", as: \"coupon\"}}"]
    text: |-
      Ana wanted to be sure that sticking each order's coupon on loses no order. So she looked up the coupon of every order, `{$lookup: {from: "coupons", localField: "coupon_code", foreignField: "_id", as: "coupon"}}`, unwound it, and counted the orders in each status. She wrote:

      ```js
      db.orders.aggregate([
        {$lookup: {from: "coupons", localField: "coupon_code", foreignField: "_id", as: "coupon"}},
        {$unwind: "$coupon"},
        {$group: {_id: "$status", n: {$sum: 1}}}
      ])
      ```

      It ran without a word. Delivered 1,769 and cancelled 115. Ana, add them up. ... 1,884. And how many orders are there? ... 6,000. Where did 4,116 orders go? Look at what `coupon_code` holds on those orders: nothing, the field is absent. An order with no coupon finds no match, so its `coupon` list is empty, and `$unwind` of an empty list produces nothing. The order is thrown away. The lookup alone keeps every order, with an empty list where nothing matched. To count the orders, she should leave the unwind out. What should she have written?
    model: |-
      db.orders.aggregate([
        {$lookup: {from: "coupons", localField: "coupon_code", foreignField: "_id", as: "coupon"}},
        {$group: {_id: "$status", n: {$sum: 1}}}
      ])
    rows: 2
    result: [["cancelled", 399], ["delivered", 5601]]
    narration:
      - "Delivered 5,601 and cancelled 399: 6,000 in all, and nobody lost. The lookup kept every order, and the unwind, which was not needed, is gone."
      - "Look up, and pile by status without unwinding. An empty list is still a document that stays."
      - ""
    wrong:
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "coupons", localField: "coupon_code", foreignField: "_id", as: "coupon"}},
            {$match: {coupon: {$size: 0}}},
            {$group: {_id: "$status", n: {$sum: 1}}}
          ])
        ask: "That counts only the orders with no coupon. Which orders did Ana want to count?"
      - code: |-
          db.orders.aggregate([
            {$lookup: {from: "coupons", localField: "coupon_code", foreignField: "_id", as: "coupon"}},
            {$unwind: "$coupon"},
            {$group: {_id: "$status", n: {$sum: 1}}}
          ])
        ask: "That is Ana's sentence again. Which stage throws an order away when its list is empty?"
