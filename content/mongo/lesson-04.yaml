  # 18
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["computed-value"]
    text: |-
      One last thing, and it is one you would look up. A line of an order earns its quantity times its price, and neither of those is a field on its own. A value can be worked out from fields and put where a field stood. The spelling, which I will always give you, is `{$multiply: ["$items.qty", "$items.price"]}`: the multiplying word, with the two values to multiply in a list. Inside a pile it is added up like any value. In SQL this was SUM(qty * price):

      ```js
      db.orders.aggregate([{$unwind: "$items"}, {$group: {_id: "$status", earned: {$sum: {$multiply: ["$items.qty", "$items.price"]}}}}])
      ```

      Run it.
    shows:
      - "db.orders.aggregate([{$unwind: \"$items\"}, {$group: {_id: \"$status\", earned: {$sum: {$multiply: [\"$items.qty\", \"$items.price\"]}}}}])"
    after_run: "337,069.25 for the delivered orders and 23,816.10 for the cancelled ones. Together they make 360,885.35, which is the sum of all the subtotals: the dishes add up to the orders. What you carry away is the idea: a value can be worked out, and put where a field name stood. The spelling of $multiply is one to look up when you need it, and I will always give it to you."
    note: "Shape grade (decision C10): the teacher supplies the spelling every time and says it is one to look up. The floating sums are compared to six places by the checker, so the order they are added in cannot fail an answer."

