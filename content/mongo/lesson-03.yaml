lesson: mg-03
title: "The pipeline"
strand: mongo
stage: 1
thoughts:
  pipeline-of-stages: "`aggregate` takes a list of stages, in the order things happen. Each stage takes the table the one before it made. A table goes in, a table comes out."
  match-stage: "`{$match: {status: \"delivered\"}}` is a stage that keeps rows. It holds the same question document as `find`."
  group-pile-name: "`{$group: {_id: ...}}` makes the piles. Whatever follows `_id` is the name every document is given, and one document comes out per pile."
  field-value: "`\"$restaurant_id\"` in quotes means the value of that field in each document. Without the dollar it is only the word."
  group-summaries: "What to say about each pile is written beside `_id`: `n: {$sum: 1}` counts, `avg: {$avg: \"$subtotal\"}` averages, `big: {$max: \"$subtotal\"}` takes the biggest."
  sort-and-limit-stages: "`{$sort: {n: -1}}` and `{$limit: 5}` are stages too, in the same words as before. The order of the stages is the order things happen."
  match-after-group: "A `$match` after a `$group` asks the piles, not the rows. It is `HAVING`, and it is the same word as `WHERE` in a different place."
steps:
  # 1
  - kind: "cold-check"
    lang: "mongo"
    data: "mongo"
    requires: ["collection", "question-is-a-document", "two-names-both-hold", "operator-documents", "absent-field", "choose-fields", "id-comes-unless-off", "sort-spelling", "limit-spelling"]
    ordered: true
    text: "From orders, keep the orders that have no coupon_code and a subtotal above 100. Show the _id and subtotal of the 3 orders with the smallest subtotal, the smallest first."
    model: "db.orders.find({coupon_code: {$exists: false}, subtotal: {$gt: 100}}, {subtotal: 1}).sort({subtotal: 1}).limit(3)"
    rows: 3
    result: [[102692, 100.02], [100798, 100.09], [102508, 100.19]]
    after_run: "That is where we stopped last time. On we go."
    note: "Opening cold check from MG-2: an absent field, a comparison, chosen fields, a sort and a cut, in a combination not practised before. 100.02, 100.09 and 100.19 are followed by 100.21, so there is no tie at the cut. Never scored."

  # 2
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["pipeline-of-stages"]
    text: |-
      Now a new word, `aggregate`. It is where piles live, and much more besides. First its shape, before there are any piles.

      Remember how SQL is written? The answer comes first, SELECT, but you think it table first: from the table, keep rows, make piles, say something about each pile, keep piles, sort, cut. `aggregate` is written in that thinking order. It takes a list in square brackets, and each thing in the list is one stage, one step of the thinking. Each stage takes the table the one before it made and hands a table on. A table goes in, a table comes out, at every stage. Here is the shortest list there is, with no stages at all:

      ```js
      db.orders.aggregate([])
      ```

      Run it.
    shows:
      - "db.orders.aggregate([])"
    after_run: "All 6,000 orders came out, as `find()` showed them. With no stage, nothing happened to the table. Every stage we add from here on is one step of the thinking, written in the order it happens, and each one takes the table that the one before it left."
    note: "The shape first, with nothing else to learn (rule B3: use first). The empty list is the smallest legal pipeline and shows 'a table in, the same table out' without introducing $match early. The thinking order of SQL-2 is imported aloud."

  # 3
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["match-stage"]
    text: |-
      The first stage to put in the list is the one that keeps rows. In SQL that was WHERE, and in `find` it was the question document. In a pipeline it is a stage called `$match`, and inside it goes the very same question document you already know. Its name starts with a dollar sign, as `$gt` did. Here it keeps the delivered orders:

      ```js
      db.orders.aggregate([{$match: {status: "delivered"}}])
      ```

      Run it.
    shows:
      - "db.orders.aggregate([{$match: {status: \"delivered\"}}])"
    after_run: "5,601 orders: the delivered ones, exactly what `find({status: \"delivered\"})` gave. Six thousand went in and 5,601 came out. `$match` is WHERE, keeping rows, and what sits in its braces is the question you have been writing since the first sitting of this strand."
    note: "match-stage reuses the question document the learner owns, so only the stage's name is new (rule B7). 5,601 echoes MG-1 and SQL-1."

  # 4
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["collection", "from-table", "keep-rows", "question-is-a-document", "two-names-both-hold", "operator-documents", "dotted-name", "pipeline-of-stages", "match-stage"]
    text: "Write a pipeline with one stage on orders. The stage keeps the orders whose delivery.rain is true and whose subtotal is more than 165. Show those orders."
    thinking_order: "From orders, one stage that keeps the orders delivered in the rain with a subtotal above 165."
    model: "db.orders.aggregate([{$match: {\"delivery.rain\": true, subtotal: {$gt: 165}}}])"
    rows: 5
    narration:
      - "Five orders. A list with one stage in it, and the stage is the question you know, with a dotted name and a comparison, joined by a comma."
      - "From orders, keep the rain orders above 165: `$match` holding the same question document as `find`."
      - ""
    wrong:
      - code: "db.orders.aggregate([{$match: {\"delivery.rain\": true}}])"
        ask: "That keeps every order delivered in the rain, a lot more than five. Which second question is missing?"
        why: "both names in the question must hold, and a comma between them says so, as it did in `find`."
      - code: "db.orders.aggregate([{$match: {rain: true, subtotal: {$gt: 165}}}])"
        ask: "Nothing came out. Is rain a field of the order itself, or is it inside another field? How was a field inside a field written?"
        why: "rain lives inside delivery, so its name is the two joined by a dot, in quotes."
      - code: "db.orders.aggregate([{$match: {\"delivery.rain\": true, subtotal: {$gt: 150}}}])"
        ask: "Ten orders came back. Is the line at 150 or at 165?"
    walk:
      - "Start with the table and the list: `db.orders.aggregate(` and square brackets, with one stage inside."
      - "The stage keeps rows, so it is `$match`, with the question document inside its braces. Ask about the rain first, with a dotted name in quotes."
      - "Add the second question about the subtotal in the same braces, after a comma."
    return:
      text: "Write a pipeline with one stage on restaurants. The stage keeps the restaurants whose city is \"Curitiba\" and whose cuisine is \"pizza\". Show those restaurants."
      model: "db.restaurants.aggregate([{$match: {city: \"Curitiba\", cuisine: \"pizza\"}}])"
      rows: 2
      result: [[23, "Rest 23", "Curitiba", "pizza", "2024-10-24T00:00:00Z"], [32, "Rest 32", "Curitiba", "pizza", "2025-03-06T00:00:00Z"]]
      narration:
        - "The pizza places of Curitiba. A list of one stage, and in it the two questions you know, joined by a comma."
        - "`$match` on restaurants: both words in quotes, written exactly as the data has them."
    note: "First typed stage. The echo is deliberate: it is the question document the learner already owns inside a new stage, so only the wrapper is new. The five orders are the five of MG-2's closing sentence. Not ordered: no sort."

  # 5
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["group-pile-name"]
    text: |-
      Now piles. In SQL that was GROUP BY, and the pile's name had to be asked for. A `$group` stage makes piles too, and the name goes in a field called `_id`. It is the same `_id` as in a document: here it is the pile's name. Watch what happens when the name is just a word that I choose:

      ```js
      db.orders.aggregate([{$group: {_id: "all orders"}}])
      ```

      Run it.
    shows:
      - "db.orders.aggregate([{$group: {_id: \"all orders\"}}])"
    after_run: "One document came out, and it is one pile. Its `_id` is the name we wrote: all orders. This is what `$group` does: every document is given a name, whatever follows `_id`, and the documents that were given the same name go into the same pile. Here every order was given the same name, so there is one pile. One document comes out for each pile, as one row did in SQL, and the pile's name sits in `_id`."
    note: "The pile name arrives with a constant so that field-value in the next step can be seen as a contrast: the same plain word gives one pile, and a dollar gives one pile per value. There is no typed step on a constant name on purpose: a pile of everything says nothing yet and would only bait."

  # 6
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["field-value"]
    text: |-
      Now the real thing: one pile for each restaurant. Every order has a restaurant_id, so we want each order to be given its own restaurant_id as its name. Try the obvious way first, the field's name in quotes. Then the same with one character in front:

      ```js
      db.orders.aggregate([{$group: {_id: "restaurant_id"}}])
      db.orders.aggregate([{$group: {_id: "$restaurant_id"}}])
      ```

      Run the first, then the second.
    shows:
      - "db.orders.aggregate([{$group: {_id: \"restaurant_id\"}}])"
      - "db.orders.aggregate([{$group: {_id: \"$restaurant_id\"}}])"
    after_run: "The first made one pile, named with the plain word restaurant_id, just as all orders did: in quotes, a word is only a word, so every order was given that same name. The second made sixty piles, one for each restaurant, named by their ids, such as 14, 4 and 27. The dollar sign in front said: not the word, but the value of that field in each order. Order 100001 is from restaurant 14, so it was given the name 14, and it went into the pile of the other orders from restaurant 14. It is the same dollar sign that begins `$match` and `$gt`, doing a second job here: it tells a field from a word. There is nothing to remember except what you just saw."
    note: "The one place a character does two jobs (map note, rule B5). The reason is seen, not told: the plain word gives one pile and the dollar gives sixty. After_run says the two jobs of the character aloud."

  # 7
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["collection", "from-table", "piles", "one-row-per-pile", "pile-name", "pipeline-of-stages", "group-pile-name", "field-value"]
    text: "Write a pipeline with one stage on restaurants. The stage makes one pile for each value of cuisine. Show the piles."
    thinking_order: "From restaurants, a pile for each cuisine."
    model: "db.restaurants.aggregate([{$group: {_id: \"$cuisine\"}}])"
    rows: 6
    result: [["arabe"], ["saudavel"], ["brasileira"], ["hamburguer"], ["japonesa"], ["pizza"]]
    narration:
      - "Six piles, one for each cuisine, named by the cuisine itself. Each restaurant was given its own cuisine as its name."
      - "A `$group` with the field's value after `_id`: the dollar sign said it is the field and not the word."
      - ""
    wrong:
      - code: "db.restaurants.aggregate([{$group: {_id: \"cuisine\"}}])"
        ask: "One document came out, named cuisine. What did we put in front of a field's name to mean its value?"
        why: "in quotes a word is only a word. The dollar sign says it is a field, and then each restaurant is given its own cuisine as its name."
      - code: "db.restaurants.aggregate([{$group: {_id: \"$city\"}}])"
        ask: "Those are four piles, named by the cities. Which field did the prompt say to pile by?"
      - code: "db.orders.aggregate([{$group: {_id: \"$cuisine\"}}])"
        ask: "One pile, named nothing, came out. Which collection holds the cuisine?"
        why: "an order has no cuisine, so every order was given the same empty name. The restaurants hold the cuisine."
    walk:
      - "Start with the table and the list: `db.restaurants.aggregate(` and square brackets, with one stage inside."
      - "The stage makes piles, so it is `$group`, and the pile's name goes after `_id`."
      - "Each restaurant should be named by its own cuisine: the field's name in quotes, with the sign that means its value."
    return:
      text: "Write a pipeline with one stage on couriers. The stage makes one pile for each value of vehicle. Show the piles."
      model: "db.couriers.aggregate([{$group: {_id: \"$vehicle\"}}])"
      rows: 3
      result: [["moto"], ["bike"], ["carro"]]
      narration:
        - "Three piles: bike, moto and carro. Each courier was given its own vehicle as its name."
        - "The dollar sign made it the value of the field, and each value is one pile."
    note: "First typed `$group`. The learner has just watched the plain word and the dollar side by side. Wrong answers cover the missing dollar (the one real slip of this thought), a wrong field, and a wrong collection, whose empty name is itself a lesson about absent fields. The cuisines are not ordered, so the answer is a set."

  # 8
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["collection", "from-table", "keep-rows", "piles", "one-row-per-pile", "pile-name", "keep-before-piles", "two-names-both-hold", "operator-documents", "dotted-name", "pipeline-of-stages", "match-stage", "group-pile-name", "field-value"]
    text: "Write a pipeline with two stages on orders. The first stage keeps the orders whose delivery.rain is true and whose subtotal is more than 150. The second makes one pile for each value of restaurant_id. Show the piles."
    thinking_order: "From orders, keep the rain orders above 150, then make a pile for each restaurant_id."
    model: "db.orders.aggregate([{$match: {\"delivery.rain\": true, subtotal: {$gt: 150}}}, {$group: {_id: \"$restaurant_id\"}}])"
    rows: 10
    narration:
      - "Ten piles: the ten restaurants that had a rain order above 150. The first stage kept the rows, and the second piled what it handed on."
      - "Keep rows, then make piles: two stages in the order they happen, each taking the table the one before it made."
      - ""
    wrong:
      - code: "db.orders.aggregate([{$group: {_id: \"$restaurant_id\"}}, {$match: {\"delivery.rain\": true, subtotal: {$gt: 150}}}])"
        ask: "Nothing came out. After the $group stage, what does each document of the table hold: an order, or a pile?"
        why: "each stage takes the table the one before made. After a $group the table is the piles, and a pile has no delivery and no subtotal."
      - code: "db.orders.aggregate([{$group: {_id: \"$restaurant_id\"}}])"
        ask: "That is all sixty restaurants. Where do we keep only the rain orders above 150?"
      - code: "db.orders.aggregate([{$match: {\"delivery.rain\": true, subtotal: {$gt: 150}}}, {$group: {_id: \"restaurant_id\"}}])"
        ask: "One pile, named with a word. What makes each restaurant its own pile?"
    walk:
      - "First stage: keep the orders delivered in the rain with a subtotal above 150, in a `$match`."
      - "Second stage: a `$group` that makes one pile for each restaurant_id. Remember the sign for the value of a field."
    return:
      text: "Write a pipeline with two stages on orders. The first stage keeps the orders whose coupon_code is \"PIZZA20\" and whose subtotal is more than 120. The second makes one pile for each value of restaurant_id. Show the piles."
      model: "db.orders.aggregate([{$match: {coupon_code: \"PIZZA20\", subtotal: {$gt: 120}}}, {$group: {_id: \"$restaurant_id\"}}])"
      rows: 6
      result: [[58], [55], [21], [19], [41], [13]]
      narration:
        - "Six restaurants had a PIZZA20 order above 120. Keep rows, then pile them."
        - "A `$match` first, a `$group` after it: the order things happen."
    note: "Two stages, match then group: the order of stages is the order of events (the first time it is asked). The wrong answer with the stages reversed gives an empty result without an error, which Ana's step later explains in full. The ten restaurants are a set."

  # 9
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["group-summaries"]
    text: |-
      A pile with a name is only half of it. In SQL you also said something about each pile: COUNT(*), AVG(subtotal), MAX(subtotal). That is written here beside `_id`, in the same braces: a name you choose, a colon, and the summary. `{$sum: 1}` adds one for each document in the pile, which is exactly COUNT(*). `{$avg: ...}` and `{$max: ...}` take the value of a field, so the dollar sign comes in again, in quotes, as before. Two sentences. The first counts the restaurants of each cuisine. The second says the average and the biggest subtotal of each status:

      ```js
      db.restaurants.aggregate([{$group: {_id: "$cuisine", n: {$sum: 1}}}])
      db.orders.aggregate([{$group: {_id: "$status", avg: {$avg: "$subtotal"}, big: {$max: "$subtotal"}}}])
      ```

      Run them one at a time.
    shows:
      - "db.restaurants.aggregate([{$group: {_id: \"$cuisine\", n: {$sum: 1}}}])"
      - "db.orders.aggregate([{$group: {_id: \"$status\", avg: {$avg: \"$subtotal\"}, big: {$max: \"$subtotal\"}}}])"
    after_run: "Six cuisines, each with its count: 13 hamburguer, 11 brasileira, 10 japonesa and 10 saudavel, 8 pizza and 8 arabe, the same counts SQL gave you. And two statuses, with the averages you met in the first sitting, 60.43 for delivered and 59.99 for cancelled, and the biggest subtotal of each. The names n, avg and big are mine, and you can choose any others. What follows each colon is the summary. `$min` and `$sum` of a field work in the same way, as MIN and SUM did, and as in SQL the average and the biggest skip the orders that have no subtotal."
    note: "One thought, three spellings (the map's row 5). `$sum: 1` has a real reason (one for each document, which is COUNT(*)). The averages echo SQL-1 (59.99 and 60.43). The name of the summary is free, which is also stated, so nothing is left as a rule to remember."

  # 10
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["collection", "from-table", "piles", "one-row-per-pile", "pile-name", "count-rows", "summary-per-pile", "pipeline-of-stages", "group-pile-name", "field-value", "group-summaries"]
    text: "Write a pipeline with one stage on couriers. The stage makes one pile for each value of city. Show each pile's name with the number of couriers in it."
    thinking_order: "From couriers, a pile for each city, the name and how many couriers."
    model: "db.couriers.aggregate([{$group: {_id: \"$city\", n: {$sum: 1}}}])"
    rows: 4
    result: [["Belo Horizonte", 32], ["Rio de Janeiro", 49], ["São Paulo", 89], ["Curitiba", 30]]
    narration:
      - "Four cities, each with its number of couriers: São Paulo 89, Rio de Janeiro 49, Belo Horizonte 32 and Curitiba 30."
      - "The pile's name after `_id`, and beside it a name of your own with a sum of 1 for each courier."
      - ""
    wrong:
      - code: "db.couriers.aggregate([{$group: {_id: \"$city\"}}])"
        ask: "Four names, and no numbers. What is said about each pile, and where is it written?"
      - code: "db.couriers.aggregate([{$group: {_id: \"$city\", n: {$sum: \"$city\"}}}])"
        ask: "Every number is 0. What does $sum add up, and what should it add for each courier?"
        why: "$sum adds whatever follows it, and the value of a text field adds nothing. To count, add 1 for each document."
      - code: "db.couriers.aggregate([{$group: {_id: \"city\", n: {$sum: 1}}}])"
        ask: "One pile of 200. What turns the word city into each courier's own city?"
    walk:
      - "Make the piles: a `$group` on couriers, with each courier named by its own city."
      - "Beside `_id`, add a name of your own and say what to say about each pile."
      - "Counting is a sum of 1 for each document."
    return:
      text: "Write a pipeline with one stage on orders. The stage makes one pile for each value of promised_minutes. Show each pile's name with the number of orders in it."
      model: "db.orders.aggregate([{$group: {_id: \"$promised_minutes\", n: {$sum: 1}}}])"
      rows: 3
      result: [[40, 2003], [30, 2019], [50, 1978]]
      narration:
        - "Three piles: 30 with 2,019 orders, 40 with 2,003 and 50 with 1,978."
        - "The same movement on a number field: its value names the pile, and a sum of 1 counts each one."
    note: "Counting the piles: the thought, plainly and typed once. The `$sum: \"$city\"` slip gives a column of zeros and is a nice real reason. No ties matter: the answer is a set."

  # 11
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["collection", "from-table", "keep-rows", "piles", "one-row-per-pile", "pile-name", "summary-column", "keep-before-piles", "dotted-name", "pipeline-of-stages", "match-stage", "group-pile-name", "field-value", "group-summaries"]
    text: "Write a pipeline with two stages on orders. The first stage keeps the orders whose delivery.rain is true. The second makes one pile for each value of promised_minutes. Show each pile's name with the average subtotal of its orders."
    thinking_order: "From orders, keep the rain orders, a pile for each promised_minutes, the name and the average subtotal."
    model: "db.orders.aggregate([{$match: {\"delivery.rain\": true}}, {$group: {_id: \"$promised_minutes\", avg: {$avg: \"$subtotal\"}}}])"
    rows: 3
    result: [[30, 61.36], [50, 58.63], [40, 59.76]]
    narration:
      - "30 with about 61.36, 40 with about 59.76 and 50 with about 58.63. Keep the rain orders, pile them by promise, average each pile."
      - "Two stages in the order they happen: the rows are kept first, and the piles are made from what is left."
      - ""
    wrong:
      - code: "db.orders.aggregate([{$group: {_id: \"$promised_minutes\", avg: {$avg: \"$subtotal\"}}}])"
        ask: "Those averages are of every order. Where do we keep only the rain orders?"
      - code: "db.orders.aggregate([{$group: {_id: \"$promised_minutes\", avg: {$avg: \"$subtotal\"}}}, {$match: {\"delivery.rain\": true}}])"
        ask: "Nothing came out. After the $group, does each document of the table still hold a delivery?"
        why: "after a $group the table is the piles. A pile has an _id and the summaries you named, and nothing else."
      - code: "db.orders.aggregate([{$match: {\"delivery.rain\": true}}, {$group: {_id: \"$promised_minutes\", avg: {$avg: \"subtotal\"}}}])"
        ask: "The averages are empty. What did we put in front of a field's name to mean its value?"
        why: "without the dollar it is only the word subtotal, and a word has no average."
    walk:
      - "First stage: keep the orders delivered in the rain."
      - "Second stage: a `$group` with each order named by its own promised_minutes."
      - "Beside `_id`, name the summary and say the average of the subtotal, with a sign for the value of a field."
    return:
      text: "Write a pipeline with two stages on orders. The first stage keeps the orders whose status is \"cancelled\". The second makes one pile for each value of promised_minutes. Show each pile's name with the biggest subtotal in it."
      model: "db.orders.aggregate([{$match: {status: \"cancelled\"}}, {$group: {_id: \"$promised_minutes\", big: {$max: \"$subtotal\"}}}])"
      rows: 3
      result: [[30, 154.09], [50, 149.44], [40, 165.25]]
      narration:
        - "The biggest cancelled subtotal for each promise: 165.25 for 40, 154.09 for 30 and 149.44 for 50."
        - "Keep the cancelled orders, pile them by promise, take the biggest of each pile."
    note: "Keep, pile, say: three movements in the order they happen, with an average (which skips absent subtotals, as the give of step 9 said). The two stages in reverse give an empty result: another view of 'a stage takes the table the one before made'."

  # 12
  - kind: "give"
    lang: "mongo"
    data: "mongo"
    new: ["sort-and-limit-stages"]
    text: |-
      Two more stages, and you know their words. After a `find` you wrote `.sort({...})` and `.limit(...)`. In a pipeline they are stages, with the same words in the braces: `{$sort: {n: -1}}` puts the table in order, the biggest n first, and `{$limit: 2}` keeps the first two of what is left. They come after the `$group` for the reason they came last in SQL: the piles have to exist before they can be put in order. A stage works on the table the one before it made, so the order of the stages is the order things happen. The two cuisines with the most restaurants:

      ```js
      db.restaurants.aggregate([{$group: {_id: "$cuisine", n: {$sum: 1}}}, {$sort: {n: -1}}, {$limit: 2}])
      ```

      Run it.
    shows:
      - "db.restaurants.aggregate([{$group: {_id: \"$cuisine\", n: {$sum: 1}}}, {$sort: {n: -1}}, {$limit: 2}])"
    after_run: "Hamburguer with 13 and brasileira with 11, the same two cuisines that ORDER BY and LIMIT gave you in SQL. The sort used the name n that we chose beside `_id`, as ORDER BY used the count. And the minus one is the one you know: biggest first. Three stages, and a table going in and coming out of each."
    note: "Both words are owned already; only their place, as stages, is new. The same pair as the SQL-3 opening check (hamburguer 13, brasileira 11, no tie at the cut). The stage order is stated, and Ana's step shows it from the other side."

  # 13
  - kind: "ask"
    lang: "mongo"
    data: "mongo"
    requires: ["collection", "from-table", "piles", "one-row-per-pile", "pile-name", "summary-per-pile", "sort", "sort-direction", "cut", "sort-by-summary", "pipeline-of-stages", "group-pile-name", "field-value", "group-summaries", "sort-and-limit-stages"]
    ordered: true
    text: "Write a pipeline with three stages on couriers. The first makes one pile for each value of vehicle, with the number of couriers in it. The second puts the piles in order, the biggest number first. The third keeps the first 2 piles. Show each pile's name with its number."
    thinking_order: "From couriers, a pile for each vehicle with how many, the biggest first, the first 2."
    model: "db.couriers.aggregate([{$group: {_id: \"$vehicle\", n: {$sum: 1}}}, {$sort: {n: -1}}, {$limit: 2}])"
    rows: 2
    result: [["moto", 110], ["bike", 73]]
    narration:
      - "Moto with 110, then bike with 73. Piles first, then the order, then the cut: each stage works on the table the one before left."
